:root{--cb:#9A6500;--cc:#D19A1D;--cx1:#007277;--cx2:#2FA9A3;--ca:#0072B2;--cu:#85609E;--cv:#CE65A2;--cs:#59A3CD;--csg:#72B161;--blau:#0072B2;--blau-d:#00527F;--gruen:#26870C;--lila:#85609E;--orange:#D55E00;--rot:#B24A45;--pink:#CC79A7;
  --grau:#6E6E6E;--dgrau:#5B6672;--text:#1F2933;--rand:#D9DFE6;--bg:#F3F5F8;--hand:'Indie Flower',cursive;--satz:'Libertinus Sans',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(14px,min(1.9vw,2.9vh),21px)}
html,body{margin:0;height:100%}
body{font-family:var(--satz);color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;line-height:1.3;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:.18rem solid #F2B705;outline-offset:.12rem}
i{font-style:italic}
sup{font-size:.62em;line-height:0;vertical-align:.58em;margin-left:.04em}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto}
#app.tr{height:100vh;height:100dvh}
.luft{flex:1}

/* ---------- Kopf ---------- */
.kopf{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;min-height:3.3rem;flex-wrap:wrap}
.kopf h1{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:2rem;margin:0;line-height:1;white-space:nowrap}
/* happymatty: Kopfzeile der Startseite, Variante A (Lehrkraft 19.11.2026), wie die Kopfleiste von happymatty.de */
.kopf .logo{flex:none;display:flex;align-items:center;gap:.5rem;color:var(--text);text-decoration:none}
.kopf .logo img{width:2.1rem;height:2.1rem;border-radius:22%;display:block}
.kopf .logo span{font-family:var(--satz);font-weight:700;font-size:1.05rem;white-space:nowrap}
.skopf{padding:0 .9rem;text-align:center}
.szeile{margin:0;padding:0 0 .35rem;border-bottom:1px solid var(--blau);font-family:var(--hand);font-size:1.1rem;color:var(--grau)}
.szeile a{color:inherit;text-decoration:none}
.szeile a:hover,.szeile a:focus-visible{text-decoration:underline}
.szeile .thema{color:var(--gruen)}
.szeile .teilthema{color:var(--lila)}
.szeile .thema,.szeile .teilthema{white-space:nowrap} /* Umbruch am Mittelpunkt, nicht im Namen */
.skopf h1{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:2.4rem;line-height:1.1;margin:.6rem 0 0}
.sunter{margin:.1rem 0 .5rem;color:var(--grau);font-size:.95rem}
.sfuss{margin:0 .9rem .6rem;padding:.4rem 0 0;border-top:1px solid var(--blau);text-align:center;font-family:var(--hand);font-size:1.05rem;color:var(--grau)}
.sfuss .name{color:var(--gruen)}
.sfuss a{color:inherit;text-decoration:none;white-space:nowrap}.sfuss a:hover,.sfuss a:focus-visible{text-decoration:underline}
@media (max-width:760px){.sfuss{margin:0 .6rem .6rem}}
/* happymatty: Zurück-Knopf (Logo) oben links und Datenschutz in der kleinen Zeile (CLAUDE.md der Webseite) */
.kn{background:#fff;border:1.5px solid #B9C4D0;border-radius:.55rem;padding:.25rem .75rem;font-weight:700;font-size:.95rem;min-height:2.4rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem;color:#39424C}
.kn:active,.hk:active{transform:translateY(1px)}
.kn.ton,.kn.voll{padding:.25rem .55rem}
.kn.ton svg,.kn.voll svg{width:1.3rem;height:1.3rem;display:block}
.blase{position:fixed;z-index:80;max-width:min(20rem,86vw);background:#1F2933;color:#fff;border-radius:.6rem;padding:.55rem .8rem;font-size:.98rem;line-height:1.35;box-shadow:0 .3rem 1rem rgba(0,0,0,.25);animation:rein .2s}
.pf{font-size:.7em;color:var(--grau)}
.si{display:inline-flex;flex-direction:column;gap:.16rem;width:1.15rem}
.si i{display:block;height:.2rem;border-radius:.1rem;background:var(--gruen)}
.si i:nth-child(1){width:100%}.si i:nth-child(2){width:62%}.si i:nth-child(3){width:34%}
.kronen{display:flex;align-items:center;gap:.2rem;min-height:1.6rem}
.kronen:empty{display:none}
.kronen .kr{display:block;width:1.9rem}
.kronen .kr.neu{visibility:hidden}
.kronen .mal{font-weight:700;color:#8A6500;margin-left:.2rem}
.krone{display:block;width:100%;height:auto}
.etappe{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}
.el{font-weight:700;white-space:nowrap;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;color:#39424C}
.el:empty{display:none}
.eb{flex:1;height:.9rem;border-radius:.45rem;background:#E1E6EC;overflow:hidden;min-width:3rem;display:block}
.eb i{display:block;height:100%;background:var(--blau);border-radius:.45rem;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Startseite ---------- */
/* Kacheln wie auf happymatty.de: oben ein Streifen in der kräftigen Farbe, darunter gleich die helle Füllung, dünne Linie,
   kein Schatten, keine Bewegung. Beim Darüberfahren und Antippen werden sie weiß.
   Der Startknopf: Fläche in Akzentblau, Streifen in Dunkelblau; beim Darüberfahren und Antippen wird die ganze Fläche dunkelblau.
   (Ein hellblauer Streifen war auf dem hellen Seitengrund nicht zu sehen, eine graue Linie um das Feld passte nicht zum Stil.) */
.startm{flex:1;display:flex;flex-direction:column;gap:.9rem;padding:.3rem .9rem .6rem;min-height:0;max-height:46rem}
.gross{flex:1.55;min-height:8.5rem;background:var(--blau);color:#fff;border:0;border-top:4px solid var(--blau-d);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8rem}
.gross b{font-size:4.2rem;line-height:1}
.gross small{font-size:1.15rem;margin-top:.75rem}
.haupt:active:not(:disabled),.opt:active:not(:disabled){transform:translateY(.14rem);box-shadow:none}
.gross.flach{flex:none;min-height:5.6rem}
.gross.flach b{font-size:2.5rem}
.gross.flach small{margin-top:.4rem;font-size:1rem}
.zwei{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.9rem;min-height:6.5rem}
.mittel{background:#E0EDF8;border:1px solid var(--rand);border-top:4px solid var(--blau);color:var(--blau);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.6rem}
.mittel b{font-size:1.8rem;line-height:1.1}
.mittel small{color:#444;font-size:1rem;margin-top:.45rem}
.mittel.gr{border-top-color:var(--gruen);color:var(--gruen);background:#E3EFDF}

.link{background:none;border:0;color:#9AA4AF;font-size:.85rem;text-decoration:underline;padding:.3rem}

/* ---------- Zwischenstand, Einzeltraining, Erklärungen ---------- */
.seite{flex:1;display:flex;flex-direction:column;gap:.7rem;padding:.3rem .9rem 1rem}
.zs{display:flex;align-items:baseline;gap:.7rem;margin:.15rem .1rem 0;flex-wrap:wrap}
.zs b{font-size:1.2rem}
.zs span{color:var(--grau);font-size:.92rem}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ka{background:#E0EDF8;border:1px solid var(--rand);border-top:4px solid var(--blau);border-radius:6px;padding:.6rem .85rem .75rem;display:flex;flex-direction:column;gap:.55rem;text-align:left;min-height:4.4rem;justify-content:space-between;min-width:0}
.ka b{color:var(--blau);font-size:1.12rem;line-height:1.15}
.kz{display:flex;align-items:center;gap:.6rem}
.bd{flex:1;height:.8rem;border-radius:.4rem;background:#E4E8ED;overflow:hidden;display:block;min-width:2rem}
.ka .bd{background:#fff;box-shadow:inset 0 0 0 1px #C9D6E2}
.bd i{display:block;height:100%;border-radius:.4rem;background:var(--gruen);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ms{width:6.5rem;flex:none;display:flex}
.mk{font-size:.8rem;font-weight:700;border-radius:.25rem;padding:.06rem .45rem .12rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem;line-height:1.25}
.mk.ok{color:var(--gruen);background:#E3EFDF}
.mk.voll{color:#fff;background:var(--lila)}
.mk.voll svg{width:.95em;height:.7em;display:block}
.mk.dg{color:#fff;background:var(--dgrau)}
.mk.bald{color:#8A94A0;background:#EEF1F4}
.ka.aus,.eka.aus{background:#F7F7F7;border:1px dashed #BFBFBF;border-top:4px solid #BFBFBF}      /* noch nicht da: grau wie die gesperrte Karte der Webseite */
.ka.aus b,.eka.aus b{color:#9A9A9A}
.ekacheln{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.eka{background:#E3EFDF;border:1px solid var(--rand);border-top:4px solid var(--gruen);border-radius:6px;padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.3rem;text-align:left;min-height:8rem;align-items:flex-start}
.eka .nr{color:var(--grau);font-size:.95rem}
.eka b{color:var(--gruen);font-size:1.3rem;line-height:1.15}
.eka b.gr{font-size:1.7rem}
.eka .mk{margin-top:auto}

/* ---------- Aufgabe ---------- */
.buehne{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:.8rem;padding:.15rem .9rem .6rem;overflow:auto;align-content:start}
.buehne.eins{grid-template-columns:minmax(0,1fr)}
.karte{background:#fff;border:1.5px solid var(--rand);border-radius:.9rem;padding:.65rem 1rem .9rem;min-width:0;display:flex;flex-direction:column;gap:.5rem}
.eins .karte{max-width:54rem;width:100%;margin:0 auto}
.was{margin:0;color:var(--grau);font-size:.85rem}
.was b{color:var(--dgrau)}
.was .wasl{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;font-weight:700;color:var(--blau)}
.was .wasl:hover{text-decoration:underline}
.was .wasl:active{color:var(--blau-d);text-decoration:underline}
/* der Ort vor dem Aufgabentyp („Gesamttraining“, „Einzeltraining“): antippbar wie der Aufgabentyp, aber nicht fett */
.was .wasol{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;color:var(--blau)}
.was .wasol:hover{text-decoration:underline}
.was .wasol:active{color:var(--blau-d);text-decoration:underline}
/* Aufgabenkopf: links Aufgabentyp und Level, rechts der Weg zur letzten Aufgabe */
.was{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.was .wasr{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;color:var(--blau);white-space:nowrap;flex:none}
.was .wasr:hover{text-decoration:underline}
.was .wasr:active{color:var(--blau-d);text-decoration:underline}
.was .wasm{flex:none;font-size:.8rem;font-weight:700;color:#fff;background:var(--dgrau);border-radius:.25rem;padding:.06rem .45rem .12rem;white-space:nowrap;line-height:1.25}
/* Rückblick: das Bild der letzten Aufgabe ist eingefroren; nur der Aufgabentyp bleibt antippbar */
.buehne.rueckblick>*{pointer-events:none}
.buehne.rueckblick .wasl,.buehne.rueckblick .wasol{pointer-events:auto}
/* Fenster vor dem Wechsel ins Einzeltraining eines Aufgabentyps */
.efrage{width:min(94vw,27rem)}
.efrage .reihe{grid-template-columns:minmax(0,1fr) minmax(4rem,9rem) auto}
.efrage .eknoepfe{display:flex;justify-content:flex-end;align-items:center;gap:.6rem;margin-top:.2rem}
.efrage .eknoepfe .kn{min-height:3rem;padding:.3rem 1rem}
.efrage .ehier{margin:0}

/* Nach einer falschen Antwort steht der Denkanstoß als Regel unter dem Fehler */
.rueck small.regel{color:#3D4853;font-size:.92rem;margin-top:.25rem}

.frage{margin:0;font-size:1.2rem}
.term{margin:.1rem 0;font-size:1.7rem;line-height:1.25}
.term .pp{margin-left:1.4rem;white-space:nowrap;display:inline-block}
.term>span{white-space:nowrap;display:inline-block}
.nk{display:none}
.inhalt{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.mitbild .inhalt{display:grid;grid-template-columns:minmax(0,21rem) minmax(0,1fr);gap:1.3rem;align-items:center}
.rechts{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.opts{display:grid;gap:.6rem;margin-top:.25rem}
.opts.n2,.opts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{background:#fff;border:.14rem solid var(--blau);border-radius:.8rem;min-height:3.7rem;font-size:1.4rem;padding:.4rem 2.2rem;box-shadow:0 .2rem 0 #C9D6E2;position:relative;color:var(--text);min-width:0;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.opt:disabled{box-shadow:none;cursor:default;border-color:#C9D0D8;color:#6B7580}
.opt.gew{background:#EAF3F9;box-shadow:0 0 0 .2rem #CFE3F1}
.opt.fehlt{border-color:var(--gruen);border-style:dashed;color:var(--text);background:#fff}
.opt.fehlt::after{content:'✓';color:var(--gruen);position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.3rem;opacity:.55}
.opt.ok{border-color:var(--gruen);background:#EAF4E6;color:var(--text)}
.opt.falsch{border-color:var(--rot);background:#F8E9E8;color:var(--text)}
.opt.ok::after,.opt.falsch::after{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.3rem}
.opt.ok::after{content:'✓';color:var(--gruen)}
.opt.falsch::after{content:'✗';color:var(--rot)}
.denk{background:#F4EFF7;border-left:.25rem solid var(--lila);padding:.4rem .7rem;border-radius:.4rem;font-size:1.02rem}
.rueck{border-radius:.6rem;padding:.45rem .8rem;display:flex;gap:.6rem;align-items:flex-start;font-size:1.04rem;animation:rein .25s}
.rueck .z{font-weight:700;font-size:1.15rem;line-height:1.15}
.rueck.gut{background:#EAF4E6;border:1.5px solid #9CC98F}
.rueck.gut .z{color:var(--gruen)}
.rueck.schlecht{background:#F8E9E8;border:1.5px solid #D9A6A3}
.rueck.schlecht .z{color:var(--rot)}
.rueck.neutral{background:#EEF1F4;border:1.5px solid #C9D0D8}
.rueck small{display:block;color:var(--grau);font-size:.88rem;margin-top:.15rem}
@keyframes rein{from{opacity:0;transform:translateY(.35rem)}to{opacity:1;transform:none}}
@keyframes zittern{0%,100%{transform:translateX(0)}20%{transform:translateX(-.4rem)}40%{transform:translateX(.35rem)}60%{transform:translateX(-.25rem)}80%{transform:translateX(.15rem)}}
.zittert{animation:zittern .4s}

/* Rechnung */
.rechnung h3{font-family:var(--hand);font-weight:400;color:var(--grau);font-size:1.25rem;margin:0;line-height:1.1}
.zeilen{font-family:var(--hand);color:var(--orange);font-size:1.6rem;line-height:1.5;display:flex;flex-direction:column}
.zeilen i{font-style:normal}
.zl{display:flex;justify-content:space-between;gap:1rem;animation:rein .35s}
.zl .op{color:#E0A07A;white-space:nowrap}
.zl.text{font-size:1.3rem;line-height:1.35;margin-bottom:.25rem}
.leer{color:#9AA4AF;font-size:.95rem;margin:0}
.soll{position:relative;display:inline-block;padding:0 .12em}
.soll::before{content:'!';position:absolute;left:50%;transform:translateX(-50%);top:-.68em;font-size:.6em}

/* Eingabe */
.ein{font-size:1.7rem;display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .6rem;margin:.15rem 0}
.pkt{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}
.feld{display:inline-flex;align-items:center;justify-content:center;min-width:3.3rem;height:2.7rem;border:.14rem dashed #9FB3C6;border-radius:.5rem;padding:0 .45rem;background:#FAFCFE;cursor:pointer}
.feld.aktiv{border-style:solid;border-color:var(--blau);background:#EAF3F9;box-shadow:0 0 0 .18rem #CFE3F1}
.feld.aktiv::after{content:'';width:.09rem;height:1.5rem;background:var(--blau);margin-left:.08rem;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.umsch{display:inline-flex;border:.12rem solid var(--blau);border-radius:.6rem;overflow:hidden;font-size:1.05rem}
.umsch button{border:0;background:#fff;padding:.5rem .85rem;font-weight:700;color:var(--blau);min-height:2.6rem}
.umsch button.an{background:var(--blau);color:#fff}
.tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;max-width:19rem;width:100%}
.tasten button{height:2.9rem;border-radius:.6rem;border:1.5px solid #B9C4D0;background:#fff;font-size:1.4rem;box-shadow:0 .14rem 0 #C9D0D8;color:var(--text)}
.tasten button:active{transform:translateY(.1rem);box-shadow:none;background:#EAF3F9}
.tasten .breit{grid-column:span 2}
.tasten .fn{background:#EEF1F4;font-size:1.2rem}
.gesperrt .tasten,.gesperrt .umsch{opacity:.45;pointer-events:none}

/* Wischkarte */
.wischfeld{padding:.9rem 1.2rem 1.2rem;display:flex;justify-content:center;overflow:hidden}
.wk{position:relative;width:min(100%,31rem);background:#fff;border:1px solid var(--rand);border-top:4px solid var(--blau);border-radius:6px;padding:1.1rem 1.3rem 2.5rem;box-shadow:0 .25rem .9rem rgba(31,41,51,.10);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.wk .term{font-size:1.9rem;margin:0 0 .5rem}
.aussage{margin:0;font-size:1.35rem;line-height:1.35}
.wk.zuja{border-top-color:var(--gruen)}
.wk.zunein{border-top-color:var(--rot)}
.wk.ok{border-color:#9CC98F;border-top-color:var(--gruen);background:#F3F9F1}
.wk.falsch{border-color:#D9A6A3;border-top-color:var(--rot);background:#FBF2F1}
.stempel{position:absolute;right:1rem;bottom:.55rem;font-family:var(--hand);font-size:1.5rem;line-height:1;transform:rotate(5deg)}
.wk.ok .stempel{color:var(--gruen)}
.wk.falsch .stempel{color:var(--rot)}
.wknoepfe{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wknoepfe .opt{padding:.4rem .8rem;font-size:1.25rem}
.wknoepfe .opt.nein:not(:disabled){color:var(--rot)}
.wknoepfe .opt.ja:not(:disabled){color:var(--gruen)}
.pfl{font-weight:700}
.wknoepfe .opt.ok::after,.wknoepfe .opt.falsch::after{position:static;transform:none;margin-left:.5rem}

/* Satz mit Lücken, Notiz, falsche Felder */
.ein>span{white-space:nowrap}
.ein.satz{font-size:1.2rem;flex-direction:column;align-items:flex-start;gap:.45rem}
.ein.satz .sz{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;white-space:normal}
.ein.satz .feld{min-width:3rem;height:2.5rem;font-size:1.4rem}
.ein.satz .umsch{font-size:1rem}
.ein.satz .umsch button{padding:.35rem .7rem;min-height:2.5rem}
.feld.falsch,.umsch.falsch{border-color:var(--rot);box-shadow:0 0 0 .16rem #F3D6D4}
.notiz{margin:-.15rem 0 .1rem;color:var(--grau);font-size:.9rem}

/* Teilprodukte */
.plaetze{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.2rem}
.platz{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:0}
.pl-l{font-size:.95rem;color:var(--grau);white-space:nowrap;min-height:1.3em}
.pl-f{width:100%;min-height:3rem;border:.14rem dashed #9FB3C6;border-radius:.5rem;background:#FAFCFE;display:flex;align-items:center;justify-content:center;font-size:1.4rem;white-space:nowrap}
.platz.voll .pl-f{border-style:solid;border-color:#9CC98F;background:#F3F9F1}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.chip{background:#fff;border:.13rem solid var(--blau);border-radius:.7rem;min-height:3rem;min-width:4.4rem;font-size:1.4rem;padding:.25rem .9rem;box-shadow:0 .18rem 0 #C9D6E2;color:var(--text);white-space:nowrap}
.chip:active{transform:translateY(.1rem);box-shadow:none}
.chip:disabled{opacity:.4;box-shadow:none;cursor:default}

/* Graph in der Aufgabe: Er passt mit Frage und Leiste auf den Bildschirm, auch am iPad quer in Safari */
@media (min-width:761px){.buehne>.karte>.bild{max-width:min(22rem,calc(100dvh - 18.5rem))!important;min-width:14rem}}
/* Zuordnen */
.zuo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:.6rem 1.4rem;margin-top:.2rem}
.zsp{display:flex;flex-direction:column;gap:.5rem}
.zk.zu{text-align:left;min-height:3rem}
.zk.zu.r{font-size:1.15rem;border-color:#8DB9D9}
.zk.zu.gew{background:#EAF3F9;box-shadow:0 0 0 .18rem #CFE3F1;border-color:var(--blau)}
.zk.zu.voll{border-color:#9CC98F;background:#F3F9F1;box-shadow:none;color:var(--text)}
.zk.zu:disabled:not(.voll){opacity:.45;box-shadow:none}
.znr{font-weight:700;color:var(--gruen);min-width:1.1rem;text-align:right}
.zuo~.zeilen .zl.text{font-size:1.15rem;line-height:1.3;margin-bottom:.1rem}
/* Punkte setzen */
.bild.setz svg{cursor:crosshair}
.sp{fill:var(--blau);stroke:#fff;stroke-width:2}
.sp.falsch{fill:var(--rot)}
.sp.loes{fill:var(--orange)}
.gk.neu{stroke-dasharray:1;stroke-dashoffset:1;animation:zeichne 1s ease-out forwards}
.zaehler{margin:0;color:var(--grau);font-size:.95rem}
.pliste{display:flex;flex-wrap:wrap;gap:.35rem;min-height:2.1rem}
.pko{border:1.5px solid #B9C4D0;border-radius:.45rem;padding:.1rem .5rem;font-size:1.1rem;background:#fff;white-space:nowrap}
.pko.falsch{border-color:var(--rot);color:var(--rot)}
.pko.loes{border-color:var(--orange);color:var(--orange)}

/* Ordnen */
.pool{display:flex;flex-direction:column;gap:.5rem;margin-top:.2rem}
.zk{background:#fff;border:.13rem solid var(--blau);border-radius:.7rem;min-height:3.1rem;font-size:1.4rem;padding:.3rem 1rem;box-shadow:0 .18rem 0 #C9D6E2;display:flex;justify-content:space-between;gap:1rem;align-items:center;color:var(--text)}
.zk .op{color:var(--grau);font-size:1.1rem;white-space:nowrap}
.zk:active{transform:translateY(.1rem);box-shadow:none}

/* Zielparabel und Regler */
.reglerfeld{display:flex;flex-direction:column;gap:.5rem}
.regler{display:grid;grid-template-columns:2rem 3rem 1fr 3rem;align-items:center;gap:.5rem;font-size:1.5rem}
.regler output{text-align:center;font-size:1.6rem;background:#FAFCFE;border:1.5px solid var(--rand);border-radius:.5rem;padding:.15rem 0}
.st{height:3rem;border-radius:.7rem;border:.13rem solid var(--blau);background:#fff;font-size:1.7rem;font-weight:700;color:var(--blau);box-shadow:0 .16rem 0 #C9D6E2;line-height:1}
.st:active{transform:translateY(.1rem);box-shadow:none}
.st:disabled{opacity:.35;box-shadow:none}

/* Graph */
.graph{width:100%;height:auto;display:block;max-height:62vh}
.gl{stroke:#DDE3EA;stroke-width:1}
.ga{stroke:#39424C;stroke-width:1.3}
.gp{fill:#39424C}
.gt{font-family:var(--satz);font-size:12px;fill:#39424C;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.gt.k{font-style:italic;font-size:14px}
.gk{fill:none;stroke:var(--blau);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gk.norm{stroke:var(--gruen);stroke-width:2;stroke-dasharray:5 5}
.ebene .gk{transition:opacity .35s}
.ebene .gk.weg{opacity:0}
.gk.eigen{stroke:var(--pink);stroke-dasharray:1;stroke-dashoffset:1;animation:zeichne 1s ease-out forwards}
@keyframes zeichne{to{stroke-dashoffset:0}}
.gpkt{fill:var(--blau);stroke:#fff;stroke-width:2}
.gbs{font-family:var(--satz);font-size:14px;fill:var(--blau);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}

/* Leiste unten */
.leiste{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem .65rem;border-top:1.5px solid var(--rand);background:#fff}
.hilfen{display:flex;gap:.45rem;flex-wrap:wrap;flex:1;min-width:0}
.hk{background:#fff;border:1.5px solid #B9C4D0;border-radius:.55rem;padding:.3rem .75rem;font-size:.97rem;min-height:2.5rem;color:#39424C;white-space:nowrap}
.hk.an{background:#F4EFF7;border-color:var(--lila)}
.hk.erkl{border-color:var(--gruen);color:var(--gruen);font-weight:700}
.hk:disabled{opacity:.4;cursor:default}
.haupt{background:var(--blau);color:#fff;border:0;border-radius:.75rem;min-width:9.5rem;min-height:3rem;font-size:1.3rem;font-weight:700;box-shadow:0 .2rem 0 var(--blau-d);padding:.3rem 1.2rem}
.haupt:disabled{background:#B9C9D6;box-shadow:none;cursor:default}

/* Meldungen */
.toasts{position:fixed;right:max(.9rem,calc(50vw - 620px + .9rem));bottom:4.9rem;z-index:30;display:flex;flex-direction:column-reverse;gap:.4rem;pointer-events:none;width:min(92vw,30rem)}
.toast{background:#fff;border:1.5px solid #9CC98F;border-radius:.7rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.14);padding:.5rem .85rem;display:flex;align-items:center;gap:.7rem;animation:toast 3.2s forwards}
.toast b{white-space:nowrap;color:var(--blau)}
.toast .bd{min-width:4rem}
.toast .tx{white-space:nowrap;font-weight:700;color:var(--gruen)}
@keyframes toast{0%{opacity:0;transform:translateY(.6rem)}8%{opacity:1;transform:none}86%{opacity:1}100%{opacity:0}}

/* Überlagerungen */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.ov.dunkel{background:rgba(31,41,51,.38)}
.panel{background:#fff;border-radius:1rem;box-shadow:0 1rem 3rem rgba(0,0,0,.28);padding:.9rem 1.1rem 1.1rem;width:min(94vw,34rem);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.panel h2{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:1.8rem;margin:0;line-height:1}
.pkopf{display:flex;align-items:center;gap:.6rem}
.reihe{display:grid;grid-template-columns:minmax(0,11.5rem) 1fr 6.5rem;align-items:center;gap:.7rem;background:#fff;border:1.5px solid var(--rand);border-radius:.6rem;padding:.5rem .7rem;text-align:left;min-height:2.9rem}
.reihe b{color:var(--blau);font-size:1rem}
.reihe.aus{opacity:.6}
.reihe.aus b{color:#8A94A0}
.klein{color:var(--grau);font-size:.9rem;margin:0}
.menue{position:fixed;z-index:51;left:max(.9rem,calc(50vw - 620px + 5.6rem));top:3.5rem;background:#fff;border-radius:.9rem;box-shadow:0 .6rem 2rem rgba(0,0,0,.25);padding:.7rem .9rem .8rem;display:flex;flex-direction:column;gap:.5rem;width:17.5rem}
.mz{display:flex;align-items:center;gap:.7rem;font-size:1.1rem}
.mz b{min-width:4rem}
.mz span{color:var(--grau);flex:1}
.sw{width:3.3rem;height:1.9rem;border-radius:.95rem;background:#C9D0D8;position:relative;border:0;flex:none;transition:background .15s}
.sw.an{background:var(--gruen)}
.sw::after{content:'';position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:left .15s}
.sw.an::after{left:1.6rem}

/* Krone nach der Etappe */
.krone-ov{background:rgba(243,245,248,.94);flex-direction:column;gap:.5rem;cursor:pointer}
.krone-ov .gk-kr{width:min(40vw,13rem);animation:kronepop .7s cubic-bezier(.2,1.5,.4,1)}
.krone-ov h2{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:2.8rem;margin:.3rem 0 0;animation:rein .5s .2s both}
@keyframes kronepop{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
.flieger{position:fixed;z-index:60;pointer-events:none;transform-origin:0 0}

/* Finale */
.finale{z-index:70;background:radial-gradient(ellipse at 50% 55%,rgba(40,24,70,.9),rgba(10,14,26,.97));flex-direction:column;color:#fff;text-align:center}
.finale canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.finale .szene{width:min(92vw,34rem);height:min(50vh,23rem);position:relative}
.finale .szene svg{width:100%;height:100%;overflow:visible}
.finale h2{font-family:var(--hand);font-weight:400;font-size:3rem;margin:.3rem 0 .1rem;color:#FFE08A;text-shadow:0 2px 12px rgba(0,0,0,.6);position:relative}
.finale p{margin:0 0 .9rem;font-size:1.2rem;opacity:.94;position:relative}
.finale .haupt{background:#FFE08A;color:#3B2A00;box-shadow:0 .2rem 0 #B88600;position:relative}

/* Erklärer und Erkunder */
.ebene{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.ebene .innen{max-width:1240px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ebene h1{color:var(--gruen)}
.ebene .leiste.ex{position:sticky;bottom:0;z-index:2}
.exm{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;padding:.2rem .9rem .7rem;align-items:center;min-height:0}
.exm .bild{max-width:30rem;width:100%;justify-self:center}
.ext{display:flex;flex-direction:column;gap:.6rem}
.ex-titel{font-family:var(--hand);color:var(--blau);font-size:1.9rem;margin:0;line-height:1.1}
.ex-titel.norm{color:var(--gruen)}
.ex-form{margin:0;font-size:1.25rem;color:#39424C;line-height:1.3}
.ex-form>span:first-child{font-size:.85rem;color:var(--grau);margin-right:.7rem}
.rechnung .ex-form{font-size:1.15rem}
/* Erkunder: a, u und v je in einer Farbe, an Buchstabe, Zahl, Regler und Pfeil */
.erk .pa,.info1 .pa{color:var(--ca);font-weight:700}
.erk .pu,.info1 .pu{color:var(--cu);font-weight:700}
.erk .pv,.info1 .pv{color:var(--cv);font-weight:700}
/* Jede Form hat ihr eigenes Geschwisterpaar: u und v Lila und Pink, b und c zwei Ocker, x1 und x2 Petrol und Türkis. Nur a bleibt in allen Formen blau. */
.erk .pb,.info1 .pb{color:var(--cb);font-weight:700}
.erk .pc,.info1 .pc{color:var(--cc);font-weight:700}
.erk .px1,.info1 .px1{color:var(--cx1);font-weight:700}
.erk .px2,.info1 .px2{color:var(--cx2);font-weight:700}
.erk input[data-p=a]::-webkit-slider-thumb{background:var(--ca)}
.erk input[data-p=u]::-webkit-slider-thumb{background:var(--cu)}
.erk input[data-p=b]::-webkit-slider-thumb{background:var(--cb)}
.erk input[data-p=x1]::-webkit-slider-thumb{background:var(--cx1)}
.erk input[data-p=v]::-webkit-slider-thumb{background:var(--cv)}
.erk input[data-p=c]::-webkit-slider-thumb{background:var(--cc)}
.erk input[data-p=x2]::-webkit-slider-thumb{background:var(--cx2)}
.erk input[data-p=a]::-moz-range-thumb{background:var(--ca)}
.erk input[data-p=u]::-moz-range-thumb{background:var(--cu)}
.erk input[data-p=b]::-moz-range-thumb{background:var(--cb)}
.erk input[data-p=x1]::-moz-range-thumb{background:var(--cx1)}
.erk input[data-p=v]::-moz-range-thumb{background:var(--cv)}
.erk input[data-p=c]::-moz-range-thumb{background:var(--cc)}
.erk input[data-p=x2]::-moz-range-thumb{background:var(--cx2)}
.sr{display:flex;flex-direction:column}
.erk .sinn{margin:-.3rem 0 .15rem 2.3rem;font-size:.98rem;font-weight:400;min-height:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erk .ex-text{font-size:1.35rem}
.stufe{stroke:var(--cs);stroke-width:2;stroke-dasharray:4 3}
.vpf.ps line{stroke:var(--cs);stroke-width:3}
.vpf.ps path{fill:var(--cs)}
.stufe.gn{stroke:var(--csg)}
.vpf.ps.gn line{stroke:var(--csg)}
.vpf.ps.gn path{fill:var(--csg)}
.gpkt.gn{fill:var(--gruen)}
.gbs.gn{fill:var(--gruen)}
.vpf line{stroke-width:3.4;stroke-linecap:round}
.vpf.pu line{stroke:var(--cu)}
.vpf.pu path{fill:var(--cu)}
.vpf.pv line{stroke:var(--cv)}
.vpf.pv path{fill:var(--cv)}
.ex-term{font-size:2.1rem;margin:0;background:#fff;border:1.5px solid var(--rand);border-radius:.7rem;padding:.5rem .9rem;line-height:1.3;white-space:nowrap}
.ex-text{font-size:1.2rem;line-height:1.45;margin:0;min-height:6.5rem}
.punkte{display:flex;flex:1;justify-content:center;align-items:center}
.punkte button{border:0;background:none;padding:.55rem .22rem;margin:0;line-height:0}
.punkte i{width:.7rem;height:.7rem;border-radius:50%;background:#C9D0D8;display:block;transition:box-shadow .2s}
.punkte .an i{background:var(--gruen)}
.punkte .jetzt i{box-shadow:0 0 0 .2rem #BFDDB6}
.punkte .neu{margin-left:.55rem}
.ph{border-radius:.25rem;transition:background .25s,box-shadow .25s}
.ph.an{background:#D3E6F3;box-shadow:0 0 0 .14rem #D3E6F3}
.info2 .marken>*,.info1 .marken>*{animation:rein .4s}
/* Info 1 und der Erkunder mit drei Formen */
.exm .bild.hoch{max-width:23rem}
.ex-form.nur{font-size:1.4rem}
.info1 .ex-term{white-space:normal;font-size:1.9rem}
.gl2{display:inline-block}
.gpkt.pc{fill:var(--cc)}
.gpkt.px1,.gbs.px1{fill:var(--cx1)}
.gpkt.px2,.gbs.px2{fill:var(--cx2)}
.formw{display:flex;border:.12rem solid var(--gruen);border-radius:.6rem;overflow:hidden}
.formw button{flex:1;border:0;background:#fff;color:var(--gruen);font-weight:700;font-size:.98rem;padding:.35rem .5rem;min-height:2.6rem;line-height:1.15;transition:background-color .15s}
.formw button+button{border-left:.12rem solid var(--gruen)}
.formw button.an{background:var(--gruen);color:#fff}
.regler3{display:flex;flex-direction:column;gap:.1rem}
.regler3.matt input{opacity:.4}
.kein{color:var(--grau);font-size:1.3rem}
.sl{display:grid;grid-template-columns:2rem 1fr 4.2rem;align-items:center;gap:.7rem;font-size:1.5rem}
.sl output{text-align:right;font-size:1.5rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.6rem;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:.5rem;border-radius:.25rem;background:#C9D6E2}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--blau);border:.18rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.3);margin-top:-.8rem}
input[type=range]::-moz-range-track{height:.5rem;border-radius:.25rem;background:#C9D6E2}
input[type=range]::-moz-range-thumb{width:1.8rem;height:1.8rem;border-radius:50%;background:var(--blau);border:.18rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.3)}

.pk{display:flex;gap:.45rem;flex-wrap:wrap}

/* ---------- Das Werkstor (Anwendung zum Anfassen) ---------- */
.ka.breit{grid-column:1/-1;min-height:0}
.kt{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.buehne.werk{grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr)}
.wlage{margin:0;font-size:.97rem;line-height:1.28;color:#39424C}
.wbild{display:flex;justify-content:center}
.wsvg{display:block;width:100%;height:auto;max-height:min(32dvh,19rem)}
.w-wand{fill:#DCEAF5}
.w-rand{fill:none;stroke:var(--blau);stroke-width:2}
.w-bogen{fill:none;stroke:var(--blau);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.w-boden{stroke:#39424C;stroke-width:2}
.w-ms{stroke:#39424C;stroke-width:1.2}
.w-mt{font-family:var(--satz);font-size:19px;fill:#39424C}
.w-mt.n{font-weight:700;fill:var(--blau)}
.w-hilf{stroke:#39424C;stroke-width:1;stroke-dasharray:4 4}
.w-tormass,.w-achsen,.w-zahlen,.w-wmass{transition:opacity .5s}
.w-achsen,.w-zahlen{opacity:0}
.wsvg.achsen .w-achsen,.wsvg.zahlen .w-zahlen{opacity:1}
.wsvg.zahlen .w-tormass,.wsvg.zahlen .w-leg,.wsvg.faehrt .w-wmass,.wsvg.faehrt .w-kl.p{opacity:0}
.w-kl.p{transition:opacity .4s}
.w-ax{stroke:#39424C;stroke-width:1.6}
.w-axp{fill:#39424C}
.w-zt{font-family:var(--satz);font-size:18px;fill:#39424C;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.w-zt.k{font-size:16.5px}
.w-pkt{fill:var(--blau);stroke:#fff;stroke-width:2}
.w-pl,.w-kl,.w-lt{font-family:var(--satz);font-size:19px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.w-pl{fill:var(--blau)}
.w-kl{fill:var(--orange)}
.w-lot{stroke:var(--orange);stroke-width:2;stroke-dasharray:5 4}
.w-kp{fill:var(--orange);stroke:#fff;stroke-width:2}
.w-km{fill:var(--orange)}
.w-punkte>*,.w-kante>*,.w-spiel>*{animation:rein .45s}
.w-rad{fill:#39424C}
.w-kar{fill:#EDF4FA;stroke:var(--blau);stroke-width:1.6}
.w-sto{fill:#AEBBC8}
.w-fen{fill:#CFE3F1;stroke:var(--blau);stroke-width:1}
.w-lin{stroke:var(--blau);stroke-width:1.1}
.w-ecke{fill:none;stroke-width:3}
.w-ecke.gut,.w-lr.gut,.w-lf.gut{stroke:var(--gruen)}
.w-ecke.schlecht,.w-lr.schlecht,.w-lf.schlecht{stroke:var(--rot)}
.w-lf{stroke-width:1.6}
.w-lg{fill:#fff}
.w-lr{fill:none;stroke-width:3.5}
.w-lt.gut{fill:var(--gruen)}
.w-lt.schlecht{fill:var(--rot)}
.w-lupe .w-bogen{stroke-width:1}
.w-lupe .w-kar{stroke-width:.5}
.w-lupe .w-lin{stroke-width:.35}
.w-lupe .w-fen{stroke-width:.3}
.w-lupe .w-lot{stroke-width:.6;stroke-dasharray:1.6 1.2}
.w-lupe .w-kp{stroke-width:.5}
.wrech{border-top:1.5px solid var(--rand);padding-top:.35rem;display:flex;flex-direction:column;gap:.1rem}
.wrech h3{font-size:1rem}
.wnot{font-family:var(--hand);color:var(--orange);font-size:1.1rem;line-height:1.26}
.wnot i{font-style:normal}
.wnot p{margin:0}
.wnot p.neu{animation:rein .35s}
.wnot p.d{font-size:1rem;line-height:1.22;display:flex;justify-content:space-between;gap:1rem;padding-left:.7rem;border-left:.18rem solid #F1D3BE}
.wnot .op{color:#E0A07A;white-space:nowrap}
.wtext{margin:0;font-size:1.02rem;line-height:1.35;color:#39424C}
.frage.wgr{font-size:1.55rem}
.wkopf{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.werk .opts.n2 .opt{padding:.3rem .5rem;white-space:nowrap;min-height:3.1rem}
.werk .ein{margin:0}
.wtipp{display:inline-block;background:#EEF1F4;color:var(--dgrau);border-radius:.25rem;font-size:.8rem;font-weight:700;padding:.04rem .45rem .1rem;white-space:nowrap}
.werk .opts.zwei .opt{font-size:1.2rem;line-height:1.3;padding:.4rem 1.5rem .45rem .5rem;white-space:nowrap}
.werk .opts.zwei .opt::after{right:.45rem}
.werk .tasten{grid-template-columns:repeat(5,1fr);max-width:none;gap:.35rem}
.werk .tasten button{height:2.4rem;font-size:1.3rem}
.werk .steht .tasten{display:none}
.werk .wrechts .term{font-size:1.55rem}
.wcm{font-size:1.4rem}
.wurteil{font-family:var(--hand);font-weight:400;font-size:2.5rem;margin:0;line-height:1;animation:rein .4s}
.wurteil.ja{color:var(--gruen)}
.wurteil.nein{color:var(--rot)}
.wzeilen p{margin:.2rem 0;font-size:1.15rem;display:flex;gap:.5rem}
.wzeilen .z{font-weight:700;width:1.1rem;flex:none}
.wzeilen .gut .z{color:var(--gruen)}
.wzeilen .schlecht .z{color:var(--rot)}
.wdrei{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.2rem}
.wdrei span{border:1.5px solid var(--rand);border-radius:.45rem;padding:.15rem .6rem;font-size:.95rem;color:var(--grau);background:#fff}
.wdrei span.ok{border-color:#9CC98F;background:#F3F9F1;color:var(--gruen);font-weight:700}
.wfuss:empty{display:none}

/* ---------- Tafel-Runde (Talk) ---------- */
.tafelr .exm{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:start;padding-top:.6rem}
.tafelr .exm.ohne{grid-template-columns:minmax(0,1fr);max-width:56rem;width:100%;margin:0 auto}
.tafelr .exm.werkbild{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.tafelr .werkbild .tf-frage{font-size:1.75rem}
.tafelr .werkbild .tf-zeilen .zl.text{font-size:1.3rem;margin-bottom:.25rem}
.tf-zeilen .nw{white-space:nowrap}
.tafelr .exm .bild{max-width:30rem}
.tafelr .exm.werkbild .bild{max-width:none}
.tafelr .wsvg{max-height:min(58dvh,30rem)}
.tf-was{margin:0;color:var(--grau);font-size:.95rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.tf-was b{color:var(--dgrau)}
.tf-form{color:#fff;background:var(--dgrau)}
.tf-frage{font-size:2.15rem;line-height:1.2;margin:.15rem 0 .2rem;font-weight:400}
.tf-term{font-size:2.2rem;margin:0;line-height:1.35;white-space:nowrap}
.tf-term .pp{margin-left:1.4rem;white-space:nowrap;display:inline-block}
.tf-term>span{white-space:nowrap;display:inline-block}
.tf-wer{display:block!important;font-size:1.05rem;color:var(--grau)}
.tf-hand{font-family:var(--hand);color:#39424C;font-size:2.5rem}
.tf-hand i{font-style:normal}
.tf-term>.tf-hand{white-space:normal;max-width:100%}
.tf-hand>span{white-space:nowrap;display:inline-block}
.tf-notiz{margin:0;color:var(--grau);font-size:1.02rem}
.tf-zeilen{font-size:1.9rem;margin-top:.3rem}
.tf-zeilen .zl.text{font-size:1.55rem;line-height:1.3;margin-bottom:.35rem}
.tafelr svg.tippbar{cursor:crosshair}
.tafelr .gpkt.pc{fill:var(--cc)}
.tafelr .gpkt.px1,.tafelr .gbs.px1{fill:var(--cx1)}
.tafelr .gpkt.px2,.tafelr .gbs.px2{fill:var(--cx2)}
.tafelr .marken>*{animation:rein .4s}
.tf-auf{font-weight:700;border-color:var(--orange)!important;color:var(--orange)!important}
.tf-auf:disabled{border-color:#B9C4D0!important;color:#39424C!important}

/* ---------- Bewegung: Darüberfahren, Drücken, Ansichtswechsel ---------- */
.gross,.mittel,.ka,.eka,.opt,.zk,.kn,.hk,.haupt,.st,.reihe,.tasten button,.umsch button{transition:transform .12s ease-out,box-shadow .12s ease-out,background-color .15s,border-color .15s}
.punkte i{transition:transform .12s,box-shadow .2s}
@media (hover:hover){

<body><div id="app"></div>
<script>
'use strict';
/* =====================================================================
   QF3-Training „Die p,q-Formel“: fünf Aufgabentypen, die Anwendung „Die Wasserrakete“, Erklärungen, Erkunder und Tafel-Runde.
   Gebaut auf dem Gerüst des QF2-Trainings (Skill interaktiv, Training). Nichts wird gespeichert; der Stand gilt, solange die Seite offen ist.
   Interne Namen der Anwendung (W, S.werk, werkDran …) stammen aus dem QF1-Training und meinen hier die Wasserrakete.
   ===================================================================== */
const VERSION='v2.11';
const TITEL='Die <i>p</i>,<i>q</i>-Formel',KURZ='QF3';
const FACH='Mathematik',THEMA='Quadratische Funktionen',THEMA_URL='/quadratische-funktionen/',TEILTHEMA='Nullstellen, Gleichungen lösen'; // Kopfzeile der Startseite, wie _einheit.json
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const easeOut=p=>1-Math.pow(1-p,3);
const easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function tween(ms,fn,ease,delay){ease=ease||easeOut;delay=delay||0;let raf=0,start=0,aus=false;const t={onDone:null,cancel(){aus=true;cancelAnimationFrame(raf);}};
  const step=now=>{if(aus)return;if(!start)start=now+delay;if(now<start){raf=requestAnimationFrame(step);return;}
    const p=Math.min(1,(now-start)/ms);fn(ease(p));if(p<1)raf=requestAnimationFrame(step);else{aus=true;if(t.onDone)t.onDone();}};
  raf=requestAnimationFrame(step);return t;}

/* ---------- Schreibweise ---------- */
const zahl=n=>{const r=Math.round(n*1000)/1000;return (r<0?'−':'')+String(Math.abs(r)).replace('.',',');};
const V=s=>'<i>'+s+'</i>';
const Q='<sup>2</sup>';
const fx=t=>V('f')+'('+V('x')+') = '+t;
const SOLL='<span class="soll">=</span>';
function vorfaktor(a){return typeof a==='string'?V(a):a===1?'':a===-1?'−':zahl(a);}
function termSPF(a,u,v){            // a(x − u)² + v; a und v dürfen Buchstaben sein
  let s=vorfaktor(a);
  s+=u===0?V('x')+Q:'('+V('x')+(u>0?' − ':' + ')+zahl(Math.abs(u))+')'+Q;
  if(typeof v==='string')s+=' + '+V(v);else if(v!==0)s+=(v>0?' + ':' − ')+zahl(Math.abs(v));
  return s;}
function klammerEin(px,u){return '('+zahl(px)+(u>0?' − ':' + ')+zahl(Math.abs(u))+')'+Q;}
const P=(k,t)=>'<span class="p'+k+'">'+t+'</span>';
const SPF=fx(P('a',V('a'))+'('+V('x')+' − '+P('u',V('u'))+')'+Q+' + '+P('v',V('v')));          // f(x) = a(x − u)² + v
const formZeile='<p class="ex-form"><span>Scheitelpunktform</span>'+SPF+'</p>';
function termTeile(a,u,v){let s=a===-1?P('a','−'):a===1?'':P('a',zahl(a));
  s+=u===0?V('x')+Q:'('+V('x')+(u>0?' − ':' + ')+P('u',zahl(Math.abs(u)))+')'+Q;
  if(v!==0)s+=(v>0?' + ':' − ')+P('v',zahl(Math.abs(v)));return s;}
const plusminus=v=>(v>0?' + ':' − ')+zahl(Math.abs(v));
const punkt=(k,x,y)=>V(k)+'('+zahl(x)+' | '+zahl(y)+')';
function poly(a,b,c){            // ax² + bx + c ohne Klammern; Glieder mit 0 entfallen, eine 1 vor x steht nicht da
  const t=[];if(a!==0)t.push([a,V('x')+Q]);if(b!==0)t.push([b,V('x')]);if(c!==0)t.push([c,'']);if(!t.length)return '0';
  return t.map(([k,x],i)=>{const n=Math.abs(k);return (i?(k<0?' − ':' + '):(k<0?'−':''))+(x&&n===1?'':zahl(n))+x;}).join('');}

/* ---------- Klang: leise, abschaltbar, mit Web Audio ---------- */
/*FEUER-A*/
/* Feuerwerk: ein Knall mit Knistern, als fertige Tonspur berechnet. Der Knall ist reines Rauschen in drei Schichten:
   der harte, helle Schlag · der Körper, der schnell dumpf wird und nachrollt · die Tiefe für größere Lautsprecher.
   Ein tiefer Ton an dieser Stelle klingt nach Trommel. Danach viele sehr kurze Knackser, jeder etwas anders gefärbt.
   Gewählt am Gerät aus drei Fassungen: die mit mehr Körper und Tiefe (Lehrkraft 19.11.2026). */
function feuerDaten(sr){
  const L=Math.floor(sr*2),d=new Float32Array(L),tmp=new Float32Array(L);
  const schicht=(gew,dauer,fc,env)=>{let y1=0,y2=0,max=0,k=1;const n=Math.min(L,Math.floor(dauer*sr));
    for(let i=0;i<n;i++){const t=i/sr;if(i%16===0)k=1-Math.exp(-6.283*fc(t)/sr);
      y1+=k*(Math.random()*2-1-y1);y2+=k*(y1-y2);tmp[i]=y2*env(t);const a=Math.abs(tmp[i]);if(a>max)max=a;}
    for(let i=0;i<n;i++)d[i]+=tmp[i]/max*gew;};
  schicht(0.8,0.4,t=>2000+9000*Math.exp(-t/0.04),t=>Math.min(1,t/0.001)*Math.exp(-t/0.04));                             // der Schlag
  schicht(0.95,2,t=>520+2600*Math.exp(-t/0.12),t=>Math.min(1,t/0.003)*(0.6*Math.exp(-t/0.11)+0.4*Math.exp(-t/0.5)));      // der Körper mit dem Nachrollen
  schicht(0.5,1.6,t=>130,t=>Math.min(1,t/0.005)*Math.exp(-t/0.28));                                                     // die Tiefe
  let max=0;for(let i=0;i<L;i++){const a=Math.abs(d[i]);if(a>max)max=a;}
  for(let i=0;i<L;i++)d[i]/=max;
  const n=70+Math.floor(Math.random()*30);                                                                              // das Knistern
  for(let j=0;j<n;j++){const ts=0.3+Math.pow(Math.random(),1.6)*1.3,i0=Math.floor(ts*sr),tau=(0.0015+Math.random()*0.004)*sr,
      amp=(0.1+Math.random()*0.24)*(1-0.7*(ts-0.3)/1.3),len=Math.min(L-i0-1,Math.floor(tau*7)),
      r=0.86,c=2*r*Math.cos(6.283*(2400+Math.random()*4200)/sr);let u1=0,u2=0;
    for(let i=0;i<len;i++){const u=(Math.random()*2-1)+c*u1-r*r*u2;u2=u1;u1=u;d[i0+i]+=u*(1-r)*1.6*amp*Math.exp(-i/tau);}}
  return d;}
/*FEUER-E*/
const Sound={ctx:null,out:null,dl:null,
  init(){try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();
      const master=this.ctx.createGain();master.gain.value=0.9;master.connect(this.ctx.destination);this.master=master;
      const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.connect(master);
      const dl=this.ctx.createDelay(1);dl.delayTime.value=0.17;const fb=this.ctx.createGain();fb.gain.value=0.24;
      const wet=this.ctx.createGain();wet.gain.value=0.32;dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(lp);
      this.out=lp;this.dl=dl;}
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){}},
  now(){return this.ctx?this.ctx.currentTime:0;},
  note(f,t,dur,vol,parts,type,glide){if(!S.ton||!this.ctx)return;parts=parts||[[1,1],[2,.3],[3,.12]];try{
    const env=this.ctx.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.exponentialRampToValueAtTime(vol,t+0.012);
    env.gain.exponentialRampToValueAtTime(vol*0.35,t+dur*0.3);env.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    env.connect(this.out);env.connect(this.dl);
    parts.forEach(([h,a])=>{const o=this.ctx.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f*h,t);
      if(glide)o.frequency.exponentialRampToValueAtTime(f*h*glide,t+dur*0.5);
      const g=this.ctx.createGain();g.gain.value=a;o.connect(g);g.connect(env);o.start(t);o.stop(t+dur+0.05);});}catch(e){}},
  rausch(t,dur,vol,f0,f1){if(!S.ton||!this.ctx)return;try{
    if(!this.nb){const b=this.ctx.createBuffer(1,this.ctx.sampleRate,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;}
    const s=this.ctx.createBufferSource();s.buffer=this.nb;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=this.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*0.25);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.out);g.connect(this.dl);s.start(t);s.stop(t+dur+0.05);}catch(e){}},
  // die Klänge des Trainings: richtig · Level geschafft · sitzt · Etappe · Finale
  richtig(){const t=this.now();this.note(784,t,0.2,0.045,[[1,1],[4,.25]],'sine',0.99);this.note(1175,t+0.09,0.34,0.045,[[1,1],[4,.2]],'sine',0.99);},
  level(){const t=this.now()+0.28;[523,659,784].forEach((f,i)=>this.note(f,t+i*0.1,0.7,0.04));},
  sitzt(){const t=this.now()+0.28;[523,659,784,1047].forEach((f,i)=>this.note(f,t+i*0.1,0.9,0.042));[523,784,1047].forEach(f=>this.note(f,t+0.5,1.4,0.026,[[1,1],[2,.2]]));},
  etappe(){const t=this.now();[392,523,659,784].forEach((f,i)=>this.note(f,t+i*0.13,0.5,0.045,[[1,1],[2,.3],[3,.12]],'triangle'));[523,659,784,1047].forEach(f=>this.note(f,t+0.56,1.5,0.03,[[1,1],[2,.2]]));},
  finale(){this.feuerBereit();const t=this.now();this.note(104,t+0.3,0.7,0.035,[[1,1],[2,.5],[3,.3]],'sawtooth',1.55);
    [523,659,784,1047,1319,1568].forEach((f,i)=>this.note(f,t+1.0+i*0.12,1.2,0.045));
    [523,784,1047,1319].forEach(f=>this.note(f,t+1.85,1.8,0.03,[[1,1],[2,.2]]));},
  feuer(){const sr=this.ctx.sampleRate,d=feuerDaten(sr),b=this.ctx.createBuffer(1,d.length,sr);b.getChannelData(0).set(d);return b;},
  feuerBereit(){if(!S.ton||!this.ctx||this.fb)return;try{this.fb=[this.feuer(),this.feuer(),this.feuer()];}catch(e){}},
  knall(){if(!S.ton||!this.ctx)return;this.feuerBereit();if(!this.fb)return;try{
    const q=this.ctx.createBufferSource();q.buffer=pick(this.fb);q.playbackRate.value=0.82+Math.random()*0.36;
    const g=this.ctx.createGain();g.gain.value=0.3+Math.random()*0.12;q.connect(g);g.connect(this.master);q.start(this.now());}catch(e){}}
};

/* ---------- Aufgabentypen und Zustand ---------- */
const PUNKTE={q:1,b:2,w:5}, NOETIG={q:3,b:2,w:2}, ETAPPE=15;
const LEVELNR={q:1,b:2,w:3};     // Quick, Build, Write sind Arbeitsbegriffe der Planung; auf der Seite steht nur die Zahl
const PQ=V('p')+','+V('q');
const TYPEN=[
  {id:'norm',   titel:'Normieren',             level:['q','b','w'], aktiv:true, punkte:{w:3}},
  {id:'pq',     titel:'Die '+PQ+'-Formel',      level:['q','b','w'], aktiv:true},
  {id:'anzahl', titel:'Wie viele Lösungen?',   level:['q','w'],     aktiv:true},
  {id:'weg',    titel:'Der schnellste Weg',    level:['q','b','w'], aktiv:true},
  {id:'binom',  titel:'Binomische Formeln',    level:['q','b'],     aktiv:true}
];
const TYP={};TYPEN.forEach(t=>TYP[t.id]=t);
const S={ansicht:'start',modus:null,etappe:1,pkt:0,pos:0,letzter:null,kronen:0,filter:{q:true,b:true,w:true},ton:false,geuebt:false,finale:false,typ:{},einzel:null,zeiten:[],offen:{}};
/* Die Anwendung „Die Wasserrakete“ hat ein eigenes Erfolgsband mit drei Teilen, einem je Schritt. Im Gesamttraining ist sie eine eigene Etappe:
   zum ersten Mal nach Etappe 2; solange nicht alle drei Schritte sitzen, zwei Etappen später wieder, mit neuer Rakete (wie das Werkstor in QF1) */
const WERKSTOR={id:'rakete',titel:'Die Wasserrakete'};
function neuerStand(){TYPEN.forEach(t=>S.typ[t.id]={top:0,streak:0,sl:-1,halb:false,falsch:0,zuletzt:-1,faellig:null});S.werk={ok:[false,false,false],faellig:3,lauf:{},n:0};}
neuerStand();
const A={};                                        // die aktuelle Aufgabe
let aufgabeNr=0;

const band=t=>{const st=S.typ[t.id],n=t.level.length;return st.top>=n?1:(st.top+(st.halb?.5:0))/n;};
const voll=t=>S.typ[t.id].top>=t.level.length;
const sechsVoll=()=>TYPEN.filter(t=>t.aktiv).every(voll);
const werkBand=()=>S.werk.ok.filter(Boolean).length/3, werkVoll=()=>S.werk.ok.every(Boolean);

/* Ist im Gesamttraining als Nächstes die Anwendung dran? Am Anfang einer Etappe, wenn es fällig ist; sofort, wenn sonst alles sitzt; und solange ein Durchgang offen ist.

function werkDran(){return ANW&&!werkVoll()&&S.filter.w&&(!!S.werk.lauf.gesamt||sechsVoll()||(S.pkt===0&&S.etappe>=S.werk.faellig));}

function aktLevel(t){const st=S.typ[t.id];for(let i=st.top;i<t.level.length;i++)if(S.filter[t.level[i]])return i;return null;}
function auffrLevel(t){for(let i=t.level.length-1;i>=0;i--)if(S.filter[t.level[i]])return i;return null;}

function empfohlen(){              // höchstens zwei Marken zugleich: die mit den meisten Fehlern nacheinander
  return TYPEN.filter(t=>t.aktiv&&!voll(t)&&S.typ[t.id].falsch>=2).sort((a,b)=>S.typ[b.id].falsch-S.typ[a.id].falsch).slice(0,2).map(t=>t.id);}

/* Der Ablauf des Gesamttrainings (Checkpoint 3) */
function naechste(){
  const akt=TYPEN.filter(t=>t.aktiv);
  let kand=akt.map(t=>[t,aktLevel(t)]).filter(x=>x[1]!==null);
  if(!kand.length){
    if(!sechsVoll())return null;
    kand=akt.map(t=>[t,auffrLevel(t)]).filter(x=>x[1]!==null);if(!kand.length)return null;
    const k=kand.filter(x=>x[0].id!==S.letzter);return pick(k.length?k:kand);}
  if(S.etappe===1){const q=kand.filter(([t,li])=>t.level[li]==='q');if(q.length)kand=q;}
  const k2=kand.filter(x=>x[0].id!==S.letzter);if(k2.length)kand=k2;
  const f=kand.filter(([t])=>{const st=S.typ[t.id];return st.faellig!==null&&st.faellig<=S.pos;});
  const pool=f.length?f:kand;
  const min=Math.min(...pool.map(([t])=>S.typ[t.id].zuletzt));
  return pick(pool.filter(([t])=>S.typ[t.id].zuletzt===min));
}
function werte(t,li,ok,zaehlt){
  const st=S.typ[t.id],key=t.level[li];let ereignis=null;
  st.zuletzt=S.pos;st.faellig=null;
  if(li>=st.top){
    if(st.sl!==li){st.sl=li;st.streak=0;}
    if(!zaehlt)st.faellig=S.pos+3;
    else if(ok){st.streak++;st.falsch=0;if(key!=='q'||st.streak>=2)st.halb=true;
      if(st.streak>=NOETIG[key]){st.top=li+1;st.streak=0;st.sl=-1;st.halb=false;ereignis=st.top>=t.level.length?'sitzt':'level';}}
    else{st.streak=0;st.falsch++;st.faellig=S.pos+3;}
  }
  S.pos++;return ereignis;
}

function koord(X,Y,o){o=o||{};const R=18,ex=o.ex||30,ey=o.ey||ex,sy=o.sy||1,lx=o.lx||2,ly=o.ly||2*sy;
  const W=R*2+(X[1]-X[0])*ex,H=R*2+(Y[1]-Y[0])*ey,x=v=>+(R+(v-X[0])*ex).toFixed(1),y=v=>+(R+(Y[1]-v)*ey).toFixed(1),id='clip'+(++gid);

    for(let i=0;i<=240;i++){const v=von+i*(bis-von)/240,w=Math.max(Y[0]-(Y[1]-Y[0]),Math.min(Y[1]+(Y[1]-Y[0]),f(v)));d+=(i?'L':'M')+x(v).toFixed(1)+' '+y(w).toFixed(1);}return d;};

/* Ein passender Ausschnitt für eine Parabel mit Nullstellen und Hoch- oder Tiefpunkt: alles Wichtige liegt sichtbar im Bild */
function fenster(pts,o){o=o||{};let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]).concat([0]);
  let x0=Math.floor(Math.min(...xs,0)-1),x1=Math.ceil(Math.max(...xs,0)+1);if(x1-x0<8){const d=8-(x1-x0);x0-=Math.floor(d/2);x1+=Math.ceil(d/2);}
  let y0=Math.min(...ys),y1=Math.max(...ys);const span=Math.max(4,y1-y0);const sy=span>40?10:span>20?5:span>10?2:1;

  const ex=Math.min(34,(o.breite||330)/(x1-x0)),ey=Math.min(ex,(o.hoehe||330)/(y1-y0));

function pqWerte(p,q){const m=r4(-p/2),qu=r4(p*p/4),D=r4(qu-q);

function pqZeilen(p,q,v){v=v||X;const r=pqWerte(p,q),z=[zl(pqText(p,q))];

   Im Einzeltraining dieses Typs zeigt dasselbe Fenster nur den Hinweis „Du bist schon in diesem Einzeltraining.“ mit „OK“ (Lehrkraft 21.11.2026). */

function neueAufgabe(wieder){
  clearTimeout(A.auto);if(S.rueckblick)endeLetzte();merkeLetzte();
  let t,li,auf;const o=wieder&&S.offen[offenKey()];
  if(o&&S.filter[o.t.level[o.li]]&&(aktLevel(o.t)===o.li||aktLevel(o.t)===null)){t=o.t;li=o.li;auf=o.auf;}   // die angefangene Aufgabe steht noch da
  else{
    if(S.modus==='gesamt'){const r=naechste();if(!r)return zeigeLeer();t=r[0];li=r[1];}
    else{t=TYP[S.einzel.id];li=aktLevel(t);if(li===null)li=auffrLevel(t);if(li===null)return zeigeLeer();}
    auf=GEN[t.id][t.level[li]]();S.offen[offenKey()]={t,li,auf};}
  const key=t.level[li];
  Object.keys(A).forEach(k=>delete A[k]);
  Object.assign(A,{nr:++aufgabeNr,t,li,key,auf,form:auf.form,start:performance.now(),gewertet:false,fertig:false,hilfe:false,gezeigt:0,denk:false,versuche:0});
  S.letzter=t.id;
  const m=$('.buehne');m.scrollTop=0;m.dataset.nr=A.nr;
  FORM[auf.form](auf,m);
  zeigeHilfen();zeigeEtappe();
}

function Feuerwerk(canvas){

const tfKurve=(r,sichtbar,kl)=>{$$('.kurven .gk.'+(kl||'tk'),r).forEach(k=>k.classList.toggle('weg',!sichtbar));};
const tfNull=(k,L,kl)=>L.map((z,i)=>k.pkt(z,0,kl||(i?'px2':'px1'),zahl(z),i?8:-8,-9,i?'start':'end')).join('');
const TAFEL=[
  /* 1 Normieren: Die Klasse sagt die Umformungen an, bis p und q dastehen */
  {typ:'Normieren',form:'Umformungen ansagen',arten:['rc','null','rbc','klammer','fk','minus','halb'],gen(art){
    let p,q,a,form;
    for(let n=0;n<80;n++){({p,q}=normiert('zwei',{pmax:10,qmax:30}));
      form=art==='minus'||art==='halb'?'null':art;a=art==='klammer'?1:art==='minus'?pick([-1,-2,-3]):art==='halb'?0.5:pick([2,3,4,5]);
      if(Math.abs(a*p)<=40&&Math.abs(a*q)<=60)break;}

      notiz:'Erst umstellen, bis rechts 0 steht. Dann normieren. Dann '+V('p')+' und '+V('q')+' mit Vorzeichen ablesen.',schritte:g.bisPQ};}},
  /* 2 Wie viele Lösungen? Die Klasse nennt q (oder p), die Lehrkraft stellt es ein; der Graph zeigt, ob es stimmt */

    const d={},istP=art[0]==='p',fest=+art.slice(1);let p0,q0;
    if(istP){q0=fest;p0=0;}else{p0=fest;q0=0;}

/* Antippen sieht man: Der große Knopf fällt in sich zusammen („los geht’s“), Kacheln geben kurz nach; erst dann wechselt die Ansicht */
const RUHIG=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const TIPP={gesamt:['los',270],einzel:['los',270],erkl:['los',270],einzelstart:['tipp',140],werk:['tipp',140],info1:['tipp',140],tafel:['tipp',140],info2:['tipp',140],info3:['tipp',140],info4:['tipp',140],erkunder:['tipp',140]};
document.addEventListener('click',e=>{Sound.init();const b=e.target.closest('[data-akt]');if(!b||b.disabled)return;const f=AKT[b.dataset.akt];if(!f)return;
  const t=TIPP[b.dataset.akt];if(!t||RUHIG)return f(b,e);
  if(b.classList.contains(t[0]))return;b.classList.add(t[0]);
  if(t[0]==='los'){const m=b.closest('main');if(m)m.classList.add('geht');}
  setTimeout(()=>{f(b,e);b.classList.remove(t[0]);const m=b.closest('main');if(m)m.classList.remove('geht');},t[1]);});     // die Marke wieder wegnehmen: Unter Info und Erkunder bleibt die Seite stehen
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const oben=$('.ov')||$('.menue');
  if(oben){if(e.key==='Escape'||((e.key==='Enter'||e.key===' ')&&(oben.classList.contains('krone-ov')||oben.classList.contains('finale')))){e.preventDefault();schliesse();}return;}
  const eb=$('.ebene');
  if(eb){if(e.key==='Escape')eb._zu();else if(eb._schritt&&(e.key==='ArrowRight'||e.key==='Enter'||e.key===' ')){e.preventDefault();eb._schritt(1);}else if(eb._schritt&&e.key==='ArrowLeft')eb._schritt(-1);return;}
  if(S.ansicht==='werk'){
    if(W.taste){if(e.key.toLowerCase()==='k'&&W.keine){W.keine();return;}const k=/^\d$/.test(e.key)?e.key:e.key==='-'?'−':(e.key===','||e.key==='.')?',':e.key==='Backspace'?'del':(e.key==='Tab'||e.key==='ArrowRight')?'weiter':null;if(k){e.preventDefault();W.taste(k);return;}}
    else if(/^[1-4]$/.test(e.key)){const o=$$('.wrechts .opt')[+e.key-1];if(o&&!o.disabled)o.click();return;}
    if(e.key==='Enter'){const h=$('.leiste .haupt');if(h&&!h.hidden&&!h.disabled){e.preventDefault();h.click();}}
    return;}
  if(S.rueckblick){if(e.key==='Enter'||e.key==='Escape'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();endeLetzte();}return;}
  if(S.ansicht!=='aufgabe'||!A.auf)return;
  if(A.form==='wisch'&&!A.gewertet&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();A.wisch(e.key==='ArrowRight');return;}
  if(A.form==='stapel'&&!A.gewertet&&/^[1-3]$/.test(e.key)){A.stapel(A.auf.stapel[+e.key-1].id);return;}
  if(A.form==='fehler'&&!A.gewertet&&/^[1-9]$/.test(e.key)){A.tippe(+e.key-1);return;}
  if(A.form==='kette'&&!A.fertig&&/^[1-4]$/.test(e.key)){const o=$$('.kopts .opt')[+e.key-1];if(o&&!o.disabled)o.click();return;}
  if((A.form==='puzzle'||A.form==='einsetzen')&&!A.fertig&&/^[1-9]$/.test(e.key)){const o=$$('.pchips .chip,.echips .chip')[+e.key-1];if(o&&!o.disabled)o.click();return;}
  if(A.form==='menge'&&A.taste&&!A.fertig){const k=/^\d$/.test(e.key)?e.key:e.key==='-'?'−':(e.key===','||e.key==='.')?',':e.key==='Backspace'?'del':(e.key==='Tab'||e.key==='ArrowRight')?'weiter':null;
    if(e.key.toLowerCase()==='k'){A.keine();return;}if(k){e.preventDefault();A.taste(k);return;}}
  if((A.form==='wahl'||A.form==='mehr')&&!A.gewertet&&/^[1-4]$/.test(e.key)){const o=$$('.opt')[+e.key-1];if(o)o.click();return;}
  if(A.form==='eingabe'&&A.taste&&!A.fertig){
    const k=/^\d$/.test(e.key)?e.key:e.key==='-'?'−':(e.key===','||e.key==='.')?',':e.key==='Backspace'?'del':(e.key==='Tab'||e.key==='ArrowRight')?'weiter':null;
    if(e.key.toLowerCase()==='k'&&A.keine){A.keine();return;}
    if(k){e.preventDefault();A.taste(k);return;}}
  if(e.key==='Enter'){const h=$('.leiste .haupt');if(h&&!h.hidden&&!h.disabled){e.preventDefault();h.click();}}
});

/* ---------- Start: feste Adressen führen direkt hinein ---------- */
function nachAdresse(){const h=(location.hash||'').replace('#','');
  $$('.ebene').forEach(e=>e.remove());schliesse();
  if(h==='einzeltraining')vEinzel();else if(h==='erklaerungen')vErkl();
  else if(h==='info-1'){vErkl();AKT.info1();}else if(h==='info-2'){vErkl();AKT.info2();}else if(h==='info-3'){vErkl();AKT.info3();}else if(h==='info-4'){vErkl();AKT.info4();}
  else if(h==='erkunder'){vErkl();AKT.erkunder();}else if(h==='tafel-runde'){vErkl();AKT.tafel();}
  else if(h==='gesamttraining')startGesamt();else if(h==='wasserrakete'&&ANW)startWerk('einzel');
  else vStart();}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');
  if(['einzeltraining','erklaerungen','info-1','info-2','info-3','info-4','erkunder','tafel-runde','wasserrakete'].includes(h)&&S.ansicht!=='aufgabe'&&S.ansicht!=='werk')nachAdresse();});
(function(){const h=(location.hash||'').replace('#','');if(h==='gesamttraining'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}nachAdresse();})();
window.QF3={S,A,W,TYPEN,GEN,FEHLER,TAFEL,RAK,RAKA,zeigeTafel,Sound,FORM,weiter,zeigeFinale,zeigeKrone,startEinzel,startGesamt,startWerk,werkWeiter,werkDran,vStart,vEinzel,ANW};     // für die Prüfläufe
