/* =====================================================================
   PowerCheck „Quadratische Funktionen“: „Einmal alles“ (Arbeitstitel der Lehrkraft, 26.11.2026; nicht „Steckbrief“, das heißt in der Oberstufe etwas anderes)
   Das Stück, das die Blätter verbindet: eine Funktion in allgemeiner Form, daran fünf kleine Schritte in bekannten Formen. (1) Öffnung und y-Achsenabschnitt
   ablesen, (2) Nullstellen, Weg frei, Lösungsmenge eintippen, (3) Hoch- oder Tiefpunkt über die Mitte der Nullstellen, (4) Term in Nullstellenform eintippen,
   (5) Skizze bauen. Am Ende zeichnet sich die Parabel mit allem Gefundenen und dem Term in beiden Formen. Es ist die Vorform dessen, was bei den
   Polynomfunktionen kommt. Ablauf, Leiste, Rückblick und Wertung kommen aus dem Baustein powercheck; hier stehen nur die Fälle und die Schritte.
   ===================================================================== */
const W={timer:0,lauf:0};      // die Anwendung des Rahmens (anwendung.js) erwartet W; das Stück läuft über den Baustein powercheck
function startWerk(modus){pcStueckStart(modus);}

/* Feste Liste [a, x₁, x₂]: f(x) = a(x − x₁)(x − x₂), glatte Zahlen, gemischt: zwei Nullstellen, nach unten geöffnet, Zahl vor x² (normieren), Nullstelle 0
   (ausklammern), ohne x-Glied (Wurzel ziehen), doppelte Nullstelle. Keine Funktion ohne Nullstellen. Hoch- oder Tiefpunkt und y-Achsenabschnitt liegen
   zwischen −9 und 9, die Nullstellen zwischen −6 und 5 (Skizze bauen reicht von −8 bis 8). pruefen/gen_test.js rechnet jeden Fall nach. */
const EA_LISTE=[[1,-1,3],[-1,0,2],[2,-2,2],[1,2,2],[-1,-5,1],[2,-1,3],[1,-6,0],[1,-3,3],[-1,1,1],[1,1,5],[3,1,3],[-1,-2,2],
  [1,-4,2],[2,1,1],[-2,-3,1],[1,0,4],[1,-5,-1],[-1,2,4],[1,-2,2],[1,-3,-3],[2,-2,0],[2,1,3],[-1,-1,3]];
const EA_START=Math.floor(Math.random()*EA_LISTE.length);      // jede Sitzung beginnt woanders in der Liste, danach der Reihe nach
function eaFall(n){const [a,x1,x2]=EA_LISTE[(EA_START+n)%EA_LISTE.length],b=-a*(x1+x2),c=a*x1*x2,m=(x1+x2)/2,f=x=>a*(x-x1)*(x-x2),yS=r4(f(m));
  const art=x1===x2?'doppelt':b===0?'wurzel':c===0?'aus':'pq';
  return {a,x1,x2,b,c,m,yS,f,art,L:x1===x2?[x1]:[x1,x2],hoch:a<0,term:poly(a,b,c)};}
const eaTerm=F=>fx(F.term);
const eaPunkt=F=>(F.hoch?'Hochpunkt ':'Tiefpunkt ')+punkt(F.hoch?'H':'T',F.m,F.yS);
const eaNsf=F=>V('f')+'('+V('x')+') = '+(F.a===1?'':F.a===-1?'−':zahl(F.a)+' · ')+(F.x1===F.x2?lf(F.x1)+Q:F.x2===0?lf(0)+' · '+lf(F.x1):lf(F.x1)+' · '+lf(F.x2));      // x zuerst: x · (x + 6)
const eaUm=(id,o)=>'<span class="umsch" data-w="'+id+'">'+o.map(([v,t])=>'<button type="button" data-v="'+v+'">'+t+'</button>').join('')+'</span>';
const eaVZ=id=>'<span class="umsch vz" data-w="'+id+'"><button type="button" data-v="+" aria-label="plus">+</button><button type="button" data-v="−" aria-label="minus">−</button></span>';
const eaZl=(h,op)=>op?{h,op}:{h},eaTx=h=>({h,text:true});

/* Der Weg zu den Nullstellen, so wie die Blätter rechnen: Wurzel ziehen (QF2), ausklammern (QF2), sonst normieren und die p,q-Formel (QF3) */
function eaNullZeilen(F){const {a,b,c}=F,x=V('x'),Z=[eaZl(V('f')+'('+x+') = 0')];
  if(F.art==='wurzel'){const r=-c/a,k=Math.sqrt(r);Z.push(eaZl(poly(a,0,c)+' = 0','| '+(c<0?'+ ':'− ')+zahl(Math.abs(c))));
    if(a!==1){Z.push(eaZl(glied(a,2)+' = '+zahl(-c),'| : '+kl(a)));}
    Z.push(eaZl(x+Q+' = '+zahl(r),'| √'),eaZl(oder(-k,k)),eaZl(menge(F.L)));return Z;}
  if(F.art==='aus'){const x2=-b/a;Z.push(eaZl(poly(a,b,0)+' = 0'),eaZl(x+' · '+lin(a,b)+' = 0'),eaTx('Ein Produkt ist 0, wenn ein Faktor 0 ist.'),eaZl(x+' = 0 oder '+glied(a,1)+(b<0?' − ':' + ')+zahl(Math.abs(b))+' = 0'),
      eaZl(oder(0,x2)),eaZl(menge(F.L)));return Z;}
  const p=b/a,q=c/a,h=-p/2,D=r4(h*h-q),s=Math.sqrt(D);
  Z.push(eaZl(poly(a,b,c)+' = 0',a!==1?'| : '+kl(a):''));
  if(a!==1)Z.push(eaZl(poly(1,p,q)+' = 0'));
  Z.push(eaTx(V('p')+' = '+zahl(p)+', '+V('q')+' = '+zahl(q)));
  Z.push(eaZl(x+'₁,₂ = '+zahl(h)+' ± √('+kl(h)+Q+' − '+kl(q)+')'),eaZl(x+'₁,₂ = '+zahl(h)+' ± √'+zahl(D)+(D?' = '+zahl(h)+' ± '+zahl(s):' = '+zahl(h))));
  Z.push(eaZl(D?V('x')+'₁ = '+zahl(F.x1)+', '+V('x')+'₂ = '+zahl(F.x2):V('x')+' = '+zahl(F.x1)),eaZl(menge(F.L)));return Z;}

const EA_SCHRITTE=[{name:'Öffnung und y-Achsenabschnitt'},{name:'Nullstellen'},{name:'Hoch- oder Tiefpunkt'},{name:'Nullstellenform'},{name:'Skizze'}];
function eaAufgabe(F,i,E){const x=V('x'),y=V('y'),T=eaTerm(F);
  /* (1) Öffnung und y-Achsenabschnitt ablesen: ein Satz mit Lücken wie QF1 „Am Term ablesen“, Level 2 */
  if(i===0){const oeff=F.a>0?'o':'u';
    return {form:'eingabe',einKl:'satz',frage:'Lies am Term ab.',term:T,erkl:'qf1:info1',rtitel:'Lösung',rleer:'',
      denk:'Die Zahl vor '+x+Q+' sagt, wie der Graph geöffnet ist. Auf der '+y+'‑Achse ist '+x+' = 0.',
      ein:'<span class="sz"><span>Der Graph ist</span>'+eaUm('oeff',[['o','nach oben'],['u','nach unten']])+'<span>geöffnet.</span></span>'+
        '<span class="sz"><span>Er schneidet die '+y+'‑Achse bei '+y+' =</span>'+FELD('c')+'<span>.</span></span>',
      loes:{felder:{c:F.c},um:{oeff}},buchst:{o:'o',u:'u'},
      schritte:[eaTx(V('a')+' = '+zahl(F.a)+(F.a>0?' ist positiv: nach oben geöffnet.':' ist negativ: nach unten geöffnet.')),eaTx(V('f')+'(0) = '+zahl(F.c)+': Der Graph schneidet die '+y+'‑Achse bei '+y+' = '+zahl(F.c)+'.')],
      pruefe:w=>{E.oeff=w.oeff;E.c=num(w.c);const Fa=[];if(w.oeff!==oeff)Fa.push('oeff');if(!gleich(num(w.c),F.c))Fa.push('c');if(!Fa.length)return {ok:true};
        const h=Fa.includes('oeff')?'Die Zahl vor '+x+Q+' ist '+zahl(F.a)+': '+(F.a>0?'positiv, also nach oben geöffnet.':'negativ, also nach unten geöffnet.'):
          gleich(num(w.c),F.b)?'Das ist die Zahl vor '+x+'. Gesucht ist '+V('f')+'(0): die Zahl ohne '+x+'.':'Setze '+x+' = 0 ein: '+V('f')+'(0) = '+zahl(F.c)+'.';
        return {ok:false,hinweis:h,falsch:Fa};}};}
  /* (2) Nullstellen, der Weg ist frei: Lösungsmenge eintippen wie in QF2 und QF3 */
  if(i===1){const L=F.L;
    return {form:'menge',frage:'Bestimme die Nullstellen. Der Weg ist frei.',term:T,L,erkl:'qf3:info3',schritte:eaNullZeilen(F),
      denk:F.art==='wurzel'?'Nur '+x+Q+' und eine Zahl: Wurzel ziehen.':F.art==='aus'?'Keine Zahl ohne '+x+': Klammere '+x+' aus.':F.a!==1?'Normiere zuerst: Teile durch '+zahl(F.a)+'. Dann die '+V('p')+','+V('q')+'‑Formel.':'Setze '+V('f')+'('+x+') = 0 und nimm die '+V('p')+','+V('q')+'‑Formel.',
      pruefe:(Ein,keine)=>{E.L=keine?[]:Ein.slice();const S_=sortiert(L),Es=sortiert(Ein),gl=(u,v)=>u.length===v.length&&u.every((z,j)=>gleich(z,v[j]));
        if(keine)return {ok:false,hinweis:'Es gibt Nullstellen: Löse '+V('f')+'('+x+') = 0.',falsch:['keine']};
        if(gl(Es,S_))return {ok:true};
        const R=S_.slice(),treffer=Ein.filter(z=>{const j=R.findIndex(s=>gleich(s,z));if(j<0)return false;R.splice(j,1);return true;});
        let h='Nicht richtig. Vergleiche deine Rechnung Zeile für Zeile mit der Lösung.';
        if(gl(Es,sortiert(L.map(z=>-z)))&&L.some(z=>z!==0))h='Vorzeichen: Prüfe durch Einsetzen, '+V('f')+'('+zahl(F.x2)+') = 0.';
        else if(Es.length<S_.length&&Es.every(z=>S_.some(s=>gleich(s,z))))h=F.art==='aus'?'Eine Nullstelle fehlt: Auch der Faktor '+x+' kann null werden.':'Eine Nullstelle fehlt.';
        else if(F.art==='pq'&&F.a!==1)h='Erst normieren: Teile durch '+zahl(F.a)+', dann die '+V('p')+','+V('q')+'‑Formel.';
        return {ok:false,hinweis:h,falsch:['a','b'],treffer};}};}
  /* (3) Hoch- oder Tiefpunkt über die Mitte der Nullstellen, wie QF2 „Hoch- oder Tiefpunkt“, Level 2. Folgefehler (Haken in Klammern): Die Mitte wird an den
     eigenen Nullstellen aus Schritt 2 gemessen, das x des Punkts an der eigenen Mitte, das y an f(eigenes x), Hoch- oder Tiefpunkt an der eigenen Öffnung. */
  if(i===2){const art2=F.hoch?'H':'T';
    return {form:'eingabe',einKl:'satz',frage:'Bestimme den Hoch- oder Tiefpunkt über die Mitte der Nullstellen.',term:T,erkl:'qf2:info2',rtitel:'Rechnung',rleer:'',
      denk:'Der Hoch- oder Tiefpunkt liegt in der Mitte der Nullstellen. Setze die Mitte ein.',
      ein:'<span class="sz"><span>Mitte: '+x+' =</span>'+FELD('m')+'<span>.</span></span>'+
        '<span class="sz"><span>Also</span>'+eaUm('art',[['H','Hochpunkt'],['T','Tiefpunkt']])+'<span class="pkt">('+FELD('px')+'|'+FELD('py')+').</span></span>',
      loes:{felder:{m:F.m,px:F.m,py:F.yS},um:{art:art2}},buchst:{h:'H',t:'T'},folgt:{px:['m'],py:['px']},
      schritte:[eaTx(F.L.length===2?'Nullstellen '+zahl(F.x1)+' und '+zahl(F.x2)+'.':'Nur eine Nullstelle: '+zahl(F.x1)+'. Dort liegt der '+(F.hoch?'Hochpunkt':'Tiefpunkt')+'.'),
        eaZl(F.L.length===2?'Mitte: '+x+' = ('+zahl(F.x1)+' + '+kl(F.x2)+') : 2 = '+zahl(F.m):'Mitte: '+x+' = '+zahl(F.m)),
        eaZl(V('f')+'('+zahl(F.m)+') = '+zahl(F.yS)),eaTx((F.hoch?'Nach unten geöffnet: Hochpunkt ':'Nach oben geöffnet: Tiefpunkt ')+punkt(art2,F.m,F.yS)+'.')],
      pruefe:w=>{const mm=num(w.m),px=num(w.px),py=num(w.py),Fa=[],G=[],eL=E.L||[];
        const eM=eL.length===2?(eL[0]+eL[1])/2:eL.length===1?eL[0]:null,eArt=E.oeff?(E.oeff==='o'?'T':'H'):null;
        const schluss=(k,ok,eigen)=>{if(ok)return;if(eigen)G.push(k);else Fa.push(k);};
        schluss('m',gleich(mm,F.m),eM!==null&&gleich(mm,eM));schluss('art',w.art===art2,w.art===eArt);
        schluss('px',gleich(px,F.m),gleich(px,mm));schluss('py',gleich(py,F.yS),gleich(py,r4(F.f(px))));
        E.m=mm;E.art=w.art;E.px=px;E.py=py;
        if(!Fa.length&&!G.length)return {ok:true};let h;
        if(Fa.includes('m'))h=F.L.length===2?'Die Mitte zwischen '+zahl(F.x1)+' und '+zahl(F.x2)+': ('+zahl(F.x1)+' + '+kl(F.x2)+') : 2 = '+zahl(F.m)+'.':'Bei nur einer Nullstelle ist sie selbst die Mitte.';
        else if(Fa.includes('art'))h=F.hoch?'Nach unten geöffnet: Hochpunkt.':'Nach oben geöffnet: Tiefpunkt.';
        else if(Fa.includes('px'))h='Der '+x+'-Wert des Punkts ist die Mitte.';
        else if(Fa.includes('py'))h=gleich(py,0)&&F.yS!==0?'Den '+y+'-Wert bekommst du durch Einsetzen: '+V('f')+'('+zahl(px)+') = '+zahl(r4(F.f(px)))+'.':'Setze die Mitte ein: '+V('f')+'('+zahl(F.m)+') = '+zahl(F.yS)+'.';
        else h='Richtig gefolgert, aber '+(G.includes('m')?'deine Nullstellen aus Schritt 2 stimmen':'deine Öffnung aus Schritt 1 stimmt')+' nicht.';
        return {ok:false,hinweis:h,falsch:Fa,folge:G};}};}
  /* (4) Term in Nullstellenform eintippen, wie QF4 „Term bestimmen“, Level 3: das Vorzeichen jeder Klammer mit dem Umschalter. Folgefehler: Klammern, die zu
     den eigenen Nullstellen aus Schritt 2 passen, bekommen den Haken in Klammern */
  if(i===3){
    return {form:'eingabe',einKl:'nsf',frage:'Schreibe '+V('f')+' in Nullstellenform.',term:T,erkl:'qf4:info1',rtitel:'Lösung',rleer:'',
      denk:'Zu jeder Nullstelle gehört eine Klammer: Zu 3 gehört ('+x+' − 3). Davor steht die Zahl vor '+x+Q+'.',
      notiz:'Wähle in jeder Klammer das Vorzeichen.',vz:{p:'s1',q:'s2'},tauschbar:true,
      ein:'<span class="nsa"><span>'+V('f')+'('+x+') =</span>'+FELD('a')+'</span><span class="nsk"><span>· ('+x+'</span>'+eaVZ('s1')+FELD('p')+'<span>)</span></span><span class="nsk"><span>· ('+x+'</span>'+eaVZ('s2')+FELD('q')+'<span>)</span></span>',
      schritte:[eaTx(F.L.length===2?'Nullstellen '+zahl(F.x1)+' und '+zahl(F.x2)+', die Zahl vor '+x+Q+' ist '+zahl(F.a)+'.':'Doppelte Nullstelle '+zahl(F.x1)+': zweimal dieselbe Klammer. Die Zahl vor '+x+Q+' ist '+zahl(F.a)+'.'),
        eaZl(eaNsf(F)),eaTx('Probe: Ausmultipliziert ergibt sich wieder '+F.term+'.')],
      pruefe:w=>{const a=num(w.a),z=[[w.s1,num(w.p),'s1','p'],[w.s2,num(w.q),'s2','q']].map(([s,v,ks,kv])=>({r:r4((s==='−'?1:-1)*v),v,ks,kv})),Fa=[],G=[];
        const T2=[F.x1,F.x2],eL=E.L||[],O=eL.length===1?[eL[0],eL[0]]:eL.length===2?eL.slice():null;
        const paar=(Z)=>{const p0=(gleich(z[0].r,Z[0])?1:0)+(gleich(z[1].r,Z[1])?1:0),p1=(gleich(z[0].r,Z[1])?1:0)+(gleich(z[1].r,Z[0])?1:0);return p1>p0?[Z[1],Z[0]]:[Z[0],Z[1]];};
        const zT=paar(T2),zO=O?paar(O):null;
        z.forEach((k,j)=>{if(gleich(k.r,zT[j]))return;
          if(zO&&gleich(k.r,zO[j])&&!gleich(zO[j],zT[j])){G.push(k.ks,k.kv);return;}
          if(gleich(Math.abs(k.v),Math.abs(zT[j]))&&zT[j]!==0)Fa.push(k.ks);else Fa.push(k.kv);});
        if(!gleich(a,F.a))Fa.push('a');
        if(!Fa.length&&!G.length)return {ok:true};let h;
        if(Fa.includes('a'))h=a===1&&F.a!==1?'Die Zahl vor den Klammern fehlt: Sie ist '+zahl(F.a)+', wie vor '+x+Q+'.':gleich(a,-F.a)?'Vorzeichen der Zahl vor den Klammern: '+zahl(F.a)+', wie vor '+x+Q+'.':'Vor den Klammern steht die Zahl vor '+x+Q+': '+zahl(F.a)+'.';
        else if(Fa.some(k=>k[0]==='s'))h='Vorzeichen im Linearfaktor: Zur Nullstelle '+zahl(F.x2!==0?F.x2:F.x1)+' gehört '+lf(F.x2!==0?F.x2:F.x1)+'.';
        else if(Fa.length)h='Die Klammern gehören zu den Nullstellen '+(F.L.length===2?zahl(F.x1)+' und '+zahl(F.x2):zahl(F.x1)+' (doppelt)')+'.';
        else h='Richtig gefolgert, aber deine Nullstellen aus Schritt 2 stimmen nicht.';
        return {ok:false,hinweis:h,falsch:Fa,folge:G};}};}
  /* (5) Skizze bauen, wie QF4 „Schneiden oder berühren“, Level 2 */
  const Lz=F.x1===F.x2?[{x:F.x1,art:'b'}]:[{x:F.x1,art:'s'},{x:F.x2,art:'s'}],soll=F.L.map(zahl).join(' und ');

   Tafel-Runde. Er öffnet die Übersicht der Erklärungen als Ebene: Eine Erklärung macht ihr Platz (zurück geht es dann in die Aufgabe), die Tafel-Runde bleibt
   darunter stehen (zurück geht es zur selben Karte). o.bleibt: die Ebene bleibt unter der Übersicht stehen (Tafel-Runde); o.name: so heißt sie im Zurück-Knopf

const erklFuer=k=>{k=String(k||'');const i=k.indexOf(':'),q=QUELLEN[k.slice(0,i)],f=q&&q.erklFuer?q.erklFuer(k.slice(i+1)):null;return f||(()=>{});};

/* =====================================================================
   Trainingsrahmen: Lernstand auf diesem Gerät merken (Lehrkraft 24.11.2026: „ja“)
   Auf der Startseite ein Schalter, anfangs aus. Ist er an, steht der Stand des Trainings in localStorage unter happymatty:<EINHEIT>:lernstand:
   Bänder, Kronen, Etappen, Level-Wahl, Ton. Keine Antworten, keine Eingaben, keine Zeiten, nichts Persönliches. An = es gibt den Eintrag,
   aus = es gibt ihn nicht; beim Ausschalten wird er sofort gelöscht. „Lernstand löschen“ (nur wenn an) löscht ihn nach einer Rückfrage, schaltet aus
   und setzt den Stand der offenen Seite auf den Anfang. Unter file:// oder ohne Speicher verschwindet der Schalter still; jeder Zugriff in try/catch,
   ein kaputter oder veralteter Eintrag wird verworfen. Was hier steht, sagt auch die Datenschutzerklärung von happymatty.de.
   ===================================================================== */
const LS={v:1,key:'happymatty:'+(typeof EINHEIT!=='undefined'?EINHEIT:KURZ)+':lernstand',sp:null,ok:false,an:false,zuletzt:'',t:0,frage:false};

function lsSpeicher(){try{if(location.protocol==='file:')return null;const s=window.localStorage;if(!s||typeof s.getItem!=='function')return null;s.getItem(LS.key);return s;}catch(e){return null;}}
/* Was gemerkt wird: nur Zähler und Einstellungen, keine Aufgaben, keine Eingaben, keine Zeiten (S.zeiten, S.offen, S.letzte, S.werk.lauf bleiben weg) */
function lsDaten(){const typ={};
  TYPEN.forEach(t=>{const s=S.typ[t.id];typ[t.id]={top:s.top,streak:s.streak,sl:s.sl,halb:s.halb,falsch:s.falsch,zuletzt:s.zuletzt,faellig:s.faellig};});
  const d={v:LS.v,merken:true,etappe:S.etappe,pkt:S.pkt,pos:S.pos,letzter:S.letzter,kronen:S.kronen,filter:{q:!!S.filter.q,b:!!S.filter.b,w:!!S.filter.w},ton:!!S.ton,
    geuebt:!!S.geuebt,finale:!!S.finale,typ,werk:{ok:S.werk.ok.slice(),faellig:S.werk.faellig,n:S.werk.n}};
  if(FALLE)d.faelle=fallDaten();      // mehrere Anwendungen: der Stand jedes Falls (Baustein faelle); ohne FAELLE bleibt der Eintrag, wie er war
  if(PCF)d.pc=pcDaten();      // PowerCheck: Block, Versuche, Blätter der Etappe und das verbindende Stück (Baustein powercheck)
  if(HINWEISF)d.hinweis=hinweisGesehen;      // ob der Hinweis beim ersten Start schon gezeigt wurde (Baustein hinweis)
  if(HERAUSF)d.heraus=herausDaten();      // Fordere mich heraus: die Kennungen der geknackten Herausforderungen (Baustein heraus); ohne HERAUS bleibt der Eintrag, wie er war
  return d;}
/* Einen Eintrag prüfen und übernehmen: alles oder nichts. Fehlt ein Aufgabentyp (neue Fassung), fängt er vorn an; unbekannte bleiben weg */
function lsUebernimm(d){
  const ganz=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b,ja=x=>typeof x==='boolean',obj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
  if(!obj(d)||d.v!==LS.v||d.merken!==true)return false;
  if(!ganz(d.etappe,1,9999)||!ganz(d.pkt,0,999)||!ganz(d.pos,0,1e7)||!ganz(d.kronen,0,9999)||!ja(d.ton)||!ja(d.geuebt)||!ja(d.finale))return false;
  if(!(d.letzter===null||typeof d.letzter==='string'))return false;
  const f=d.filter;if(!obj(f)||!ja(f.q)||!ja(f.b)||!ja(f.w)||!(f.q||f.b||f.w))return false;
  const w=d.werk;if(!obj(w)||!Array.isArray(w.ok)||w.ok.length!==3||!w.ok.every(ja)||!ganz(w.faellig,0,9999)||!ganz(w.n,0,1e7))return false;
  if(!obj(d.typ))return false;
  if(FALLE&&!fallGueltig(d.faelle))return false;
  if(HERAUSF&&d.heraus!==undefined&&!herausGueltig(d.heraus))return false;
  if(PCF&&!pcGueltig(d.pc))return false;
  if(HINWEISF&&d.hinweis!==undefined&&typeof d.hinweis!=='boolean')return false;      // ein alter Eintrag ohne dieses Feld bleibt gültig (LS.v steigt nicht)
  const typ={};
  for(const t of TYPEN){const s=d.typ[t.id],n=t.level.length;
    if(s===undefined){typ[t.id]=null;continue;}
    if(!obj(s)||!ganz(s.top,0,n)||!ganz(s.streak,0,999)||!ganz(s.sl,-1,n-1)||!ja(s.halb)||!ganz(s.falsch,0,999)||!ganz(s.zuletzt,-1,1e7)||!(s.faellig===null||ganz(s.faellig,0,1e7)))return false;
    typ[t.id]={top:s.top,streak:s.streak,sl:s.sl,halb:s.halb,falsch:s.falsch,zuletzt:s.zuletzt,faellig:s.faellig};}
  neuerStand();
  TYPEN.forEach(t=>{if(typ[t.id])S.typ[t.id]=typ[t.id];});
  Object.assign(S,{etappe:d.etappe,pkt:d.pkt,pos:d.pos,letzter:TYP[d.letzter]?d.letzter:null,kronen:d.kronen,filter:{q:f.q,b:f.b,w:f.w},ton:d.ton,geuebt:d.geuebt,finale:d.finale});
  S.werk.ok=w.ok.slice();S.werk.faellig=w.faellig;S.werk.n=w.n;
  if(FALLE)fallUebernimm(d.faelle);
  if(HERAUSF&&d.heraus)herausUebernimm(d.heraus);
  if(PCF)pcUebernimm(d.pc);
  if(HINWEISF&&d.hinweis)hinweisGesehen=true;
  return true;}
/* Beim Öffnen: still laden; ein kaputter oder veralteter Eintrag wird gelöscht */
function lsLaden(){LS.sp=lsSpeicher();LS.ok=!!LS.sp;if(!LS.ok)return;
  let roh=null;try{roh=LS.sp.getItem(LS.key);}catch(e){LS.ok=false;return;}
  if(roh===null)return;
  let d=null;try{d=JSON.parse(roh);}catch(e){}

function lernZeile(fokus){const z=$('#lern');if(!z)return;if(!LS.ok){z.remove();return;}z.outerHTML=lernHTML();const b=fokus&&$('#lern [data-akt="'+fokus+'"]');if(b)b.focus();}
AKT.lmerken=()=>{LS.frage=false;

  lernZeile('lmerken');};

  const ton=S.ton;neuerStand();
