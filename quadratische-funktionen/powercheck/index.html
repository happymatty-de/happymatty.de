button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:.18rem solid #F2B705;outline-offset:.12rem}
i{font-style:italic}
sup{font-size:.62em;line-height:0;vertical-align:.58em;margin-left:.04em}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto}
#app.tr{height:100vh;height:100dvh}
.luft{flex:1}

/* ---------- Kopf ---------- */
.kopf{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;min-height:3.3rem;flex-wrap:wrap}
.kopf h1{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:2rem;margin:0;line-height:1;white-space:nowrap}
/* happymatty: Kopfzeile der Startseite, Variante A (Lehrkraft 19.11.2026), wie die Kopfleiste von happymatty.de */
.kopf .logo{flex:none;display:flex;align-items:center;gap:.5rem;color:var(--text);text-decoration:none}
.kopf .logo img{width:2.1rem;height:2.1rem;border-radius:22%;display:block}
.kopf .logo span{font-family:var(--satz);font-weight:700;font-size:1.05rem;white-space:nowrap}
.skopf{padding:0 .9rem;text-align:center}
.szeile{margin:0;padding:0 0 .35rem;border-bottom:1px solid var(--blau);font-family:var(--hand);font-size:1.1rem;color:var(--grau)}
.szeile a{color:inherit;text-decoration:none}
.szeile a:hover,.szeile a:focus-visible{text-decoration:underline}
.szeile .thema{color:var(--gruen)}
.szeile .teilthema{color:var(--lila)}
.szeile .thema,.szeile .teilthema{white-space:nowrap} /* Umbruch am Mittelpunkt, nicht im Namen */
.skopf h1{font-family:var(--hand);font-weight:400;color:var(--blau);font-size:2.4rem;line-height:1.1;margin:.6rem 0 0}
.sunter{margin:.1rem 0 .5rem;color:var(--grau);font-size:.95rem}
.sfuss{margin:0 .9rem .6rem;padding:.4rem 0 0;border-top:1px solid var(--blau);text-align:center;font-family:var(--hand);font-size:1.05rem;color:var(--grau)}
.sfuss .name{color:var(--gruen)}
.sfuss a{color:inherit;text-decoration:none;white-space:nowrap}
.sfuss a:hover,.sfuss a:focus-visible{text-decoration:underline}
@media (max-width:760px){
.sfuss{margin:0 .6rem .6rem}}

/* happymatty: Zurück-Knopf (Logo) oben links und Datenschutz in der kleinen Zeile */
.kn{background:#fff;border:1.5px solid #B9C4D0;border-radius:.55rem;padding:.25rem .75rem;font-weight:700;font-size:.95rem;min-height:2.4rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem;color:#39424C}
.kn:active,.hk:active{transform:translateY(1px)}
.kn.ton,.kn.voll{padding:.25rem .55rem}
.kn.ton svg,.kn.voll svg{width:1.3rem;height:1.3rem;display:block}
.blase{position:fixed;z-index:80;max-width:min(20rem,86vw);background:#1F2933;color:#fff;border-radius:.6rem;padding:.55rem .8rem;font-size:.98rem;line-height:1.35;box-shadow:0 .3rem 1rem rgba(0,0,0,.25);animation:rein .2s}
.pf{font-size:.7em;color:var(--grau)}
.si{display:inline-flex;flex-direction:column;gap:.16rem;width:1.15rem}
.si i{display:block;height:.2rem;border-radius:.1rem;background:var(--gruen)}
.si i:nth-child(1){width:100%}
.si i:nth-child(2){width:62%}
.si i:nth-child(3){width:34%}
.kronen{display:flex;align-items:center;gap:.2rem;min-height:1.6rem}
.kronen:empty{display:none}
.kronen .kr{display:block;width:1.9rem}
.kronen .kr.neu{visibility:hidden}
.kronen .mal{font-weight:700;color:#8A6500;margin-left:.2rem}
.krone{display:block;width:100%;height:auto}
.etappe{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}
.el{font-weight:700;white-space:nowrap;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;color:#39424C}
.el:empty{display:none}
.eb{flex:1;height:.9rem;border-radius:.45rem;background:#E1E6EC;overflow:hidden;min-width:3rem;display:block}
.eb i{display:block;height:100%;background:var(--blau);border-radius:.45rem;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Startseite ---------- */
/* Kacheln wie auf happymatty.de: oben ein Streifen in der kräftigen Farbe, darunter gleich die helle Füllung, dünne Linie,
   kein Schatten, keine Bewegung. Beim Darüberfahren und Antippen werden sie weiß.
   Der Startknopf: Fläche in Akzentblau, Streifen in Dunkelblau; beim Darüberfahren und Antippen wird die ganze Fläche dunkelblau.
   (Ein hellblauer Streifen war auf dem hellen Seitengrund nicht zu sehen, eine graue Linie um das Feld passte nicht zum Stil.) */
.startm{flex:1;display:flex;flex-direction:column;gap:.9rem;padding:.3rem .9rem .6rem;min-height:0;max-height:46rem}
.gross{flex:1.55;min-height:8.5rem;background:var(--blau);color:#fff;border:0;border-top:4px solid var(--blau-d);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8rem}
.gross b{font-size:4.2rem;line-height:1}
.gross small{font-size:1.15rem;margin-top:.75rem}
.haupt:active:not(:disabled),.opt:active:not(:disabled){transform:translateY(.14rem);box-shadow:none}
.gross.flach{flex:none;min-height:5.6rem}
.gross.flach b{font-size:2.5rem}
.gross.flach small{margin-top:.4rem;font-size:1rem}
.zwei{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.9rem;min-height:6.5rem}
.mittel{background:#E0EDF8;border:1px solid var(--rand);border-top:4px solid var(--blau);color:var(--blau);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.6rem}
.mittel b{font-size:1.8rem;line-height:1.1}
.mittel small{color:#444;font-size:1rem;margin-top:.45rem}
.mittel.gr{border-top-color:var(--gruen);color:var(--gruen);background:#E3EFDF}
.link{background:none;border:0;color:#9AA4AF;font-size:.85rem;text-decoration:underline;padding:.3rem}
/* Lernstand auf diesem Gerät merken (Lehrkraft 24.11.2026): ruhig, unter den Knöpfen, grau wie die Zeilen der Startseite; der Schalter wie im Level-Menü */
.lern{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.2rem 1.1rem;margin-top:-.3rem;color:var(--grau);font-size:.95rem}
.lsw{background:none;border:0;border-radius:.5rem;display:inline-flex;align-items:center;gap:.6rem;padding:.25rem .4rem;min-height:2.9rem;color:var(--grau);text-align:left}
.lsw .sw{display:inline-block;width:2.8rem;height:1.6rem}
.lsw .sw::after{width:1.2rem;height:1.2rem}
.lsw .sw.an::after{left:1.4rem}
.lweg{background:none;border:0;padding:.25rem .4rem;min-height:2.9rem;color:var(--blau);text-decoration:none}
.lweg:hover,.lweg:focus-visible{text-decoration:underline}
.lern.frage{gap:.4rem .9rem}
.lfr{text-align:center}
.lkn{display:inline-flex;gap:.6rem}
.lkn .kn{min-height:2.9rem;padding:.25rem 1rem}
.lkn .lja{color:var(--rot);border-color:var(--rot)}

/* ---------- Zwischenstand, Einzeltraining, Erklärungen ---------- */
.seite{flex:1;display:flex;flex-direction:column;gap:.7rem;padding:.3rem .9rem 1rem}
.zs{display:flex;align-items:baseline;gap:.7rem;margin:.15rem .1rem 0;flex-wrap:wrap}
.zs b{font-size:1.2rem}
.zs span{color:var(--grau);font-size:.92rem}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ka{background:#E0EDF8;border:1px solid var(--rand);border-top:4px solid var(--blau);border-radius:6px;padding:.6rem .85rem .75rem;display:flex;flex-direction:column;gap:.55rem;text-align:left;min-height:4.4rem;justify-content:space-between;min-width:0}
.ka b{color:var(--blau);font-size:1.12rem;line-height:1.15}
.kz{display:flex;align-items:center;gap:.6rem}
.bd{flex:1;height:.8rem;border-radius:.4rem;background:#E4E8ED;overflow:hidden;display:block;min-width:2rem}
.ka .bd{background:#fff;box-shadow:inset 0 0 0 1px #C9D6E2}
.bd i{display:block;height:100%;border-radius:.4rem;background:var(--gruen);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ms{width:6.5rem;flex:none;display:flex}
.mk{font-size:.8rem;font-weight:700;border-radius:.25rem;padding:.06rem .45rem .12rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem;line-height:1.25}
.mk.ok{color:var(--gruen);background:#E3EFDF}
.mk.voll{color:#fff;background:var(--lila)}
.mk.voll svg{width:.95em;height:.7em;display:block}
.mk.dg{color:#fff;background:var(--dgrau)}
.mk.bald{color:#8A94A0;background:#EEF1F4}
.ka.aus,.eka.aus{background:#F7F7F7;border:1px dashed #BFBFBF;border-top:4px solid #BFBFBF}      /* noch nicht da: grau wie die gesperrte Karte der Webseite */
.ka.aus b,.eka.aus b{color:#9A9A9A}
.ekacheln{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.eka{background:#E3EFDF;border:1px solid var(--rand);border-top:4px solid var(--gruen);border-radius:6px;padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.3rem;text-align:left;min-height:8rem;align-items:flex-start}
.eka .nr{color:var(--grau);font-size:.95rem}
.eka b{color:var(--gruen);font-size:1.3rem;line-height:1.15}
.eka b.gr{font-size:1.7rem}
.eka .mk{margin-top:auto}

/* ---------- Aufgabe ---------- */
.buehne{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:.8rem;padding:.15rem .9rem .6rem;overflow:auto;align-content:start}
.buehne.eins{grid-template-columns:minmax(0,1fr)}
.karte{background:#fff;border:1.5px solid var(--rand);border-radius:.9rem;padding:.65rem 1rem .9rem;min-width:0;display:flex;flex-direction:column;gap:.5rem}
.eins .karte{max-width:54rem;width:100%;margin:0 auto}
.was{margin:0;color:var(--grau);font-size:.85rem}
.was b{color:var(--dgrau)}
.was .wasl{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;font-weight:700;color:var(--blau)}
.was .wasl:hover{text-decoration:underline}
.was .wasl:active{color:var(--blau-d);text-decoration:underline}
/* der Ort vor dem Aufgabentyp („Gesamttraining“, „Einzeltraining“): antippbar wie der Aufgabentyp, aber nicht fett */
.was .wasol{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;color:var(--blau)}
.was .wasol:hover{text-decoration:underline}
.was .wasol:active{color:var(--blau-d);text-decoration:underline}
/* Aufgabenkopf: links Aufgabentyp und Level, rechts der Weg zur letzten Aufgabe */
.was{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.was .wasr{background:none;border:0;border-radius:.3rem;padding:.4rem .3rem;margin:-.4rem -.3rem;color:var(--blau);white-space:nowrap;flex:none}
.was .wasr:hover{text-decoration:underline}
.was .wasr:active{color:var(--blau-d);text-decoration:underline}
.was .wasm{flex:none;font-size:.8rem;font-weight:700;color:#fff;background:var(--dgrau);border-radius:.25rem;padding:.06rem .45rem .12rem;white-space:nowrap;line-height:1.25}
/* Rückblick: das Bild der letzten Aufgabe ist eingefroren; nur der Aufgabentyp bleibt antippbar */
.buehne.rueckblick>*{pointer-events:none}
.buehne.rueckblick .wasl,.buehne.rueckblick .wasol{pointer-events:auto}
/* Fenster vor dem Wechsel ins Einzeltraining eines Aufgabentyps */
.efrage{width:min(94vw,27rem)}
.efrage .reihe{grid-template-columns:minmax(0,1fr) minmax(4rem,9rem) auto}
.efrage .eknoepfe{display:flex;justify-content:flex-end;align-items:center;gap:.6rem;margin-top:.2rem}
.efrage .eknoepfe .kn{min-height:3rem;padding:.3rem 1rem}
.efrage .ehier{margin:0}
/* der Aufgabentyp ist in diesem Fenster nicht antippbar, also nicht blau */
.efrage .reihe b{color:var(--text)}

/* Nach einer falschen Antwort steht der Denkanstoß als Regel unter dem Fehler */
.rueck small.regel{color:#3D4853;font-size:.92rem;margin-top:.25rem}
.frage{margin:0;font-size:1.2rem}
.term{margin:.1rem 0;font-size:1.7rem;line-height:1.25}
.term .pp{margin-left:1.4rem;white-space:nowrap;display:inline-block}
.term>span{white-space:nowrap;display:inline-block}
.nk{display:none}
.inhalt{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.mitbild .inhalt{display:grid;grid-template-columns:minmax(0,21rem) minmax(0,1fr);gap:1.3rem;align-items:center}
.rechts{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.opts{display:grid;gap:.6rem;margin-top:.25rem}
.opts.n2,.opts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{background:#fff;border:.14rem solid var(--blau);border-radius:.8rem;min-height:3.7rem;font-size:1.4rem;padding:.4rem 2.2rem;box-shadow:0 .2rem 0 #C9D6E2;position:relative;color:var(--text);min-width:0;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.opt:disabled{box-shadow:none;cursor:default;border-color:#C9D0D8;color:#6B7580}
.opts.ofest .opt{white-space:nowrap}      /* Antworten, die Terme sind (auf.optFest): Ein Term bricht nicht um (26.11.2026) */
.opt.gew{background:#EAF3F9;box-shadow:0 0 0 .2rem #CFE3F1}
.opt.fehlt{border:.14rem dashed var(--gruen);color:var(--text);background:#fff}      /* die richtige, nicht gewählte Antwort: weiß, grün gestrichelt, ohne Zeichen (Lehrkraft 23.11.2026); Strich so dick wie der Rahmen des Urteils (.14rem), wächst mit (Lehrkraft 24.11.2026) */
.opt.ok{border-color:var(--gruen);background:#EAF4E6;color:var(--text)}
.opt.falsch{border-color:var(--rot);background:#F8E9E8;color:var(--text)}
.opt.ok::after,.opt.falsch::after{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.3rem}
.opt.ok::after{content:'✓';color:var(--gruen)}
.opt.falsch::after{content:'✗';color:var(--rot)}
.denk{background:#F4EFF7;border-left:.25rem solid var(--lila);padding:.4rem .7rem;border-radius:.4rem;font-size:1.02rem}
.rueck{border-radius:.6rem;padding:.45rem .8rem;display:flex;gap:.6rem;align-items:flex-start;font-size:1.04rem;animation:rein .25s}
.rueck .z{font-weight:700;font-size:1.15rem;line-height:1.15}
.rueck.gut{background:#EAF4E6;border:1.5px solid #9CC98F}
.rueck.gut .z{color:var(--gruen)}
.rueck.schlecht{background:#F8E9E8;border:1.5px solid #D9A6A3}
.rueck.schlecht .z{color:var(--rot)}
.rueck.neutral{background:#EEF1F4;border:1.5px solid #C9D0D8}
.rueck small{display:block;color:var(--grau);font-size:.88rem;margin-top:.15rem}
@keyframes rein{from{opacity:0;transform:translateY(.35rem)}to{opacity:1;transform:none}}
@keyframes zittern{0%,100%{transform:translateX(0)}20%{transform:translateX(-.4rem)}40%{transform:translateX(.35rem)}60%{transform:translateX(-.25rem)}80%{transform:translateX(.15rem)}}
.zittert{animation:zittern .4s}

/* Rechnung */
.rechnung h3{font-family:var(--hand);font-weight:400;color:var(--grau);font-size:1.25rem;margin:0;line-height:1.1}
.zeilen{font-family:var(--hand);color:var(--orange);font-size:1.6rem;line-height:1.5;display:flex;flex-direction:column}
.zeilen i{font-style:normal}
.zl{display:flex;justify-content:space-between;gap:1rem;animation:rein .35s}
.zl .op{color:var(--grau);white-space:nowrap}
.zl.text{font-size:1.3rem;line-height:1.35;margin-bottom:.25rem}
.leer{color:#9AA4AF;font-size:.95rem;margin:0}
.soll{position:relative;display:inline-block;padding:0 .12em}
.soll::before{content:'!';position:absolute;left:50%;transform:translateX(-50%);top:-.68em;font-size:.6em}

/* Eingabe */
.ein{font-size:1.7rem;display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .6rem;margin:.15rem 0}
.pkt{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}
.feld{display:inline-flex;align-items:center;justify-content:center;min-width:3.3rem;height:2.7rem;border:.14rem dashed #9FB3C6;border-radius:.5rem;padding:0 .45rem;background:#FAFCFE;cursor:pointer}
.feld.aktiv{border-style:solid;border-color:var(--blau);background:#EAF3F9;box-shadow:0 0 0 .18rem #CFE3F1}
.feld.aktiv::after{content:'';width:.09rem;height:1.5rem;background:var(--blau);margin-left:.08rem;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.umsch{display:inline-flex;border:.12rem solid var(--blau);border-radius:.6rem;overflow:hidden;font-size:1.05rem}
.umsch button{border:0;background:#fff;padding:.5rem .85rem;font-weight:700;color:var(--blau);min-height:2.6rem}
.umsch button.an{background:var(--blau);color:#fff}
.tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;max-width:19rem;width:100%}
.tasten button{height:2.9rem;border-radius:.6rem;border:1.5px solid #B9C4D0;background:#fff;font-size:1.4rem;box-shadow:0 .14rem 0 #C9D0D8;color:var(--text)}
.tasten button:active{transform:translateY(.1rem);box-shadow:none;background:#EAF3F9}
.tasten .breit{grid-column:span 2}
.tasten .fn{background:#EEF1F4;font-size:1.2rem}
/* nach dem Prüfen und nach „Lösung“ ist das Ziffernfeld weg: Es wird nicht mehr gebraucht, und die Rechnung hat mehr Platz (Lehrkraft 22.11.2026) */
.gesperrt .tasten{display:none}
.gesperrt .umsch{opacity:.45;pointer-events:none}

/* Wischkarte (Lehrkraft 22.11.2026): Die Karte bekommt kein Urteil. Term und was zu prüfen ist stehen nebeneinander, mittig, mit viel Luft;
   schmal rutscht das Zweite darunter. Nach der Antwort ist nur die gewählte Seite gefärbt, ganz grün oder ganz rot, das Zeichen an der Ecke.
   Die Karte wie die Karte zum Schieben bei Drei Stapel (M1, Lehrkraft 23.11.2026): hellblau wie das Situationsband der Blätter, Rand 1 px #89B1CB, ohne Streifen. */
.wischfeld{padding:.9rem 1.2rem 1.2rem;display:flex;justify-content:center;overflow:hidden}
.wk{position:relative;width:min(100%,31rem);background:#EDF4FA;border:1px solid #89B1CB;border-radius:.8rem;padding:1.9rem 1.6rem;box-shadow:0 .3rem 1rem rgba(31,41,51,.12);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6rem 3.2rem}
.wk .term{font-size:1.9rem;margin:0;line-height:1.2;white-space:nowrap}
.wknoepfe{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wknoepfe .opt{padding:.4rem .8rem;font-size:1.25rem}
.pfl{font-weight:700}
.wknoepfe .opt.ziel{background:#EAF3F9;box-shadow:0 0 0 .2rem #CFE3F1}
/* Urteil an der rechten oberen Ecke der gewählten Antwort, wie bei der Wischkarte, auch bei Wahl, Mehrere stimmen, Umformung wählen (.opts.eck) und Drei Stapel
   (Lehrkraft 23.11.2026). Ohne .eck (Anwendung) bleibt das Zeichen wie bisher am rechten Rand. */
.wknoepfe .opt.ok::after,.wknoepfe .opt.falsch::after,.opts.eck .opt.ok::after,.opts.eck .opt.falsch::after{content:none}
.wknoepfe .opt.ok::before,.wknoepfe .opt.falsch::before,.opts.eck .opt.ok::before,.opts.eck .opt.falsch::before,.stapel .stp.ok::before,.stapel .stp.falsch::before{position:absolute;top:-.6rem;right:-.5rem;z-index:1;width:1.35rem;height:1.35rem;border-radius:50%;border:.12rem solid #fff;box-sizing:content-box;color:#fff;font-family:var(--satz);font-size:.9rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.wknoepfe .opt.ok::before,.opts.eck .opt.ok::before,.stapel .stp.ok::before{content:'✓';background:var(--gruen)}
.wknoepfe .opt.falsch::before,.opts.eck .opt.falsch::before,.stapel .stp.falsch::before{content:'✗';background:var(--rot)}

/* Satz mit Lücken, Notiz, falsche Felder */
.ein>span{white-space:nowrap}
.ein.satz{font-size:1.2rem;flex-direction:column;align-items:flex-start;gap:.45rem}
.ein.satz .sz{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;white-space:normal}
.ein.satz .feld{min-width:3rem;height:2.5rem;font-size:1.4rem}
.ein.satz .umsch{font-size:1rem}
.ein.satz .umsch button{padding:.35rem .7rem;min-height:2.5rem}
.feld.falsch,.umsch.falsch{border-color:var(--rot);box-shadow:0 0 0 .16rem #F3D6D4}
.notiz{margin:-.15rem 0 .1rem;color:var(--grau);font-size:.9rem}

/* Teilprodukte */
.plaetze{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.2rem}
.platz{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:0}
.pl-l{font-size:.95rem;color:var(--grau);white-space:nowrap;min-height:1.3em}

.regler output.ok,.regler output.falsch{position:relative;border-width:.13rem;border-style:solid}
.regler output.ok{border-color:var(--gruen);background:#EAF4E6}

.regler output.ok::before,.regler output.falsch::before{position:absolute;top:-.55rem;right:-.5rem;z-index:1;width:1.1rem;height:1.1rem;border-radius:50%;border:.1rem solid #fff;box-sizing:content-box;
  color:#fff;font-family:var(--satz);font-size:.76rem;font-weight:700;font-style:normal;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none}

/* Hinweis beim ersten Start (Baustein hinweis, 26.11.2026): ein graues, diffuses Feld in der Mitte, das zu den Rändern hin verschwimmt; die erste Aufgabe
   bleibt dahinter zu sehen. Die Schrift ist dasselbe Grau in satt und wirkt eingestanzt (hell abgesetzte Unterkante). Lesbarkeit geht vor Effekt.
   Das Feld ist so groß, dass der ganze Text im dichten Grau liegt (Lehrkraft 26.11.2026). */
.hwov{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:hwein .45s ease-out}
.hwov.geht{opacity:0;transition:opacity .35s ease-in}
.hwfeld{width:min(54rem,100vw);padding:7rem 8rem;box-sizing:border-box;text-align:center;
  background:radial-gradient(closest-side,rgba(196,202,209,.9) 0%,rgba(204,209,215,.86) 52%,rgba(214,218,223,.6) 74%,rgba(225,228,232,0) 100%);
  -webkit-backdrop-filter:blur(4px) saturate(.35);backdrop-filter:blur(4px) saturate(.35);
  -webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%)}
.hwtext p{margin:.15rem 0;font-family:var(--hand);font-size:2rem;line-height:1.25;color:#2F3740;text-shadow:0 1px 0 rgba(255,255,255,.75),0 -1px 0 rgba(0,0,0,.08)}
.hwtext p+p{font-size:1.7rem}
.hwzeichen{position:fixed;width:2.5rem;height:2.9rem;pointer-events:none;animation:hwzeig 1.6s ease-in-out .5s infinite}
.hwzeichen svg{width:100%;height:100%;stroke:#2F3740;filter:drop-shadow(0 0 6px rgba(225,228,232,.95)) drop-shadow(0 0 2px rgba(255,255,255,.9))}
.hwziel{box-shadow:0 0 0 .3rem rgba(196,202,209,.75),0 0 1.4rem .4rem rgba(196,202,209,.8)!important;position:relative;z-index:81}
@keyframes hwein{from{opacity:0}to{opacity:1}}
@keyframes hwzeig{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35rem)}}
@media (max-width:760px){
.hwfeld{padding:6rem 3.4rem}
.hwtext p{font-size:1.6rem}
.hwtext p+p{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){.hwov,.hwzeichen{animation:none}}

/* Eigenes CSS des Trainings; das Bauskript setzt es in das gemeinsame CSS des Trainingsrahmens ein (trainingsrahmen/src/rahmen.css, Zeile „/*@@ EIGEN“). */

/* Zuordnen */
.zuo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:.6rem 1.4rem;margin-top:.2rem}
.zsp{display:flex;flex-direction:column;gap:.5rem}

.zk.zu:disabled:not(.voll){opacity:.45;box-shadow:none}
.znr{font-weight:700;color:var(--gruen);min-width:1.1rem;text-align:right}
.zuo~.zeilen .zl.text{font-size:1.15rem;line-height:1.3;margin-bottom:.1rem}
.nsw{display:inline-flex;gap:2.4em}

/* Hühnergehege: Der Tipp bleibt hier grau (Lehrkraft 24.11.2026). In den übrigen Anwendungen ist er seit 24.11.2026 Akzentlila; im Graphen
   der Fläche ist aber schon die Mitte (.mlin) lila gestrichelt und senkrecht wie die Linie des Tipps, bei einem guten Tipp lägen beide
   aufeinander. */
.gpkt.tipp{fill:#9AA4AF}
.gbs.tipp{fill:#6E6E6E}
.tipplin{stroke:#9AA4AF}
/* Tafel-Runde „Das Hühnergehege“: der Regler im Bild, groß genug für die Tafel und für den Finger (Lehrkraft 24.11.2026) */
.tfregler{margin:.5rem .2rem .2rem}
.tfregler .sl{font-size:1.6rem}
.tfregler output{font-size:1.6rem;min-width:5.5rem}
.tfregler input[type=range]{height:3.2rem}
.tfregler input[type=range]::-webkit-slider-thumb{width:2.8rem;height:2.8rem;margin-top:-1.15rem}
.tfregler input[type=range]::-moz-range-thumb{width:2.5rem;height:2.5rem}
.tfregler input[type=range]:disabled{opacity:.6}
.tfregler .tffl{margin:.1rem 0 0;font-size:1.5rem;text-align:right;color:var(--gruen)}
.tfregler .tffl b{font-family:var(--satz);font-weight:400}
.ghsvg{overflow:visible}      /* Beschriftungen am Rand bei den Extremfällen (x = 0, andere Seite 0) nicht abschneiden */
/* Eigenes CSS des Trainings; das Bauskript setzt es in das gemeinsame CSS des Trainingsrahmens ein (trainingsrahmen/src/rahmen.css, Zeile „/*@@ EIGEN“). */
/* Eigenes CSS des QF4-Trainings; das Bauskript setzt es in das gemeinsame CSS des Trainingsrahmens ein (trainingsrahmen/src/rahmen.css, Zeile „/*@@ EIGEN“).
   Das Übrige hat QF4 mit QF3 gemeinsam (Abschnitte mit dem Kürzel QF4 in rahmen.css); die neuen Formen „Skizze bauen“ und „Aussagen im Block“ stehen dort
   in eigenen Abschnitten. */

/* Nullstellen und gemeinsame Punkte lila und pink: Sie heben sich vom blauen und vom grünen Graphen ab (Skill interaktiv, Seitengestaltung, Parameterfarben) */
:root{--cx1:#85609E;--cx2:#CE65A2}

/* Term zum Eintippen: f(x) = ☐ · (x ± ☐) · (x ± ☐) und f(x) = ☐x² + ☐x + ☐. Das Vorzeichen in der Klammer ist ein Umschalter; die Teile brechen zwischen den Klammern um */
.ein.nsf{font-size:1.6rem;gap:.5rem .45rem}
.ein.nsf>span{display:inline-flex;align-items:center;gap:.28rem;white-space:nowrap}
.ein.nsf .feld{min-width:2.9rem;height:2.6rem}
.umsch.vz button{padding:0 .62rem;min-height:2.45rem;font-size:1.5rem;line-height:1}
/* die Angabe über dem Term („Nullstellen −4 und 1, der Graph geht durch P(−2 | 12).“): ein Satz, kleiner als ein Term */
.term>span.q4angabe{font-size:1.2rem;line-height:1.35;white-space:normal;display:inline}
/* Umschalter mit drei Wörtern (Sekante, Tangente, kein gemeinsamer Punkt) */
.ein.satz .umsch.q4drei button{padding:.35rem .6rem}
@media (max-width:760px){
.ein.nsf{font-size:1.4rem}
.ein.nsf .feld{min-width:2.5rem;height:2.5rem}
.umsch.vz button{padding:0 .5rem}
.ein.satz .umsch.q4drei{font-size:.86rem}
.ein.satz .umsch.q4drei button{padding:.3rem .42rem}}

/* Bilder: Parabel blau und Gerade grün; die eigene Parabel nach „Prüfen“ gelb und halb durchsichtig über der grünen Lösung (wie die Zielparabel in QF1),
   ihre Nullstellen grün oder rot, eine fehlende grün gestrichelt (wie bei „Nullstellen antippen“) */
.gk.q4par{stroke:var(--blau)}
.gk.q4ger{stroke:var(--gruen)}
.gk.q4eigen{stroke:var(--cc);stroke-width:5;opacity:.72}
.glg.q4gelb{color:var(--cc)}
.gpkt.q4ok,.gbs.q4ok{fill:var(--gruen)}
.gpkt.q4no,.gbs.q4no{fill:var(--rot)}
.gpkt.q4fehlt{fill:#fff;stroke:var(--gruen);stroke-width:3;stroke-dasharray:4 3}
.gbs.q4fehlt{fill:var(--gruen)}
.gpkt.q4p{fill:#39424C}
.gbs.q4p{fill:#39424C}
/* das Bild, das nach „Prüfen“ oben in die Karte der Lösung kommt */
.bild.q4nach{width:100%;max-width:19rem;margin:0 auto;animation:rein .35s}
/* Bild auf der Karte beim Stapel */
.q4stb{display:block;max-width:13.5rem;margin:0 auto}
.stk .term:has(.q4stb){margin:0}
/* ein Punkt wie P(−2 | 12) bricht nicht um */
.q4nw{white-space:nowrap}
/* die Wurzel in einem Term der Aufgabe: .term>span setzt sonst inline-block, und das Wurzelzeichen hätte keine Höhe */
.term>span.wurzel{display:inline-flex}

/* ---------- Erklärungen ---------- */
/* Farben in den Erklärungen: a blau, die Nullstellen lila und pink, die Gerade grün */
.q4a{color:var(--ca);font-weight:700}
.q4x1{color:var(--cx1);font-weight:700}
.q4x2{color:var(--cx2);font-weight:700}
.q4g{color:var(--gruen);font-weight:700}

/* Begriffskarten: oben die Wortleiste (statt der Punktreihe), darunter Bild und Satz */
.exm.bgr{grid-template-rows:auto 1fr;align-items:center}
.bgw{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.35rem;align-self:start}
.bgw button{border:.1rem solid #9CC98F;background:#fff;color:var(--gruen);border-radius:.55rem;font-size:.95rem;font-weight:700;padding:.3rem .65rem;min-height:2.3rem;line-height:1.1}
.bgw button.an{background:var(--gruen);border-color:var(--gruen);color:#fff}
.bgb{display:flex;justify-content:center;align-items:center}

.bgzwei{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;width:100%}

.q4begriffe .ex-text{font-size:1.3rem;min-height:0}

/* Eigenes CSS des QF5-Trainings; das Bauskript setzt es in das gemeinsame CSS des Trainingsrahmens ein (trainingsrahmen/src/rahmen.css, Zeile „/*@@ EIGEN“).
   Die Fälle (Baustein faelle) und die neuen Formen „Ansatz bauen“ (bauen) und „Weg bauen“ (weg) stehen dort in eigenen Abschnitten. */

/* Das Kernbild: die Stelle lila (senkrechte Linie), die Höhe pink (waagerechte Linie); Modell grün, Messpunkte blau, Lösungen orange */
:root{--q5s:#85609E;--q5h:#CE65A2}
.q5ts{color:var(--q5s);font-weight:700}
.q5th{color:var(--q5h);font-weight:700}
.q5nw{white-space:nowrap}

.q5lage{display:block;font-size:.95rem;line-height:1.3;color:#39424C;background:#F3F7FA;border-left:.22rem solid var(--blau);border-radius:.3rem;padding:.3rem .6rem;margin:0 0 .45rem}
.q5lage b{color:var(--blau)}

.q5lin.q5ho{stroke:var(--q5h)}

.gpkt.q5lsg.q5hohl{fill:#fff;stroke:var(--orange);stroke-width:2.5}
.gbs.q5hohl{opacity:.75}
.q5lauf{fill:var(--gruen);stroke:#fff;stroke-width:2.5}
.q5tipp{fill:var(--lila)}
.gbs.q5tippt{fill:var(--lila);font-size:12px}
.bild.bnach{max-width:19rem}
.karte .bild>svg.q5g{max-width:25rem;margin:0 auto}

.q5pfs{fill:var(--blau)}
.q5verein{fill:#fff;stroke:#39424C;stroke-width:1.8}
.q5vt{font-family:var(--hand);font-size:18px;fill:#39424C}

.kette .kzeil .q5mat,.kette .kzeil .q5gls{margin-top:.15em;margin-bottom:.15em}

/* ---------- Urteil an jeder Eingabe nach „Prüfen“ (Lehrkraft 22.11.2026) ----------
   Grün mit ✓ oder rot mit ✗ an der Ecke, Rand durchgezogen, helle Füllung: Das Zeichen trägt die Aussage mit, nicht nur die Farbe.
   Blau heißt nur noch: Hier tippe ich. */
.feld,.umsch,.keine{position:relative}
.feld.ok,.feld.falsch{border-style:solid}
.feld.ok{border-color:var(--gruen);background:#EAF4E6;box-shadow:0 0 0 .16rem #D3E8CC}
.feld.falsch{border-color:var(--rot);background:#F8E9E8;box-shadow:0 0 0 .16rem #F3D6D4}
.feld.ok.aktiv::after{display:none}
.feld.falsch.aktiv::after{background:var(--rot)}
.umsch.ok{border-color:var(--gruen);box-shadow:0 0 0 .16rem #D3E8CC}
.umsch.ok,.umsch.falsch{overflow:visible}
.umsch:not(.wegw).ok button:first-child,.umsch:not(.wegw).falsch button:first-child{border-radius:.46rem 0 0 .46rem}
.umsch:not(.wegw).ok button:last-child,.umsch:not(.wegw).falsch button:last-child{border-radius:0 .46rem .46rem 0}
.umsch.wegw.ok{box-shadow:none}
.umsch.wegw.ok button.an{border-color:var(--gruen);box-shadow:0 0 0 .16rem #D3E8CC}
.umsch.wegw.falsch button{border-color:var(--blau)}
.umsch.wegw.falsch button.an{border-color:var(--rot);box-shadow:0 0 0 .16rem #F3D6D4}
.umsch.wegw button{position:relative}
.gesperrt .umsch.ok,.gesperrt .umsch.falsch{opacity:1}
.keine.ok,.keine.an.ok{border-color:var(--gruen);background:#EAF4E6;color:var(--text)}
.keine.an.falsch{border-color:var(--rot);background:#F8E9E8;color:var(--text)}
.keine.fehlt{border:.13rem dashed var(--gruen);background:#fff;color:var(--text)}      /* „keine Lösung“ wäre richtig gewesen: wie die nicht gewählte richtige Antwort der Wahl (Lehrkraft 23.11.2026), so dick wie der Rand des Urteils (.13rem), wächst mit (Lehrkraft 24.11.2026) */
.feld.ok::before,.feld.falsch::before,.umsch.wegw.ok button.an::before,.umsch.wegw.falsch button.an::before,.keine.ok::before,.keine.falsch::before{
  position:absolute;top:-.55rem;right:-.5rem;z-index:1;width:1.1rem;height:1.1rem;border-radius:50%;border:.1rem solid #fff;box-sizing:content-box;
  color:#fff;font-family:var(--satz);font-size:.76rem;font-weight:700;font-style:normal;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.feld.ok::before,.umsch.wegw.ok button.an::before,.keine.ok::before{content:'✓';background:var(--gruen)}
.feld.falsch::before,.umsch.wegw.falsch button.an::before,.keine.falsch::before{content:'✗';background:var(--rot)}

/* Punkte setzen: nach „Prüfen“ die eigenen Punkte grün oder rot, fehlende Punkte der Lösung grün gestrichelt, in der Liste ebenso (Lehrkraft 23.11.2026; vorher verblasste das Falsche) */
.sp.ok{fill:var(--gruen)}
.sp.fehlt{fill:#fff;stroke:var(--gruen);stroke-width:3;stroke-dasharray:4 3}      /* fehlender Punkt der Lösung, wie bei Nullstellen antippen (Lehrkraft 23.11.2026) */
/* Liste „Deine Punkte“: Rand des Urteils und gestrichelter Rand gleich dick, .14rem wie bei der Wahl, wachsen mit (Lehrkraft 24.11.2026; vorher 1,5 px und 2 px);
   der Innenabstand gleicht den dickeren Rand aus, damit die Liste nicht springt */
.pko.ok,.pko.falsch,.pko.fehlt{border-width:.14rem;padding:calc(.1rem + 1.5px - .14rem) calc(.5rem + 1.5px - .14rem)}
.pko.ok{border-color:var(--gruen);background:#EAF4E6;color:var(--text)}
.pko.falsch{border-color:var(--rot);background:#F8E9E8;color:var(--text)}
.pko.fehlt{border-style:dashed;border-color:var(--gruen);background:#fff;color:var(--text)}

/* ---------- Gleichung am Graphen (Lehrkraft 22.11.2026) ----------
   Steht die Lösung da, steht die Gleichung im Bild neben ihrem Graphen, in seiner Farbe; der bloße Name am Graphen entfällt dann */
.bild.mitgl{position:relative}
.glg{position:absolute;left:0;top:0;font-size:1.05rem;line-height:1.05;white-space:nowrap;pointer-events:none;padding:.1em .32em;border-radius:.35em;background:rgba(255,255,255,.88);color:var(--blau);animation:glkommt .4s ease-out backwards}
.glg *{color:inherit!important}
.glg.lg,.glg.ls{color:var(--gruen)}
.glg.lr{color:var(--rot)}
.glg.lb{color:var(--blau)}
.glg.ll{color:var(--lila)}
.glg.glspaet{animation-delay:1.5s}
.glg.lgr{color:var(--grau)}
.tafelr .glg{font-size:1.2rem}
@keyframes glkommt{from{opacity:0}}
@media (max-width:760px){
.glg{font-size:.9rem}}
.achsbild .glg{font-size:.92rem}
.gk.eigen.blass{opacity:.28}

/* ---------- 22.11.2026, zweite Runde (Lehrkraft) ---------- */
/* Urteil am Umschalter: Das Zeichen sitzt an der gewählten Seite, nicht an der Ecke der Gruppe („direkt dort dran …, was blau unterlegt ist“), und zwar an ihrer rechten oberen Ecke, knapp innerhalb, damit es nicht auf der Grenze zur Nachbarseite liegt (Lehrkraft 22.11.2026, dritte Runde: „Was mir daran nicht gefällt, ist, dass das in der Mitte sitzt“). Der Rand der Gruppe bleibt. */
.umsch button{position:relative}
.umsch:not(.wegw).ok button.an::before,.umsch:not(.wegw).falsch button.an::before{
  position:absolute;top:-.62rem;right:.15rem;left:auto;z-index:1;width:1.1rem;height:1.1rem;border-radius:50%;border:.1rem solid #fff;box-sizing:content-box;
  color:#fff;font-family:var(--satz);font-size:.76rem;font-weight:700;font-style:normal;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.umsch:not(.wegw).ok button.an::before{content:'✓';background:var(--gruen)}
.umsch:not(.wegw).falsch button.an::before{content:'✗';background:var(--rot)}
/* Leere Lösungskarte: keine Ankündigung, was später wo erscheint. Die Überschrift (Lösung, Rechnung, So geht’s) kommt mit dem Inhalt. */
.leer:empty{display:none}
.rechnung:not(:has(.zeilen>*,.ezeilen>*,.vor>*)) h3.lt{display:none}
/* Level-Menü: Level, die es im Aufgabentyp nicht gibt */
.mz.fehlt b{color:#B7BEC7}
.sw:disabled{background:#E9ECF0;cursor:default}
.sw:disabled::after{background:#F8F9FA;box-shadow:0 0 0 1px #DCE1E6}
/* Lösung beim Zuordnen: Nummer des Paars in Grün, die Gleichung schwarz wie auf der Karte, dahinter in Handschrift, was man an ihr abliest */
.zl.zul>span{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .9rem}
.zl.zul .lgl{font-family:var(--satz);color:var(--text);font-size:1.2rem;min-width:11rem}
.zl.zul .lgl i{font-style:italic}
.zl.zul .lre{flex:1 1 12rem;min-width:0}
.zl.zul,.zdock~.zeilen .zl.zul.text{font-size:1.4rem;line-height:1.3;margin:.12rem 0}

/* m = … und b = … bleiben am Zeilenende zusammen */
.zeilen .cm,.zeilen .cb{white-space:nowrap}
/* Handschrift kennt kein Fett: Künstlich gefettet wirkt dasselbe Orange dunkler */
.zeilen .cm,.zeilen .cb,.ezeilen .cm,.ezeilen .cb,.kzeil .cm,.kzeil .cb,.wnot .cm,.wnot .cb{font-weight:400}

/* Zuordnen mit Andocken (Lehrkraft 22.11.2026): oben jede Gleichung mit ihrem Platz, darunter der Vorrat der Aussagen.
   Eine angedockte Aussage bildet mit ihrer Gleichung eine Karte. Blau: gelegt, noch ohne Urteil. Nach „Prüfen“ grün mit ✓ oder rot mit ✗.
   --zf ist die Farbe des Paars, --zn die der Naht zwischen Gleichung und Aussage, --zg der Grund. */
.zdock{display:flex;flex-direction:column;gap:.9rem;margin-top:.2rem}
.zreihen{display:flex;flex-direction:column;gap:.5rem}
.zreihe{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:.5rem;position:relative;--zf:var(--blau);--zn:#8DB9D9;--zg:#F1F7FB}
.zreihe.ok{--zf:var(--gruen);--zn:#9CC98F;--zg:#EAF4E6}
.zreihe.gegeben{--zf:#9CC98F;--zn:#BBDAB2;--zg:#F3F9F1}
.zreihe.falsch{--zf:var(--rot);--zn:#DDA9A6;--zg:#F8E9E8}
.zplatz{box-sizing:border-box;min-height:3rem;display:flex;border:.13rem dashed #C4CDD6;border-radius:.7rem;cursor:pointer}
.zreihe.gew .zplatz{border-color:var(--blau);background:#F4F9FC}
.zreihe.voll .zplatz{border:0;background:none}
.zvorrat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.zheim{display:flex;min-height:3rem}
.zk.zu{text-align:left;min-height:3rem;width:100%}
.zk.zu.r{font-size:1.1rem;border-color:#8DB9D9}
.zk.zu.r.gew,.zreihe.gew .zu.l{background:#EAF3F9;box-shadow:0 0 0 .18rem #CFE3F1;border-color:var(--blau)}
.zreihe.voll{gap:0}
.zreihe.voll .zu{background:var(--zg);border-color:var(--zf)}
.zreihe.voll .zu.l{border-radius:.7rem 0 0 .7rem;border-right:.13rem dashed var(--zn)}
.zreihe.voll .zu.r{border-radius:0 .7rem .7rem 0;border-left:0}
.zreihe.voll.gew .zu.l{background:#EAF3F9}
.zreihe.ok .zu,.zreihe.gegeben .zu,.zreihe.falsch .zu{box-shadow:none}
.zflug{position:relative;z-index:5}
.zreihe.ok::after,.zreihe.falsch::after{position:absolute;top:-.5rem;right:-.5rem;z-index:1;width:1.25rem;height:1.25rem;border-radius:50%;border:.1rem solid #fff;box-sizing:content-box;
  color:#fff;font-family:var(--satz);font-size:.86rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.zreihe.ok::after{content:'✓';background:var(--gruen)}
.zreihe.falsch::after{content:'✗';background:var(--rot)}
.zk.zu:disabled{color:var(--text);transform:none;cursor:default}
.zdock~.zeilen .zl.text{font-size:1.15rem;line-height:1.3;margin-bottom:.1rem}

@media (max-width:760px){
.zreihe{grid-template-columns:minmax(0,1fr)}
.zplatz,.zheim{min-height:2.5rem}
.zvorrat{grid-template-columns:minmax(0,1fr)}}


@media (max-width:760px){
.zk.zu{font-size:1.2rem}}


@media (max-width:760px){
.zk.zu.r{font-size:1.05rem;min-height:2.5rem}
.zreihe.voll .zu.l{border-radius:.7rem .7rem 0 0;border-right:.13rem solid var(--zf);border-bottom:.13rem dashed var(--zn);box-shadow:none}
.zreihe.voll .zu.r{border-radius:0 0 .7rem .7rem;border-left:.13rem solid var(--zf);border-top:0}}
.zdock.fertig .zheim:empty{display:none}
.zreihe.voll .zu:hover,.zreihe.voll .zu:active{transform:none}
@media (hover:hover){
.zreihe.voll .zu:hover{background:var(--zg);box-shadow:0 .18rem 0 #C9D6E2}
.zreihe.ok .zu:hover,.zreihe.gegeben .zu:hover,.zreihe.falsch .zu:hover{box-shadow:none}}
.zl.zul>span{flex:1 1 auto;min-width:0}
      /* die Lösungszeile nimmt die ganze Breite: Eine kurze Aussage (QF3: „→ Ausklammern“) rutschte sonst unter ihre Gleichung */
/* ---------- 22.11.2026, dritte Runde (Lehrkraft): Folgefehler ----------
   Eine Eingabe, die richtig aus einer eigenen falschen Eingabe folgt, bekommt den grünen Haken in grünen Klammern, wie in den Klassenarbeiten der Lehrkraft
   („ja, es ist richtig, aber es ist hinter einem Fehler“). Das Zeichen sitzt, wo sonst ✓ oder ✗ sitzt; es ist hell mit grünem Rand statt voll grün: richtig gedacht, im Ergebnis falsch. */
.umsch.folge{border-color:var(--gruen);overflow:visible}
.umsch:not(.wegw).folge button:first-child{border-radius:.46rem 0 0 .46rem}
.umsch:not(.wegw).folge button:last-child{border-radius:0 .46rem .46rem 0}
.gesperrt .umsch.folge{opacity:1}
.feld.folge{border-style:solid;border-color:var(--gruen);background:#F6FAF4}
.feld.folge.aktiv::after{display:none}
.umsch:not(.wegw).folge button.an::before,.feld.folge::before{content:'(✓)';
  position:absolute;top:-.68rem;right:.1rem;left:auto;z-index:1;height:1.2rem;padding:0 .3rem;border-radius:.7rem;border:.1rem solid var(--gruen);box-sizing:content-box;background:#fff;
  color:var(--gruen);font-family:var(--satz);font-size:.86rem;font-weight:700;font-style:normal;line-height:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;pointer-events:none}
.feld.folge::before{right:-.7rem}
.fpf{color:var(--text)}

/* ---------- 22.11.2026, dritte Runde (Lehrkraft): Parameterfarben in der Zielparabel ----------
   a blau, u lila, v pink, überall zugleich: am Buchstaben und am Wert des Reglers, in der Formel, an den Zahlen im eigenen Term, in Frage, Rückmeldung und Lösung
   („für alles nehmen wir die Farben“). Die Rechenzeichen bleiben schwarz: Das Minus in der Klammer gehört zur Form, nicht zu u. In Handschrift ohne Fett. */
.pfarb .pa{color:var(--ca);font-weight:700}
.pfarb .pu{color:var(--cu);font-weight:700}
.pfarb .pv{color:var(--cv);font-weight:700}
.pfarb .zeilen .pa,.pfarb .zeilen .pu,.pfarb .zeilen .pv{font-weight:400}

/* ---------- 22.11.2026, dritte Runde (Lehrkraft): Denkanstoß in zwei Stufen ----------
   Hat eine Aufgabe einen zweiten Denkanstoß, trägt der erste eine kleine 1 in der Ecke („dann weiß man, okay, das ist der erste Denkanstoß, und dann verlockt das ja … nochmal drauf zu drücken“);
   der zweite Tipp auf den Knopf stellt den zweiten mit einer 2 darunter, der dritte schließt. Die Zahl: lila mit lila Rand, gefüllt wie der Kasten. */
.denk .dz{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}
.denk .dz+.dz{margin-top:.35rem;padding-top:.35rem;border-top:.06rem solid #DDD2E6}
.dnr{flex:none;box-sizing:border-box;min-width:1.2rem;height:1.2rem;padding:0 .2rem;border:.09rem solid var(--lila);border-radius:.3rem;background:#F4EFF7;color:var(--lila);font-size:.78rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;margin-top:.05rem}

/* Zielparabel: gegebener Graph grün, eigene Parabel Akzentgelb, halb durchsichtig und etwas breiter, damit beide zu sehen sind, wenn sie aufeinanderliegen */
.pfarb .gk{stroke:var(--gruen)}
.pfarb .gk.eigen{stroke:var(--cc);stroke-width:5;opacity:.72}
.glg.lgelb{color:var(--cc)}

/* ---------- 23.11.2026 (Lehrkraft): Rechnung ordnen mit Andocken ----------
   Oben die eigene Rechnung: die belegten Plätze und der nächste freie (gestrichelt, blau umrandet), darunter der Vorrat. Blau: gelegt, noch ohne Urteil.
   Nach „Prüfen“ grün mit ✓ oder rot mit ✗ an jeder Zeile; von der Hilfe gelegte Zeilen hellgrün, ohne Zeichen. --of ist die Farbe der Zeile, --og ihr Grund. */
.odock{display:flex;flex-direction:column;gap:.65rem;margin-top:.2rem}
.oplaetze,.opool{display:flex;flex-direction:column;gap:.4rem}
.opool:empty{display:none}
.oplatz{box-sizing:border-box;min-height:3.1rem;display:flex;border:.13rem dashed #C4CDD6;border-radius:.7rem;position:relative;--of:var(--blau);--og:#F1F7FB}
.oplatz.naechst{border-color:var(--blau);background:#F4F9FC}
.oplatz.weg{display:none}
.oplatz.voll{border:0;background:none}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

  raf=requestAnimationFrame(step);return t;}

/* ---------- Schreibweise ---------- */
const zahl=n=>{const r=Math.round(n*1000)/1000;return (r<0?'−':'')+String(Math.abs(r)).replace('.',',');};
const V=s=>'<i>'+s+'</i>';

function vorfaktor(a){return typeof a==='string'?V(a):a===1?'':a===-1?'−':zahl(a);}

  let s=vorfaktor(a);
  s+=u===0?V('x')+Q:'('+V('x')+(u>0?' − ':' + ')+zahl(Math.abs(u))+')'+Q;
  if(typeof v==='string')s+=' + '+V(v);else if(v!==0)s+=(v>0?' + ':' − ')+zahl(Math.abs(v));

const P=(k,t)=>'<span class="p'+k+'">'+t+'</span>';
const SPF=fx(P('a',V('a'))+'('+V('x')+' − '+P('u',V('u'))+')'+Q+' + '+P('v',V('v')));          // f(x) = a(x − u)² + v
const formZeile='<p class="ex-form"><span>Scheitelpunktform</span>'+SPF+'</p>';
function termTeile(a,u,v){let s=a===-1?P('a','−'):a===1?'':P('a',zahl(a));

  if(v!==0)s+=(v>0?' + ':' − ')+P('v',zahl(Math.abs(v)));return s;}

  const t=[];if(a!==0)t.push([a,V('x')+Q]);if(b!==0)t.push([b,V('x')]);if(c!==0)t.push([c,'']);if(!t.length)return '0';

/* ---------- Mathematik in Sätzen (Lehrkraft 23.11.2026) ----------
   In Zeilen mit Wörtern (.zl.text und Verwandte) bleiben die Wörter in Indie Flower; Zahlen, Variablen und Terme stehen in der Textschrift,
   Variablen kursiv, in ihren Farben, so groß wie die Rechenzeilen daneben („Mitte: x = −2“, „Hochpunkt H(−2 | 8)“). mtext() setzt die
   Mathematik eines Satzes in <span class="mtx">; die Größe kommt aus --mg des Zusammenhangs (rahmen.css). Mathematik ist: Zahlen, Variablen
   (<i>, ein einzelner Kleinbuchstabe als Wort), Hochzahlen, Brüche, Wurzeln und die Rechenzeichen zwischen ihnen, Einheiten direkt hinter
   einer Zahl („15 m“, „50 %“, „400 €“). Satzzeichen am Ende („bei 1.“, „b = 1:“) bleiben in Indie Flower. Farbspannen und andere Spannen sind
   durchlässig: Läuft eine Rechnung über ihre Grenze, wird die Textschrift dort geschlossen und dahinter wieder geöffnet.
   Ein Bindestrich hinter einer Variablen („y‑Achse“, „p,q‑Formel“) wird geschützt (U+2011), damit dort nicht getrennt wird. */
const MTX_EINHEIT=/^(km\/h|m²|m³|cm²|cm|mm|km|min|ml|GB|MB|kg|g|m|s|h|l|%|°C|°|€)(?![A-Za-zÄÖÜäöüß0-9])/;
const MTX_ATOM=/^(i|sup|sub|svg)$/,MTX_ATOMKL=/\b(br|wurzel|mtx|wblitz)\b/,MTX_FREMD=/\b(lgl|op)\b/,MTX_OPENT=/^&(lt|gt|le|ge|ne|minus|middot|plusmn|times);$/;
function mtext(h){
  h=h==null?'':String(h);if(/class="[^"]*\bmtx\b/.test(h))return h;
  // 1. zerlegen: T Spanne (durchlässig), X fremd, M Variable, Hochzahl, Bruch, Wurzel (ganz), N Zahl, U Einheit, O Rechenzeichen, K Komma, S Leerraum, W Wort, Satzzeichen
  const it=[];let r=h,m;
  const ende=(name,s)=>{let n=1;const re=new RegExp('<(/?)'+name+'\\b[^>]*>','gi');let q;
    while((q=re.exec(s))){if(q[1])n--;else if(!/\/>$/.test(q[0]))n++;if(n===0)return re.lastIndex;}return s.length;};
  while(r.length){
    if((m=r.match(/^<([a-zA-Z0-9]+)([^>]*)>/))){const name=m[1].toLowerCase(),kl=(m[2].match(/class="([^"]*)"/)||[])[1]||'';
      const fremd=name==='span'&&MTX_FREMD.test(kl);      // fremd: schon gesetzt (die Gleichung der Zuordnen-Lösung, der Umformungsstrich), bleibt, wie sie ist
      if(fremd||MTX_ATOM.test(name)||name==='span'&&MTX_ATOMKL.test(kl)){const e=m[0].length+ende(name,r.slice(m[0].length));it.push({t:fremd?'X':'M',s:r.slice(0,e)});r=r.slice(e);}
      else{it.push({t:'T',s:m[0]});r=r.slice(m[0].length);}continue;}
    if((m=r.match(/^<\/[^>]+>/))){it.push({t:'T',s:m[0]});r=r.slice(m[0].length);continue;}
    if((m=r.match(/^(&nbsp;|&#160;|&#8239;|[\s  ])+/))){it.push({t:'S',s:m[0]});r=r.slice(m[0].length);continue;}
    if((m=r.match(/^&[#a-zA-Z0-9]+;/))){it.push({t:MTX_OPENT.test(m[0])?'O':'W',s:m[0]});r=r.slice(m[0].length);continue;}
    if((m=r.match(/^\d+(,\d+)?/))){it.push({t:'N',s:m[0]});r=r.slice(m[0].length);continue;}
    if((m=r.match(/^[A-Za-zÄÖÜäöüß]+/))){it.push({t:'W',s:m[0],wort:true});r=r.slice(m[0].length);continue;}
    const c=r[0],v=it.length?it[it.length-1]:null;r=r.slice(1);
    it.push({t:c===':'?(v&&v.t==='S'?'O':'W'):'=+−·|≠<>≤≥≈±()²³√×⋅⇒⇔/'.indexOf(c)>=0?'O':c===','?'K':'W',s:c,zeichen:true});}
  const echt=[];it.forEach((x,k)=>{if(x.t!=='T')echt.push(k);});
  const nb=(k,d)=>{const p=echt.indexOf(k)+d;return p>=0&&p<echt.length?it[echt[p]]:null;};
  // 2. Einheiten hinter Zahlen, einzelne Kleinbuchstaben als Variablen, geschützte Bindestriche hinter Variablen
  for(let k=0;k<it.length;k++){const x=it[k];if(x.t==='T')continue;

/* Feuerwerk: ein Knall mit Knistern, als fertige Tonspur berechnet. Der Knall ist reines Rauschen in drei Schichten:
   der harte, helle Schlag · der Körper, der schnell dumpf wird und nachrollt · die Tiefe für größere Lautsprecher.
   Ein tiefer Ton an dieser Stelle klingt nach Trommel. Danach viele sehr kurze Knackser, jeder etwas anders gefärbt.
   Gewählt am Gerät aus drei Fassungen: die mit mehr Körper und Tiefe (Lehrkraft 19.11.2026). */
function feuerDaten(sr){
  const L=Math.floor(sr*2),d=new Float32Array(L),tmp=new Float32Array(L);
  const schicht=(gew,dauer,fc,env)=>{let y1=0,y2=0,max=0,k=1;const n=Math.min(L,Math.floor(dauer*sr));
    for(let i=0;i<n;i++){const t=i/sr;if(i%16===0)k=1-Math.exp(-6.283*fc(t)/sr);
      y1+=k*(Math.random()*2-1-y1);y2+=k*(y1-y2);tmp[i]=y2*env(t);const a=Math.abs(tmp[i]);if(a>max)max=a;}
    for(let i=0;i<n;i++)d[i]+=tmp[i]/max*gew;};
  schicht(0.8,0.4,t=>2000+9000*Math.exp(-t/0.04),t=>Math.min(1,t/0.001)*Math.exp(-t/0.04));                             // der Schlag
  schicht(0.95,2,t=>520+2600*Math.exp(-t/0.12),t=>Math.min(1,t/0.003)*(0.6*Math.exp(-t/0.11)+0.4*Math.exp(-t/0.5)));      // der Körper mit dem Nachrollen
  schicht(0.5,1.6,t=>130,t=>Math.min(1,t/0.005)*Math.exp(-t/0.28));                                                     // die Tiefe
  let max=0;for(let i=0;i<L;i++){const a=Math.abs(d[i]);if(a>max)max=a;}
  for(let i=0;i<L;i++)d[i]/=max;
  const n=70+Math.floor(Math.random()*30);                                                                              // das Knistern
  for(let j=0;j<n;j++){const ts=0.3+Math.pow(Math.random(),1.6)*1.3,i0=Math.floor(ts*sr),tau=(0.0015+Math.random()*0.004)*sr,
      amp=(0.1+Math.random()*0.24)*(1-0.7*(ts-0.3)/1.3),len=Math.min(L-i0-1,Math.floor(tau*7)),
      r=0.86,c=2*r*Math.cos(6.283*(2400+Math.random()*4200)/sr);let u1=0,u2=0;
    for(let i=0;i<len;i++){const u=(Math.random()*2-1)+c*u1-r*r*u2;u2=u1;u1=u;d[i0+i]+=u*(1-r)*1.6*amp*Math.exp(-i/tau);}}
  return d;}

function naechste(){

  const akt=TYPEN.filter(t=>t.aktiv);

  const k2=kand.filter(x=>x[0].id!==S.letzter);if(k2.length)kand=k2;
  const f=kand.filter(([t])=>{const st=S.typ[t.id];return st.faellig!==null&&st.faellig<=S.pos;});
  const pool=f.length?f:kand;

function werte(t,li,ok,zaehlt){

  const st=S.typ[t.id],key=t.level[li];let ereignis=null;

  if(li>=st.top){

    else{st.streak=0;st.falsch++;st.faellig=S.pos+3;}

/* =====================================================================
   PowerCheck: die ganze Reihe im Mix (Lehrkraft 26.11.2026)
   - Jeder Aufgabentyp aller Trainings der Reihe kommt je Level einmal: erst alle auf Level 1 (Block 1), dann alle auf Level 2, dann auf Level 3.
   - Einmal richtig heißt aufsteigen. Ein Typ kommt im nächsten Block nur, wenn er sein Level davor geschafft hat; fehlt ihm ein Level, zählt das
     darunter. Ein abgeschaltetes Level zählt dabei nicht („Level 1 abgewählt“ ist der Einstieg für Starke).
   - Fehler: Der Typ kommt im selben Block einmal wieder, mit neuen Zahlen, nicht direkt danach. Wieder falsch: Er steigt nicht auf und bekommt die Marke
     „empfohlen“; im Stand führt sie ins Training seines Blatts. Was mit „Nächster Schritt“ oder „Lösung“ gelöst wird, gilt wie ein Fehlversuch.
   - Nie zwei Aufgaben vom selben Blatt hintereinander; in jeder Etappe möglichst alle Blätter.
   - Nach Block 3 zeigt der Zwischenstand, was offen ist; der große Knopf führt mit den offenen Typen weiter, in Runden nach denselben Regeln.
   - Statt eines Erfolgsbands je Aufgabentyp eins je Blatt. Bänder wachsen nur.
   ===================================================================== */
const PC_K=['q','b','w'];
function pcNeu(){S.pc={d:0,f:{},n:{},wdh:{},lb:null,eb:[],ee:1,zeig:false,ea:{ok:[],faellig:false,n:0,lauf:null}};}
/* d: der Durchgang. 0, 1, 2 sind die Blöcke Level 1, 2, 3; ab 3 die Runden mit den offenen Typen. f[id]: in welchem Durchgang der Typ fertig ist (geschafft oder
   zweimal falsch). n[id]: [Durchgang, Versuche darin]. wdh[id]: ab welcher Aufgabe die Wiederholung dran ist. lb: Blatt der letzten Aufgabe. eb, ee: Blätter der
   laufenden Etappe und ihre Nummer. zeig: nach Block 3 (und nach jeder Runde) den Zwischenstand zeigen. ea: das verbindende Stück (unten). */

/* Welches Level ein Typ im Durchgang d übt (Index in t.level), oder null */
function pcAuftrag(t,d){
  if(!t.aktiv)return null;
  if(d>=3)return aktLevel(t);                    // Runden: das erste eingeschaltete Level, das noch nicht geschafft ist
  const k=PC_K[d],i=t.level.indexOf(k),st=S.typ[t.id];
  if(!S.filter[k]||i<0||st.top>i)return null;
  for(let j=i-1;j>=0;j--)if(S.filter[t.level[j]])return st.top>j?i:null;      // das nächste eingeschaltete Level darunter muss geschafft sein
  return i;}
const pcOffen=d=>TYPEN.filter(t=>S.pc.f[t.id]!==d&&pcAuftrag(t,d)!==null);
const pcTypOffen=t=>t.aktiv&&aktLevel(t)!==null;
/* Ist der Durchgang fertig, kommt der nächste. Nach dem ersten Block, in dem geübt wurde, und danach nach jedem Durchgang ist das verbindende Stück dran,
   solange es nicht sitzt; nach Block 3 und nach jeder Runde zeigt der Zwischenstand, was offen ist (weiter() zeigt ihn). */
function pcWeiterschalten(){let n=0;
  while(n++<8&&!pcOffen(S.pc.d).length){
    const offen=TYPEN.some(pcTypOffen);if(S.pc.d>=2&&!offen)break;      // alles sitzt: Auffrischen wie im Training
    const vorher=S.pc.d;S.pc.d++;
    if(S.pos>0&&PCF.stueck&&!pcEaVoll())S.pc.ea.faellig=true;
    if(vorher===2&&offen&&S.pos>0)S.pc.zeig=true;}}      // nur nach Block 3 (Lehrkraft 26.11.2026); die Runden danach laufen ohne Halt weiter
function pcNaechste(){
  pcWeiterschalten();
  const d=S.pc.d,kand=pcOffen(d);
  if(S.pc.ee!==S.etappe){S.pc.ee=S.etappe;S.pc.eb=[];}
  let r;
  if(!kand.length){      // alles sitzt (auf den eingeschalteten Leveln): zum Auffrischen das höchste eingeschaltete Level, wie im Training
    const k=TYPEN.filter(t=>t.aktiv).map(t=>[t,auffrLevel(t)]).filter(x=>x[1]!==null);if(!k.length)return null;
    const k2=k.filter(x=>x[0].blatt!==S.pc.lb);r=pick(k2.length?k2:k);}
  else{
    let b=kand.filter(t=>!(S.pc.wdh[t.id]>S.pos));if(!b.length)b=kand;      // eine Wiederholung nicht direkt nach dem Fehler
    const b2=b.filter(t=>t.blatt!==S.pc.lb);if(b2.length)b=b2;      // nie zweimal dasselbe Blatt hintereinander
    else{const f=pcAuffrischen(S.pc.lb);if(f.length){r=pick(f);S.pc.lb=r[0].blatt;if(!S.pc.eb.includes(r[0].blatt))S.pc.eb.push(r[0].blatt);return r;}}      // nur noch ein Blatt offen: dazwischen eine Aufgabe zum Auffrischen von einem anderen Blatt
    const b3=b.filter(t=>!S.pc.eb.includes(t.blatt));if(b3.length)b=b3;      // in jeder Etappe möglichst alle Blätter
    const zahl={};kand.forEach(t=>{zahl[t.blatt]=(zahl[t.blatt]||0)+1;});      // das Blatt mit den meisten offenen Aufgaben zuerst: Am Ende bleibt so kein Blatt allein übrig
    const max=Math.max(...b.map(t=>zahl[t.blatt]));b=b.filter(t=>zahl[t.blatt]===max);
    const t=pick(b);r=[t,pcAuftrag(t,d)];}

  return r;}
/* Zum Auffrischen: ein Typ von einem anderen Blatt auf einem Level, das er schon geschafft hat */
const pcAuffrischen=lb=>TYPEN.filter(t=>t.aktiv&&t.blatt!==lb).map(t=>{for(let j=Math.min(S.typ[t.id].top,t.level.length)-1;j>=0;j--)if(S.filter[t.level[j]])return [t,j];return null;}).filter(Boolean);
function pcWerte(t,li,ok,zaehlt){
  const st=S.typ[t.id],gut=ok&&zaehlt,d=S.pc.d,auftrag=S.pc.f[t.id]!==d&&pcAuftrag(t,d)===li;let ereignis=null;      // auftrag: die Aufgabe des Durchgangs, nicht zum Auffrischen
  st.zuletzt=S.pos;st.faellig=null;
  if(gut&&li>=st.top){st.top=li+1;st.streak=0;st.sl=-1;st.halb=false;ereignis=st.top>=t.level.length?'sitzt':'level';}
  if(auftrag){const nn=S.pc.n[t.id]&&S.pc.n[t.id][0]===d?S.pc.n[t.id][1]+1:1;S.pc.n[t.id]=[d,nn];
    if(gut){st.falsch=0;S.pc.f[t.id]=d;delete S.pc.wdh[t.id];}
    else{st.falsch++;if(nn>=2){S.pc.f[t.id]=d;delete S.pc.wdh[t.id];}else S.pc.wdh[t.id]=S.pos+2;}}
  S.pos++;return ereignis;}

/* ---------- Blätter, Bänder, Marken ---------- */
const pcBlatt=id=>PCF.blaetter.find(b=>b.id===id);
const pcTypen=b=>TYPEN.filter(t=>t.blatt===b.id&&t.aktiv);

/* ---------- Das Stück, das die Blätter verbindet („Einmal alles“ in QF) ----------
   PCF.stueck = {id, titel, marke, adresse, schritte:[{name}], fall(n), aufgabe(fall,i,eigen), aufloesung(fall,eigen,erg,m)}: eine feste Liste von Fällen, je Fall
   Schritte in bekannten Formen des Rahmens. aufgabe() bekommt in eigen, was in den Schritten davor eingegeben wurde (für den Folgefehler mit Haken in
   Klammern; die Aufgaben schreiben es selbst hinein); aufloesung() baut die Auflösung in die Bühne. Im Gesamttraining ist das Stück eine eigene Etappe nach

   Aufgabe; sein Haken bleibt (wie in der Anwendung), sitzt das Stück, wenn alle Schritte einmal gelungen sind. */
const pcSt=()=>PCF.stueck;
const pcEaVoll=()=>!!pcSt()&&pcSt().schritte.every((_,i)=>S.pc.ea.ok[i]);
const pcEaBand=()=>pcSt().schritte.filter((_,i)=>S.pc.ea.ok[i]).length/pcSt().schritte.length;
const pcEaErlaubt=()=>!!(S.filter.b||S.filter.w);
function pcWerkDran(){const E=S.pc.ea;if(!pcSt()||pcEaVoll()||!pcEaErlaubt())return false;
  return !!(E.lauf&&E.lauf.modus==='gesamt')||(E.faellig&&S.pkt===0)||sechsVoll();}
const pcAlleVoll=()=>sechsVoll()&&(!pcSt()||pcEaVoll());
const pcEtappeText=()=>'PowerCheck. Etappe '+S.etappe+(pcWerkDran()?': '+pcSt().titel+'.':'.');

function pruefeMenge(L,ein,keine,kand,leerHinweis){

  if(!S.length)return {ok:false,hinweis:'Hier gibt es keine Lösung: Tippe auf „keine Lösung“.',falsch:['a','b']};

  for(const [M,h] of kand)if(gl(E,sortiert(M)))return {ok:false,hinweis:h,falsch:['a','b'],treffer};
  if(E.length<S.length&&E.every(z=>S.some(s=>gleich(s,z))))return {ok:false,hinweis:'Eine Lösung fehlt.',falsch:['a','b'],treffer};

const ZAHLEN=[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6];

    if(new Set(z).size===4)break;}

    else if(soll.includes(-v))o.hinweis='Vorzeichen: '+lf(-v)+' wird für '+X+' = '+zahl(-v)+' null, nicht für '+zahl(v)+'.';
    else if(v===a&&art!=='zwei'&&art!=='doppelt')o.hinweis=zahl(v)+' steht vor den Klammern und macht keinen Faktor null: '+F+'('+zahl(v)+') = '+zahl(r4(f(v)))+', nicht 0.';
    else o.hinweis=F+'('+zahl(v)+') = '+zahl(r4(f(v)))+', nicht 0.';

/* Level 3, die Wunschparabel (Aufgabe 1 des Blatts): ein Funktionsterm zu vorgegebenen Nullstellen; viele Terme sind richtig.
   Nach „Prüfen“ steht die eigene Parabel im Bild, gelb und halb durchsichtig, mit ihren Nullstellen grün oder rot; eine verlangte Nullstelle, die fehlt, grün gestrichelt.

const koefA=k=>(k===1?'':k===-1?'−':zahl(k))+V('a');

          G.S.forEach((u,i)=>{if(!gleich(num(w['y'+(i+1)]),u[1])){Fa.push('y'+(i+1));sag(V('y')+'-Wert: '+g+'('+zahl(u[0])+') = '+(G.m===1?'':G.m===-1?'−':zahl(G.m)+MAL)+kl(u[0])+(G.n?plusminus(G.n):'')+' = '+zahl(u[1])+'.');}});
          if(w.lage!==G.art){Fa.push('lage');sag(n===2?'Zwei Lösungen: Die Gerade schneidet die Parabel zweimal. Sie ist eine Sekante.':n===1?'Eine (doppelte) Lösung: Die Gerade berührt die Parabel. Sie ist eine Tangente.':'Keine Lösung: Es gibt keinen gemeinsamen Punkt.');}
          return {ok:!Fa.length,falsch:Fa,hinweis:hin};},
        nach(w,m){const B=pgBild(G);nachBild(m).innerHTML=B.svg;A.gl=B.gl();}};},
    /* Level 3: Punkte eintippen ⇒ Lage (neu): S₁ und S₂ als Paare, der zweite darf leer bleiben; „kein gemeinsamer Punkt“ als Knopf */
    w(){const G=pgFall(),SN=V('S');
      return {form:'eingabe',frage:'Bestimme die gemeinsamen Punkte. Wie liegt die Gerade zur Parabel?',term:pgTerm(G),einKl:'satz',erkl:'info3',denk:DENK.gleich,denk2:'Löse die Gleichung. Zu jeder Lösung gehört ein '+V('y')+'-Wert.',schritte:pgZeilen(G),G,
        ein:sz(idx(SN,1)+'(',FELD('a'),'|',FELD('b'),'), &nbsp;'+idx(SN,2)+'(',FELD('c'),'|',FELD('d'),')')+sz('⇒ Die Gerade ist eine','<span class="umsch" data-w="lage"><button type="button" data-v="Sekante">Sekante</button><button type="button" data-v="Tangente">Tangente</button></span>'),
        leer:['c','d'],keineText:'kein gemeinsamer Punkt',folgt:{b:['a'],d:['c'],lage:['a','c']},loes:{keine:G.art==='k'},notiz:'Bei einem Berührpunkt bleibt '+idx(SN,2)+' leer.',buchst:{s:'Sekante',t:'Tangente'},
        pruefe(w){return pgUrteil(G,w);},
        nach(w,m){const B=pgBild(G);nachBild(m).innerHTML=B.svg;A.gl=B.gl();}};}
  },
  /* ---- 4.6 Begriffe und Aussagen ---- */
  begriff:{
    q(){return begriffFrage();},
    b(){const F=aussagenFall();return {form:'aussagen',frage:'Wahr oder falsch? Entscheide jede Aussage.',term:F.term,bild:F.bild,gl:F.gl,aus:F.aus,erkl:F.erkl,denk:F.art==='gerade'?DENK.gerade:DENK.aussagen,art:F.art};}

/* =====================================================================
   Erklärungen QF4: zu jedem Aufgabentyp eine (Lehrkraft 24.11.2026; neben den Infoboxen des Blatts eigene Aufgabenerklärer).
   Watch: Nullstellenform (Info 1, für 4.1 und 4.2) · Vielfachheit (Info 2, für 4.3) · Skizzieren in drei Schritten (neu, für 4.3) ·
   Formen wechseln (neu, für 4.4) · Parabel und Gerade (Info 3, für 4.5) · Begriffe (neu, Begriffskarten mit Wortleiste, für 4.6).
   Try: Nullstellen zusammenschieben · Gerade verschieben. Beide zeigen dieselbe Idee: Zwei Punkte werden einer.
   Die Beispiele sind die des Blatts. a ist blau, die Nullstellen und gemeinsamen Punkte lila und pink, ein gegebener Graph grün
   (wo a farbig ist) oder blau; im Bild von Parabel und Gerade ist die Parabel blau, die Gerade grün.
   ===================================================================== */
const ZEIT=700;
const QA=t=>'<span class="q4a">'+t+'</span>',Q1=t=>'<span class="q4x1">'+t+'</span>',Q2=t=>'<span class="q4x2">'+t+'</span>',mk=t=>'<span class="mark">'+t+'</span>';
const NE='<span class="ne">≠</span>';
/* Watch: Schritte mit Titel, Text, Zeilen und Bild. Jede neue Zeile erscheint nach einer kurzen Pause; Weiter springt zum nächsten Schritt.
   Eine Kurve mit ab: n erscheint erst mit der n-ten Zeile */
function watch(titel,SCH,kl){
  const e=ebene(titel,'Watch','<main class="exm wt"><div class="bild wbx"></div><div class="ext"><h2 class="ex-titel"></h2><p class="ex-text"></p><div class="zeilen wz"></div></div></main>'+
    '<footer class="leiste ex"><button class="hk" data-s="-1">Zurück</button><div class="punkte">'+SCH.map((x,j)=>'<button type="button" data-j="'+j+'"'+(x.neu&&j?' class="neu"':'')+' aria-label="Schritt '+(j+1)+': '+String(x.titel).replace(/<[^>]+>/g,'')+'"><i></i></button>').join('')+'</div><button class="haupt" data-s="1">Weiter</button></footer>');
  e.classList.add('watch',...kl.split(' '));let i=0,lauf=0,K=null;const timers=[];
  const bild=$('.wbx',e),wz=$('.wz',e);
  const zeigZeilen=(s,j)=>{const z=s.nurBild?[]:(s.zeilen||[]);wz.innerHTML=z.slice(0,j).map((r,n)=>'<div class="zl'+(r.text?' text':'')+(n===j-1?' neu':'')+'"><span>'+(r.text?mtext(r.h):r.h)+'</span>'+(r.op?'<span class="op">'+r.op+'</span>':'')+'</div>').join('');
    if(K){$$('.gk[data-ab]',bild).forEach(c=>c.classList.toggle('weg',j<+c.dataset.ab));if(s.marken)$('.marken',bild).innerHTML=s.marken(K,j);zeigeGl(s.gl?s.gl(K,j)||[]:[],bild);}
    if(s.nachZeile)s.nachZeile(bild,K,j);};
  const zeig=()=>{const s=SCH[i],nr=++lauf;timers.forEach(clearTimeout);timers.length=0;
    $('.ex-titel',e).innerHTML=s.titel;$('.ex-text',e).innerHTML=s.text||'';
    if(s.html){K=null;bild.innerHTML=s.html();bild.classList.add('text');}
    else if(s.kurven){bild.classList.remove('text');const F=s.X?{X:s.X,Y:s.Y,o:s.o}:fenster(s.win,{breite:330,hoehe:310});K=koord(F.X,F.Y,F.o);
      bild.innerHTML=K.svg(s.kurven.map(c=>'<path class="gk '+(c.kl||'')+(RUHIG||c.ab?'':' neu')+'" pathLength="1"'+(c.ab?' data-ab="'+c.ab+'"':'')+' d="'+K.pfad(c.f,c.von,c.bis)+'"/>').join('')+(s.extra?s.extra(K):''),'');}
    const n=(s.zeilen||[]).length;zeigZeilen(s,RUHIG?n:0);if(s.start)s.start(bild,K);
    if(!RUHIG)for(let j=1;j<=n;j++)timers.push(setTimeout(()=>{if(nr===lauf&&e.isConnected)zeigZeilen(s,j);},350+j*ZEIT));
    $$('.punkte button',e).forEach((p,j)=>{p.classList.toggle('an',j<=i);p.classList.toggle('jetzt',j===i);});
    $('[data-s="-1"]',e).disabled=i===0;$('.haupt',e).textContent=i===SCH.length-1?'Von vorn':'Weiter';};
  e._schritt=d=>{i=d>0&&i===SCH.length-1?0:Math.max(0,Math.min(SCH.length-1,i+d));zeig();};
  $$('[data-s]',e).forEach(b=>b.addEventListener('click',()=>e._schritt(+b.dataset.s)));
  $$('.punkte button',e).forEach(b=>b.addEventListener('click',()=>{i=+b.dataset.j;zeig();}));
  bild.addEventListener('click',()=>e._schritt(1));
  const zu=e._zu;e._zu=()=>{lauf++;timers.forEach(clearTimeout);zu();};
  zeig();return e;}
/* Rechnung groß in der Mitte, ohne Bild: Die Zeilen erscheinen nacheinander, mit Umformungsstrich */
function grossR(s){s.html=()=>'<div class="gross-r">'+(s.kopf||'')+'<div class="gr-z"></div></div>';s.nurBild=true;
  s.nachZeile=(b,K,j)=>{const g=$('.gr-z',b);if(g)g.innerHTML=(s.zeilen||[]).slice(0,j).map((r,n)=>'<p class="'+(r.text?'t':'')+(n===j-1?' neu':'')+'"><span>'+(r.text?mtext(r.h):r.h)+'</span>'+(r.op?'<span class="op">'+r.op+'</span>':'')+'</p>').join('');};return s;}
const ohneBild=SCH=>{SCH.forEach(s=>{if(!s.kurven&&!s.html)grossR(s);});return SCH;};
const pktS=(k,x,y,kl,name,dx,dy,anker)=>k.pkt(x,y,kl,name,dx===undefined?9:dx,dy===undefined?-9:dy,anker);

/* ---------- Gleichung am Graphen (Lehrkraft 22.11.2026) ----------
   Steht die Lösung da, steht die Gleichung des Graphen im Bild, in seiner Farbe: „Da kann man das noch viel besser sehen.“
   Eine Aufgabe gibt dazu gl an (oder eine Form setzt A.gl): {html, kl, pkt, rahmen, hind, spaet}. pkt sind Punkte des Graphen, rahmen ist die Zeichenfläche
   [links, oben, rechts, unten], hind sind Punkte, die frei bleiben sollen (Achsen mit ihren Zahlen, andere Graphen), alles in Koordinaten der viewBox.
   Das Schild ist HTML über dem SVG, damit Brüche wie im Text stehen. Sein Platz wird am fertigen Bild gemessen: dicht neben dem Graphen, möglichst frei
   von Achsen und anderem, eher oben. Nach dem Drehen des Geräts wird neu gemessen. */
function zeigeGl(spec,wo){const bild=wo||$('.buehne .bild');if(!bild||!$('svg',bild))return;
  /* spec: ein Schild oder eine Liste (mehrere Graphen im Bild, Tafel-Runde). Ein Schild, das schon steht, bleibt stehen und blendet nicht neu ein. */
  const L=(Array.isArray(spec)?spec:[spec]).filter(s=>s&&s.pkt&&s.pkt.length),alt=$$('.glg',bild),key=s=>(s.kl||'')+'|'+s.html;
  alt.forEach(x=>{if(!L.some(s=>key(s)===x._key))x.remove();});
  L.forEach(s=>{let e=alt.find(x=>x.isConnected&&x._key===key(s));
    if(!e){e=el('<div class="glg '+(s.kl||'')+(s.spaet?' glspaet':'')+'">'+s.html+'</div>');e._key=key(s);bild.appendChild(e);
      if(s.sel){const k=$(s.sel,bild);if(k)e.style.color=getComputedStyle(k).stroke;}}      // sel: Das Schild nimmt die Farbe dieser Kurve
    e._gl=s;});
  bild.classList.toggle('mitgl',L.length>0);
  /* Der bloße Name am Graphen weicht seinem Schild. namen: nur diese Namen; ohne Angabe alle */
  const weg=L.some(s=>!s.namen)?null:[].concat(...L.map(s=>s.namen));
  $$('.gname',bild).forEach(x=>{x.style.display=L.length&&(!weg||weg.includes(x.textContent.trim()))?'none':'';});
  const alle=$$('.glg',bild);alle.forEach(setzeGl);requestAnimationFrame(()=>alle.forEach(e=>{if(e.isConnected)setzeGl(e);}));}
function setzeGl(e){const spec=e._gl,bild=e.parentNode,svg=bild&&$('svg',bild),M=svg&&svg.getScreenCTM();if(!spec||!M)return;
  const pt=svg.createSVGPoint(),S=p=>{pt.x=p[0];pt.y=p[1];const q=pt.matrixTransform(M);return [q.x,q.y];};
  const B=bild.getBoundingClientRect(),r=e.getBoundingClientRect(),w=r.width,h=r.height;if(!B.width||!w)return;
  const [x0,y0]=S([spec.rahmen[0],spec.rahmen[1]]),[x1,y1]=S([spec.rahmen[2],spec.rahmen[3]]),P=spec.pkt.map(S),H=(spec.hind||[]).map(S),HH=(spec.hart||[]).map(S),g=Math.max(5,h*.24);      /* hart: ein zweiter Graph, auf dem das Schild nicht liegen darf (QF1 Zielparabel: gegebener und eigener Graph tragen je ein Schild) */
  const ab=(bx,by,p)=>Math.hypot(Math.max(bx-p[0],0,p[0]-bx-w),Math.max(by-p[1],0,p[1]-by-h));
  /* Schilder, die schon stehen: aus ihrem gemerkten Platz (_rel), nicht aus dem Bild der Seite: Mit „Bewegung reduzieren“ gleiten left und top kurz (.01 s),
     und das Schild davor stünde beim Messen noch an seinem alten Platz (24.11.2026, gefunden an der Zielparabel) */
  const R=[];for(let v=e.previousElementSibling;v;v=v.previousElementSibling)if(v.classList.contains('glg'))R.push(v._rel?{left:B.left+v._rel[0],top:B.top+v._rel[1],right:B.left+v._rel[0]+v._rel[2],bottom:B.top+v._rel[1]+v._rel[3]}:v.getBoundingClientRect());
  /* alle Plätze im Raster durchgehen: senkrecht in der Zeichenfläche, waagerecht bis an den Bildrand. Am besten ist, wer den Graphen nicht berührt, dicht an ihm
     liegt (Abstand g) und von Achsen und anderem frei ist; passt das Schild nirgends frei hin, gewinnt der Platz, der am wenigsten vom Graphen verdeckt */
  let best=null,bestS=null;const st=Math.max(4,h*.2);
  /* streng (QF1 Zielparabel, Lehrkraft 23.11.2026): Das Schild bleibt ganz in der Zeichenfläche und liegt weder auf einem anderen Schild noch auf den Zahlen an den Achsen;
     unter den Plätzen, die das erfüllen, gewinnt der beste. Gibt es keinen, gilt die Note wie sonst. */
  const ZA=spec.streng?$$('text.gt',svg).map(t=>t.getBoundingClientRect()):[];
  for(let by=y0+2;by+h<=y1-2;by+=st)for(let bx=B.left+1;bx+w<=B.right-1;bx+=st){
    let dk=1e9,n=0,dh=1e9;for(const p of P){const d=ab(bx,by,p);if(d<dk)dk=d;if(d===0)n++;}for(const p of H)dh=Math.min(dh,ab(bx,by,p));
    const auf=R.some(q=>bx<q.right+4&&bx+w>q.left-4&&by<q.bottom+4&&by+h>q.top-4);let nh=0;for(const p of HH)if(ab(bx,by,p)<g*.5)nh++;
    const note=(dk<g*.5?-1000-n*10:0)-(nh?700+nh*10:0)-(auf?600:0)-Math.abs(dk-g)*2-(HH.length?Math.min(250,Math.max(0,dk-1.2*h)*10):0)+Math.min(dh,2*h)-(by-y0)*.06-(Math.max(0,x0-bx)+Math.max(0,bx+w-x1))*4;      /* über den Rand der Zeichenfläche nur, wenn es sonst nicht passt. Mit einem zweiten Graphen im Bild (hart): nicht auf ihm; weiter als gut eine Schildhöhe vom eigenen Graphen weg ist dann teurer als Rand oder Achse, sonst stünde das Schild neben dem anderen Graphen */
    if(!best||note>best[0])best=[note,bx,by];
    if(spec.streng&&!auf&&bx>=x0+1&&bx+w<=x1-1&&!ZA.some(q=>bx<q.right+2&&bx+w>q.left-2&&by<q.bottom+2&&by+h>q.top-2)&&(!bestS||note>bestS[0]))bestS=[note,bx,by];}
  if(bestS)best=bestS;
  if(!best)best=[0,x0+6,y0+6];
  e.style.left=((best[1]-B.left)/B.width*100).toFixed(2)+'%';e.style.top=((best[2]-B.top)/B.height*100).toFixed(2)+'%';e._rel=[best[1]-B.left,best[2]-B.top,w,h];}
window.addEventListener('resize',()=>$$('.glg').forEach(e=>{if(e._gl)setzeGl(e);}));
