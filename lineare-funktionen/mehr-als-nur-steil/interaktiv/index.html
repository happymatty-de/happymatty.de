/* =====================================================================
   LF2 · Mehr als nur steil · Erklärer v1.22 (04.11.2026) · CC BY-NC-SA 4.0 · Patrick Saul
   Vier Reiter: Lineare Funktion · Zeichnen · Ablesen · Spezialfälle
   v1.22: Erkunder (Lineare Funktion): „b = …“ steht am Punkt auf der y-Achse wie in den
     Schritten.
   v1.21: Vollbild-Knopf oben rechts neben den Reitern statt in der Fußzeile, immer
     sichtbar; wo der Browser kein Vollbild bietet (etwa im eingebauten Browser von
     SDUI), sagt ein Hinweis, in Safari zu öffnen – vorher war der Knopf dann weg.
   v1.20: Fertig-Schritte: b und m leuchten zugleich auf – im Bild und im Feld – zum
     Arpeggio, nicht mehr nacheinander.
   v1.19: Puls der Zahlen am Dreieck und der Beschriftungen um die eigene Mitte, als
     SVG-Transformation mit getBBox: Safari setzt transform-box/transform-origin bei
     SVG-Text nicht um, die Zahlen flogen zur Ecke des Bildes und zurück.
   v1.18: Landung im Gleichungsfeld wieder wie bis v1.14 (Faktor 2,3, Panel schneidet ab):
     größer und unbeschnitten wirkte sie, als flöge der Wert von außen herein. Das
     Aufleuchten stehender Werte ist ein Puls an Ort und Stelle (klein – groß – klein)
     statt eines Sprungs auf groß.
   v1.17: Fertig-Schritte (Einstieg „Die Gleichung zum Bild“, Ablesen „Fertig!“): statt
     des grünen Punkts pulsen die eingesetzten Werte – erst b (Punkt mit Ring und „b = …“
     im Bild, b im Feld), dann m (Zahlen am Dreieck, m im Feld) – zum Arpeggio.
   v1.16: Der m-Moment gehört dem Steigungsdreieck: seine beiden Zahlen pulsen, wenn es
     fertig ist, zugleich mit Blubb und Landung von m. Der zweite Punkt erscheint leise
     und klein, wenn der Schenkel ihn erreicht – er ist Folge, nicht Ergebnis.
   v1.15: Ein Wert erscheint im Bild und in der Gleichung im selben Moment, mit einem
     Blubb; der Einsetz-Klang entfällt. b landet, wenn der Punkt pulst; m, wenn das
     Steigungsdreieck mit beiden Zahlen steht (bei Waagerecht: wenn die 0 steht). Die
     Landung im Gleichungsfeld ist größer und länger. Zeichnen spiegelbildlich: der
     hervorgehobene Wert leuchtet auf, wenn sein Punkt erscheint. Panel schneidet die
     Landung nicht mehr ab.
   v1.14: Gleichungsfeld: m rückt an „· x“ heran, b an sein Vorzeichen; die festen
     Mindestbreiten (gegen Zittern am Regler) bleiben, schmaler, die Luft liegt außen.
   v1.13: Szenenvergleich ignoriert Zeitangaben: Beschriftungen, die nur ihre Verzögerung
     verlieren, werden nicht neu aufgebaut (Koordinaten wuchsen beim Verbinden noch
     einmal). Verbinden: beide Punkte pulsen einmal, genau wenn die Gerade sie erreicht.
   v1.12: Gleichungsfeld: Werte und ganze Gleichung ziehen sich in einer durchgehenden
     Kurve zusammen (vorher ein Zwischen-Keyframe, der wie ein Stocken wirkte).
   v1.11: Versionsnummer klein in Blau hinter dem Titel statt in der grünen Themenzeile:
     sie gehört zum Material, nicht zum Thema.
   v1.10: Diffus-Moment kürzer (0,7 s) und die neue Szene erst danach – auch bei
     Reiterwechsel und Erkunder, deren Linien vorher schon im Unscharfen liefen.
   v1.9: Diffus-Moment lief nur beim ersten Abschnittswechsel (SVG-Elemente haben kein
     offsetWidth, der Reflow blieb aus); jetzt bei jedem.
   v1.8: Waagerechte Gerade im Abschnitt „Waagerecht“ grün wie jede Funktion beim
     Ablesen (Blau ist dort schon b: Strecke und Punkt auf der y-Achse; blaue Gerade
     und blaue Strecke sahen aus wie ein T). Blau und Rot bleiben die Kontrastfarben
     in Vergleich und Erkunder, wie in Info 3 auf dem Blatt.
   v1.7: Navigationsklänge nach Sprunggröße: Tick je Schritt, Zweiklang beim ersten
     Schritt eines Abschnitts aus jeder Richtung (auch rückwärts und „Von vorn“),
     Ball je Reiter. Der Diffus-Moment folgt derselben Regel. Bildklänge unverändert.
   v1.6: Ein Reiterklang für alle vier Reiter (Entscheidung Lehrkraft: verschiedene
     Tonhöhen wirkten unruhig). Waagerecht in der Reihenfolge des Ablesens: Gerade →
     b = 3 (nur der Punkt auf der y-Achse) → Steigungsdreieck, bei dem ein Pfeil
     nach oben in sich zusammenfällt → m = 0 → konstant → zum Schluss die Punkte
     mit y-Wert 3 als Probe. Kein Senkrechten-Test mehr bei der waagerechten
     Geraden; er bleibt bei der senkrechten, wo er das Argument trägt.
   v1.5: Reiterklang tiefer und dumpfer. Versionsnummer grün unter dem Titel.
   v1.4: Spezialfälle langsamer aufgebaut: Waagerecht in fünf Schritten (Gerade,
     Punkte mit y-Wert 3 → b = 3, flaches Steigungsdreieck → m = 0, dann
     f(x) = 0·x + 3 mit verblassendem 0·x und dem Wort „konstant“ als Ergebnis,
     Senkrechten-Test), Senkrecht in zwei (Punkte mit x-Wert 3 → g: x = 3,
     Senkrechten-Test). Testlinie dünn in hellem Orange, Treffer in der Farbe
     der getroffenen Geraden (blau auf f, rot auf g), auch im Erkunder.
   v1.3: Pfeilspitzen erst, wenn die Linie fertig gezeichnet ist. Neuer Abschnitt:
     Bild wird kurz diffus, dann erscheinen Gleichung (als Ganzes) und Szene.
     Fertig-Schritte ohne Punktprobe; stattdessen pulst die ganze Gleichung mit
     dem Arpeggio. Beim Verbinden läuft das Arpeggio mit dem Zeichnen der Geraden
     (1,2 s). Eigener tiefer Klang für den Reiterwechsel; das Abschnittssignal
     nur vorwärts.
   v1.2: Reiter in Abschnitte gegliedert (Einstieg, Beispiel 1, 2 …, Erkunder);
     Kopfzeile und Punktreihe zeigen den Abschnitt; Weiter und Auto-Lauf bleiben
     im Reiter und beginnen am Ende von vorn. Vollbild-Knopf. Klangsatz neu
     (Marimba-Tick, Blubb, Glockenklang beim Einsetzen, Arpeggio am Ende).
     Punkte und Beschriftungen erscheinen groß und ziehen sich zusammen,
     Werte im Gleichungsfeld ebenso, langsamer. Gleichungsfeld fest hoch und
     mit festen Spalten für m und b (kein Zittern beim Regler). Schriften im
     grünen Feld und an den Achsen größer. Erkunder in den Spezialfällen
     (waagerechte und senkrechte Gerade, Testlinie). „Achtung“ gestrichen.
   v1.1: Gleichungsfeld, zweites Beispiel in Reiter 1, ohne Vorlesen, Libertinus
     Sans und Indie Flower eingebettet (Fontsource-Subsets).
   Farbcode wie auf dem Blatt: m orange, b blau, Gerade grün, senkrechte Gerade rot.
   Maßeinheit --u: 1 % der Breite eines 4:3-Bildschirms, auf 16:9 durch die Höhe begrenzt.
   ===================================================================== */

:root{
  --u: min(1vw, 1.3333vh);
  --blau:#0072B2; --gruen:#26870C; --rot:#B24A45; --orange:#D55E00; --braun:#8C5A33;
  --gruenhell:#E3EFDF; --blauhell:#EDF4FA; --rothell:#F6E9E9; --orangehell:#F9E7D9;
  --text:#1F2933; --grau:#6E6E6E; --linie:#D9DFE6;
  --hand:'Indie Flower','Bradley Hand','Chalkboard SE','Segoe Print','Comic Sans MS',cursive;
  --sans:'Libertinus Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--text);background:#F3F5F8;font-size:calc(2.15*var(--u));line-height:1.35;
  touch-action:manipulation;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;
  padding:calc(.9*var(--u)) calc(1.4*var(--u)) calc(.9*var(--u));gap:calc(.8*var(--u))}

/* ---------------------------------------------------------------- Kopf */
header{display:flex;align-items:center;gap:calc(1.5*var(--u))}
.titel{font-family:var(--hand);color:var(--blau);font-size:calc(2.9*var(--u));line-height:1;white-space:nowrap}
.titel small{display:block;font-family:inherit;font-size:calc(1.35*var(--u));color:var(--gruen);margin-top:calc(.25*var(--u))}
.titel .version{font-size:calc(1.35*var(--u));opacity:.62;margin-left:calc(.7*var(--u));vertical-align:baseline}
.titel .version a{color:inherit;text-decoration:none}.titel .version a:hover,.titel .version a:focus-visible{text-decoration:underline}

/* feste Mindestbreiten gegen Zittern; m rückt an „· x“ heran, b an das Vorzeichen: Luft bleibt nur außen, nicht zwischen zusammengehörigen Zeichen */
.gleichung .slot.sm{min-width:calc(5.4*var(--u));justify-content:flex-end} .gleichung .slot.sb{min-width:calc(5.8*var(--u));justify-content:flex-start}
.gleichung .ph{display:inline-block;min-width:1.25em;padding:0 .18em;border:2px dashed currentColor;border-radius:.25em;line-height:1.15;font-style:italic;font-weight:700;opacity:.7}

@keyframes neu{0%{transform:scale(2.3);opacity:.15;background:rgba(213,94,0,.22)}22%{opacity:1}55%{background:rgba(213,94,0,.22)}100%{transform:scale(1);opacity:1;background:transparent}}
.gleichung .neu.b{animation-name:neub}
/* Zeichnen: der schon stehende Wert leuchtet in seiner Farbe auf, wenn sein Punkt im Bild erscheint */

@keyframes blitz{0%{transform:scale(1)}35%{transform:scale(1.5);background:rgba(213,94,0,.3)}100%{transform:scale(1)}}
@keyframes blitzb{0%{transform:scale(1)}35%{transform:scale(1.5);background:rgba(0,114,178,.28)}100%{transform:scale(1)}}

@keyframes neub{0%{transform:scale(2.3);opacity:.15;background:rgba(0,114,178,.2)}22%{opacity:1}55%{background:rgba(0,114,178,.2)}100%{transform:scale(1);opacity:1;background:transparent}}

/* Hochkant (nicht vorgesehen, aber brauchbar): Bild oben, Text unten */
@media (orientation: portrait){

<body>
<div class="app">
  <header>
    <a class="heim" id="heim" href="/" aria-label="Zurück zu happymatty.de"><span class="pfeil">‹</span><img src="/stil/icon-192.png" alt=""></a>
    <div class="titel">Mehr als nur steil<small>Lineare Funktionen<span class="version">v1.22 · <a href="/datenschutz/" target="_blank" rel="noopener">Datenschutz</a></span></small></div>
    <nav class="tabs" id="tabs"></nav>
    <button id="voll" class="voll" title="Vollbild"><svg id="vollicon" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>

      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

  </footer>
</div>

<script>
/* =====================================================================
   Hilfen
   ===================================================================== */
const C={blau:'#0072B2',gruen:'#26870C',rot:'#B24A45',orange:'#D55E00',braun:'#8C5A33',text:'#1F2933',grau:'#6E6E6E',test:'#F2A65A'};
const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOut=p=>1-Math.pow(1-p,3);
// groß erscheinen, dann zusammenziehen (Punkte und Beschriftungen)
const popBig=p=>p<.32?2.1*easeOut(p/.32):2.1-1.1*easeInOut((p-.32)/.68);
// kurz groß werden und zurück (Werte, die schon stehen)
const pulsKurve=p=>1+0.8*(p<.35?easeOut(p/.35):1-easeInOut((p-.35)/.65));
// SVG-Text um die eigene Mitte skalieren – als Transformation mit getBBox, nicht über transform-origin (Safari ignoriert das bei Text)
function pulsText(ts,s){ts.forEach(t=>{if(!t)return;if(s===1){t.removeAttribute('transform');return;}let bb;try{bb=t.getBBox();}catch(e){return;}
  const cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;t.setAttribute('transform',`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);});}
function tween(ms,fn,ease=easeInOut,delay=0){
  let raf=null,t0=null,tm=null,cancelled=false;
  const h={cancel(){cancelled=true;if(raf)cancelAnimationFrame(raf);if(tm)clearTimeout(tm);},onDone:null};
  const frame=now=>{if(cancelled)return;if(t0===null)t0=now;const p=Math.min(1,(now-t0)/ms);fn(ease(p),p);
    if(p<1)raf=requestAnimationFrame(frame);else if(h.onDone)h.onDone();};
  if(delay>0)tm=setTimeout(()=>{raf=requestAnimationFrame(frame);},delay);else raf=requestAnimationFrame(frame);
  return h;
}
const dez=x=>(Math.round(x*100)/100).toString().replace('.',',').replace('-','−');
const neg=s=>String(s).replace('-','−');

/* =====================================================================
   Graph: Koordinatensystem mit animierten Elementen
   Szene = Liste von Elementen mit id und type. render() vergleicht mit dem
   Vorzustand: neue Elemente erscheinen animiert, entfallene blenden aus,
   geänderte Geraden und Punkte gleiten.
   ===================================================================== */
class Graph{
  constructor(svg){this.svg=svg;this.U=60;this.pad=16;this.els=new Map();this.view=null;this.timers=[];}
  X(x){return this.pad+(x-this.view.xmin)*this.U}
  Y(y){return this.pad+(this.view.ymax-y)*this.U}
  setView(v){
    if(this.view&&this.view.xmin===v.xmin&&this.view.xmax===v.xmax&&this.view.ymin===v.ymin&&this.view.ymax===v.ymax)return false;
    this.clear(false);this.view=v;const U=this.U,p=this.pad;
    const W=(v.xmax-v.xmin)*U+2*p,H=(v.ymax-v.ymin)*U+2*p;this.W=W;this.H=H;
    this.svg.setAttribute('viewBox',`0 0 ${W} ${H}`);this.svg.innerHTML='';
    const defs=mk('defs');
    const clip=mk('clipPath',{id:'plot'});clip.appendChild(mk('rect',{x:p,y:p,width:W-2*p,height:H-2*p}));defs.appendChild(clip);
    const mkArrow=(id,col)=>{const m=mk('marker',{id,viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto-start-reverse'});
      m.appendChild(mk('path',{d:'M0 0L10 5L0 10z',fill:col}));return m;};
    defs.appendChild(mkArrow('pfeilAchse','#333'));defs.appendChild(mkArrow('pfeilOrange',C.orange));
    this.svg.appendChild(defs);
    const g=mk('g',{class:'grid'});
    for(let x=Math.ceil(v.xmin);x<=Math.floor(v.xmax);x++)g.appendChild(mk('line',{x1:this.X(x),x2:this.X(x),y1:p,y2:H-p,stroke:'#DCE3EA','stroke-width':1}));
    for(let y=Math.ceil(v.ymin);y<=Math.floor(v.ymax);y++)g.appendChild(mk('line',{y1:this.Y(y),y2:this.Y(y),x1:p,x2:W-p,stroke:'#DCE3EA','stroke-width':1}));
    this.svg.appendChild(g);
    const ax=mk('g');
    ax.appendChild(mk('line',{x1:p,x2:W-p-2,y1:this.Y(0),y2:this.Y(0),stroke:'#333','stroke-width':1.8,'marker-end':'url(#pfeilAchse)'}));
    ax.appendChild(mk('line',{x1:this.X(0),x2:this.X(0),y1:H-p,y2:p+2,stroke:'#333','stroke-width':1.8,'marker-end':'url(#pfeilAchse)'}));

  clear(anim){for(const id of [...this.els.keys()])this.exit(id,anim);this.timers.forEach(clearTimeout);this.timers.length=0;}

/* =====================================================================
   Ton: kleiner Klangsatz über Web Audio – Marimba-Tick beim Weiterschalten,
   Blubb für Punkte, Glockenklang beim Einsetzen, Arpeggio am Ende, Signal
   beim Abschnittswechsel. Alles leise, mit etwas Hall.

const Sound={ctx:null,on:true,out:null,
  init(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;this.ctx=new A();

  tick(){const t=this.now();this.note(740,t,0.22,0.05,[[1,1],[4,.28],[10,.06]],'sine',0.985)},          // Marimba
  pop(){const w=performance.now();if(w-(this.lastPop||0)<60)return;this.lastPop=w;const t=this.now();this.note(520,t,0.2,0.035,[[1,1],[2,.2]],'sine',1.7)}, // Blubb: etwas erscheint – im Bild und in der Gleichung zugleich ein Klang
  ding(){const t=this.now();[523,659,784,1047].forEach((f,i)=>this.note(f,t+i*0.11,0.9,0.04,[[1,1],[2,.25],[3,.1]]))},       // fertig
  neu(){const t=this.now();this.note(659,t,0.35,0.04,[[1,1],[2,.3]]);this.note(988,t+0.16,0.6,0.04,[[1,1],[2,.2]])},        // neuer Abschnitt

/* =====================================================================
   Gleichungsfeld: f(x) = [m] · x + [b], bleibt über alle Schritte stehen
   eq: {name, m (HTML oder null), b (Zahl oder null), hl ('m'|'b'), delay}
   oder {html}. Geänderte Teile erscheinen groß und ziehen sich zusammen;
   mit delay fließt der Wert erst nach der Erklärung in die Gleichung.
   ===================================================================== */
const Gl={el:null,st:{name:null,m:null,b:null,html:null},timer:null,
  html(e){const nm=`<i>${e.name}</i>(<i>x</i>)&nbsp;=&nbsp;`;
    const mP=`<span class="slot sm">${e.m==null?`<span class="ph m">m</span>`:`<span class="val m${e.hl==='m'?' hl':''}" data-p="m">${e.m}</span>`}</span>`;
    const bP=`<span class="slot sb">${e.b==null?`<span class="op">+</span>&nbsp;<span class="ph b">b</span>`:`<span class="val b${e.hl==='b'?' hl':''}" data-p="b">${e.b<0?'−':'+'} ${Math.abs(e.b)}</span>`}</span>`;
    return `<span class="ganz">`+nm+mP+`&nbsp;·&nbsp;<i>x</i>&nbsp;`+bP+`</span>`;},
  put(e,anim){const prev=this.st;this.st={name:e.name||null,m:e.m==null?null:e.m,b:e.b==null?null:e.b,html:e.html||null};
    this.el.innerHTML=e.html?`<span class="ganz">${e.html}</span>`:this.html(e);
    if(!anim)return;
    if(e.html){if(e.html!==prev.html)this.el.querySelector('.ganz').classList.add('neu');return;}
    const neu=[];if(prev.name!==e.name){this.el.querySelector('.ganz').classList.add('neu');return [];}
    if(String(prev.m)!==String(e.m))neu.push('m');if(prev.b!==e.b)neu.push('b');
    if(e.pulse){const bl=p=>{const s=this.el.querySelector(`.val[data-p="${p}"]`);if(s){s.classList.remove('blitz');s.getBoundingClientRect();s.classList.add('blitz');}};bl('b');bl('m');return [];}
    neu.forEach(p=>{const s=this.el.querySelector(`.val[data-p="${p}"]`);if(s)s.classList.add('neu');});
    return neu;},
  set(e,anim){clearTimeout(this.timer);(this.tms||[]).forEach(clearTimeout);this.tms=[];if(!e){this.el.innerHTML='';this.st={name:null,m:null,b:null,html:null};return;}
    const prev=this.st;
    const fuellt=!e.html&&anim&&e.delay&&prev.name===e.name&&(String(prev.m)!==String(e.m)||prev.b!==e.b); // Wert kommt dazu oder ändert sich: alter Stand bleibt bis zum Moment im Bild
    const neuName=!e.html&&anim&&e.delay&&prev.name!==e.name&&(e.m!=null||e.b!=null);
    const spaeter=()=>{const neu=this.put(e,true)||[];if(neu.length&&!e.pulse)Sound.pop();};
    if(e.flash&&anim)Object.entries(e.flash).forEach(([p,at])=>this.tms.push(setTimeout(()=>{const s=this.el.querySelector(`.val[data-p="${p}"]`);if(s){s.classList.remove('blitz');s.getBoundingClientRect();s.classList.add('blitz');}},at)));
    if(e.html&&e.delay&&anim){this.put({html:'&nbsp;'},false);this.timer=setTimeout(()=>{this.put(e,true);Sound.pop();},e.delay);}
    else if(fuellt){this.put(Object.assign({},e,{m:prev.m!=null?prev.m:null,b:prev.b!=null?prev.b:null,hl:null}),false);this.timer=setTimeout(spaeter,e.delay);}
    else if(neuName){this.put({name:e.name,m:null,b:null},false);this.timer=setTimeout(spaeter,e.delay);}
    else this.put(e,anim);}};

// Steigungen als Brüche [Zähler, Nenner]; der Regler läuft über den Index.
const MV=[[-3,1],[-5,2],[-2,1],[-3,2],[-1,1],[-3,4],[-2,3],[-1,2],[-1,3],[-1,4],[0,1],[1,4],[1,3],[1,2],[2,3],[3,4],[1,1],[3,2],[2,1],[5,2],[3,1]];
const Explorer={active:false,mi:14,b:-3,demo:null,
  get m(){return MV[this.mi][0]/MV[this.mi][1];},
  tri(){const [z,n]=MV[this.mi];if(z===0)return null;return [n,z];},
  mText(){const [z,n]=MV[this.mi];if(n===1)return neg(z);return (z<0?'−':'')+fr(Math.abs(z),n);},
  scene(){const m=this.m,b=this.b,t=this.tri(),v=VA;const sc=[line('f',m,b)];
    let xe=v.xmax-0.3;if(m>0)xe=Math.min(xe,(v.ymax-0.3-b)/m);else if(m<0)xe=Math.min(xe,(v.ymin+0.3-b)/m);
    if(xe>-2)sc.push(lab('lf',xe,m*xe+b,'f',{fn:true,color:C.gruen,anchor:'end',dy:m>0?26:-12}));
    if(Math.abs(b)>1e-9)sc.push(seg('bs',0,0,0,b));sc.push(pt('P0',0,b),lab('lb',b===0?-0.5:LX,b,'b = '+neg(b),{color:C.blau,anchor:'end',dy:b===0?-10:8}));
    if(t)sc.push(tri('T',0,b,t[0],t[1]),pt('P1',t[0],b+t[1],{color:C.gruen}));return sc;},
  draw(anim=false){graph.render(this.scene(),anim);this.show(anim);},
  show(anim){const mw=document.getElementById('mw'),bw=document.getElementById('bw');if(!mw)return;
    const mt=this.mText();mw.innerHTML='m = '+mt+(MV[this.mi][1]!==1?' = '+dez(this.m):'');bw.textContent='b = '+neg(this.b);
    Gl.set({name:'f',m:mt,b:this.b},anim);
    const hm=document.getElementById('hm'),hb=document.getElementById('hb');
    hm.innerHTML=this.m>0?'<span class="m">m &gt; 0: die Gerade steigt</span>':this.m<0?'<span class="m">m &lt; 0: die Gerade fällt</span>':'<span class="m">m = 0: konstante Funktion</span>';
    hb.innerHTML=this.b===0?'<span class="b">b = 0: Ursprungsgerade</span>':`<span class="b">b = ${neg(this.b)}: schneidet die y-Achse bei ${neg(this.b)}</span>`;
    const rm=document.getElementById('rm'),rb=document.getElementById('rb');if(rm)rm.value=this.mi;if(rb)rb.value=this.b;},
  html(){return `<div class="regler">
    <label><span class="wert m" id="mw"></span><input type="range" class="m-r" id="rm" min="0" max="${MV.length-1}" step="1" value="${this.mi}"></label>
    <label><span class="wert b" id="bw"></span><input type="range" class="b-r" id="rb" min="-5" max="3" step="1" value="${this.b}"></label>
    <div class="hinweise"><div id="hm"></div><div id="hb"></div></div></div>
    <p>Was passiert, wenn ${M('m')} negativ wird? Wenn ${M('m')} = 0 ist? Wenn ${B('b')} größer wird?</p>`;},
  start(auto){this.active=true;this.mi=14;this.b=-3;
    const rm=document.getElementById('rm'),rb=document.getElementById('rb');
    const stopDemo=()=>{if(this.demo){this.demo.cancel();this.demo=null;}};
    rm.addEventListener('input',()=>{stopDemo();this.mi=parseInt(rm.value,10);this.draw();});
    rb.addEventListener('input',()=>{stopDemo();this.b=parseFloat(rb.value);this.draw();});
    rm.addEventListener('pointerdown',stopDemo);rb.addEventListener('pointerdown',stopDemo);
    this.draw(true);if(auto)this.runDemo();},
  runDemo(){const seq=[['b',-3,2,2600],['b',2,-3,2600],['mi',14,2,3400],['mi',2,20,4200],['mi',20,14,2000]];let i=0;
    const next=()=>{if(i>=seq.length||!this.active){this.demo=null;return;}const [k,a,z,ms]=seq[i++];let last=null;
      this.demo=tween(ms,p=>{const v=Math.round(a+(z-a)*p);if(v!==last){last=v;this[k]=v;this.draw();}});this.demo.onDone=next;};
    next();},
  stop(){this.active=false;if(this.demo){this.demo.cancel();this.demo=null;}}};

    if(Math.abs(this.t-this.d)<1e-9)sc.push(dots('hs',[-1,0,1,2,3,4,5].filter(y=>Math.abs(y-this.c)>1e-9).map(y=>[this.d,y]),{color:C.rot,r:7.5,stagger:60}));
    return sc;},
  draw(anim=false){graph.render(this.scene(),anim);this.show();},
  show(){const cw=document.getElementById('cw'),dw=document.getElementById('dw'),tw=document.getElementById('tw');if(!cw)return;
    cw.innerHTML=`<i>f</i>(<i>x</i>) = ${neg(this.c)}`;dw.innerHTML=`<i>g</i>: <i>x</i> = ${neg(this.d)}`;tw.innerHTML=`Testlinie <i>x</i> = ${dez(this.t)}`;
    Gl.set({html:`<span class="bl"><i>f</i>(<i>x</i>) = ${neg(this.c)}</span>&nbsp;&nbsp;<span class="op">und</span>&nbsp;&nbsp;<span class="rt"><i>g</i>: <i>x</i> = ${neg(this.d)}</span>`},false);
    const h1=document.getElementById('h1'),h2=document.getElementById('h2');
    h1.innerHTML=`<span class="bl">Die Testlinie trifft <i>f</i> genau einmal – immer.</span>`;
    h2.innerHTML=Math.abs(this.t-this.d)<1e-9?`<span class="rt">Bei <i>x</i> = ${neg(this.d)} trifft sie <i>g</i> unendlich oft!</span>`:`<span class="rt">Sie trifft <i>g</i> gar nicht – nur bei <i>x</i> = ${neg(this.d)}.</span>`;
    const rc=document.getElementById('rc'),rd=document.getElementById('rd'),rt=document.getElementById('rt');if(rc)rc.value=this.c;if(rd)rd.value=this.d;if(rt)rt.value=this.t;},
  html(){return `<div class="regler">
    <label><span class="wert bl" id="cw"></span><input type="range" class="b-r" id="rc" min="-1" max="5" step="1" value="${this.c}"></label>
    <label><span class="wert rt" id="dw"></span><input type="range" class="r-r" id="rd" min="-1" max="5" step="1" value="${this.d}"></label>
    <label><span class="wert" id="tw" style="color:#555"></span><input type="range" class="t-r" id="rt" min="-1" max="5" step="0.5" value="${this.t}"></label>
    <div class="hinweise"><div id="h1"></div><div id="h2"></div></div></div>
    <p>Schiebe die Testlinie über beide Geraden. Verschiebe dann <i>f</i> und <i>g</i>.</p>`;},
  start(auto){this.active=true;this.c=3;this.d=3;this.t=1;
    const rc=document.getElementById('rc'),rd=document.getElementById('rd'),rt=document.getElementById('rt');
    const stopDemo=()=>{if(this.demo){this.demo.cancel();this.demo=null;}};
    rc.addEventListener('input',()=>{stopDemo();this.c=parseFloat(rc.value);this.draw();});
    rd.addEventListener('input',()=>{stopDemo();this.d=parseFloat(rd.value);this.draw();});
    rt.addEventListener('input',()=>{stopDemo();this.t=parseFloat(rt.value);this.draw();});
    [rc,rd,rt].forEach(r=>r.addEventListener('pointerdown',stopDemo));
    this.draw(true);if(auto)this.runDemo();},
  runDemo(){const seq=[['t',1,5,3600],['t',5,-1,3600],['c',3,5,1400],['c',5,1,1800],['d',3,1,1400],['d',1,4,1800],['t',-1,4,3000]];let i=0;
    const next=()=>{if(i>=seq.length||!this.active){this.demo=null;return;}const [k,a,z,ms]=seq[i++];let last=null;
      this.demo=tween(ms,p=>{const v=k==='t'?Math.round((a+(z-a)*p)*2)/2:Math.round(a+(z-a)*p);if(v!==last){last=v;this[k]=v;this.draw();}});this.demo.onDone=next;};
    next();},
  stop(){this.active=false;if(this.demo){this.demo.cancel();this.demo=null;}}};
const EXPL={explorer:Explorer,explorerS:ExplorerS};

/* =====================================================================
   Steuerung
   ===================================================================== */
const WECHSEL=700; // Dauer des Diffus-Moments in ms, gleich der CSS-Animation
const graph=new Graph(document.getElementById('svg'));graph.svg.addEventListener('animationend',()=>graph.svg.classList.remove('wechsel'));
let cur={t:0,s:0},auto=false,seq=0,autoTimer=null;
const $=id=>document.getElementById(id);
const tabsEl=$('tabs'),gruppenEl=$('gruppen'),pbody=$('pbody'),ptitel=$('ptitel'),stepnr=$('stepnr'),pbar=$('pbar');
Gl.el=$('gleichung');

TABS.forEach((tab,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="nr">${i+1}</span>${tab.label}`;b.addEventListener('click',()=>{Sound.init();go(i,0);});tabsEl.appendChild(b);});

function go(t,s,opts={}){
  seq++;const mySeq=seq;clearTimeout(autoTimer);
  const vorher=cur;cur={t,s};const tab=TABS[t],step=tab.steps[s];
  const anim=opts.anim!==false;
  const reiter=vorher.t!==t;const neuerTeil=anim&&step.si===0&&(reiter||vorher.s!==s); // erster Schritt eines Abschnitts, aus jeder Richtung
  graph.setView(tab.view);
  Object.values(EXPL).forEach(x=>{if(x!==EXPL[step.kind])x.stop();});
  if(step.kind){graph.render([],false);}
  [...tabsEl.children].forEach((b,i)=>b.classList.toggle('aktiv',i===t));
  stepnr.innerHTML=`<span class="pill${neuerTeil?' neu':''}">${step.part.name}${step.part.sub?' · '+step.part.sub:''}</span><span>Schritt ${step.si+1} von ${step.part.steps.length}</span>`;
  ptitel.textContent=step.t;
  pbody.classList.remove('in');void pbody.offsetWidth;pbody.innerHTML=(step.kind?EXPL[step.kind].html():step.h).replace(/ \| /g,'&nbsp;|&nbsp;');pbody.classList.add('in');pbody.scrollTop=0;
  if(neuerTeil){const svg=graph.svg;svg.classList.remove('wechsel');svg.getBoundingClientRect();svg.classList.add('wechsel');} // SVG hat kein offsetWidth: getBoundingClientRect erzwingt den Reflow, sonst startet die Animation nur einmal
  // Neuer Abschnitt: erst der Diffus-Moment über dem leeren Koordinatensystem, dann die Szene
  const spaeter=fn=>setTimeout(()=>{if(mySeq===seq)fn();},WECHSEL);
  if(step.kind){if(neuerTeil)spaeter(()=>EXPL[step.kind].start(auto));else EXPL[step.kind].start(auto);}
  else if(neuerTeil){Gl.set(null,false);graph.render([],true);spaeter(()=>{Gl.set(step.eq||null,true);graph.render(step.sc,true);});}
  else{Gl.set(step.eq||null,anim);graph.render(step.sc,anim);}
  gruppenEl.innerHTML='';tab.parts.forEach((p,pi)=>{const g=document.createElement('div');g.className='gruppe'+(pi===step.pi?' aktiv':'');
    const n=document.createElement('div');n.className='gname';n.textContent=p.name;g.appendChild(n);const d=document.createElement('div');d.className='punkte';
    p.steps.forEach(st=>{const b=document.createElement('button');const i=tab.steps.indexOf(st);b.className=i<s?'fertig':i===s?'aktiv':'';b.title=st.t;b.addEventListener('click',()=>{Sound.init();go(t,i);});d.appendChild(b);});
    g.appendChild(d);gruppenEl.appendChild(g);});
  $('weitertext').textContent=s===tab.steps.length-1?'Von vorn':'Weiter';
  try{if(location.hash!=='#'+tab.id&&location.hash!=='#auto')history.replaceState(null,'','#'+tab.id);}catch(e){}
  if(opts.tick!==false){if(reiter)Sound.tab();else if(neuerTeil)Sound.neu();else Sound.tick();} // je größer der Sprung, desto tiefer: Schritt – Abschnitt – Reiter
  if(step.ding!=null&&anim)setTimeout(()=>{if(mySeq===seq)Sound.ding();},step.ding+(neuerTeil?WECHSEL:0));
  pbar.style.transition='none';pbar.style.width='0';
  if(auto){const rest=step.dur||7000;
    void pbar.offsetWidth;pbar.style.transition=`width ${rest}ms linear`;pbar.style.width='100%';
    autoTimer=setTimeout(()=>{if(mySeq===seq)next({tick:true});},rest);}
}
// Weiter bleibt im Reiter: am Ende beginnt der Reiter von vorn; die Reiter wechselt man oben.
function next(o={}){const tab=TABS[cur.t];go(cur.t,(cur.s+1)%tab.steps.length,o);}
function prev(){const tab=TABS[cur.t];go(cur.t,(cur.s-1+tab.steps.length)%tab.steps.length);}
function setAuto(on){auto=on;$('auto').classList.toggle('an',on);$('autotext').textContent=on?'Auto läuft':'Auto';
  $('autoicon').innerHTML=on?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  if(on)go(cur.t,cur.s,{anim:true,tick:false});else{seq++;clearTimeout(autoTimer);pbar.style.transition='none';pbar.style.width='0';Object.values(EXPL).forEach(x=>{if(x.active&&x.demo){x.demo.cancel();x.demo=null;}});}}

$('weiter').addEventListener('click',()=>{Sound.init();next();});
$('zurueck').addEventListener('click',()=>{Sound.init();prev();});
$('auto').addEventListener('click',()=>{Sound.init();setAuto(!auto);});
$('ton').addEventListener('click',()=>{Sound.init();Sound.on=!Sound.on;$('ton').classList.toggle('an',Sound.on);
  $('tonpfad').setAttribute('d',Sound.on?'M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z':'M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z');
  try{localStorage.setItem('lf2ton',Sound.on?'1':'0');}catch(e){}if(Sound.on)Sound.tick();});
try{if(localStorage.getItem('lf2ton')==='0'){$('ton').click();}}catch(e){}

// Vollbild (Pfeile auseinander / zusammen). Nicht jeder Browser erlaubt es; dann kurzer Hinweis.
const vollEl=document.documentElement;
const istVoll=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function vollIcon(){$('vollicon').innerHTML=istVoll()?'<path d="M10 4v6H4V8h4V4zm4 0h2v4h4v2h-6zM4 14h6v6H8v-4H4zm10 0h6v2h-4v4h-2z"/>':'<path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/>';}
$('voll').addEventListener('click',()=>{Sound.init();
  try{if(istVoll()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{const r=vollEl.requestFullscreen||vollEl.webkitRequestFullscreen;if(!r)throw 0;const p=r.call(vollEl);if(p&&p.catch)p.catch(()=>hinweis('Vollbild geht hier nicht – den Link in Safari öffnen'));}}
  catch(e){hinweis('Vollbild geht hier nicht – den Link in Safari öffnen');}});
document.addEventListener('fullscreenchange',vollIcon);document.addEventListener('webkitfullscreenchange',vollIcon);
let hinTimer=null;function hinweis(txt){const h=$('hinweis');h.textContent=txt;h.classList.add('zeig');clearTimeout(hinTimer);hinTimer=setTimeout(()=>h.classList.remove('zeig'),3500);}

// Tippen aufs Bild = weiter (nicht beim Erkunder, nicht nach Wischen)
let pd=null;const gEl=$('graph');
gEl.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,t:Date.now()};});
gEl.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;const ok=Math.hypot(dx,dy)<12&&Date.now()-pd.t<600;pd=null;
  if(ok&&!TABS[cur.t].steps[cur.s].kind){Sound.init();next();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}else if(e.key.toLowerCase()==='a'){setAuto(!auto);}});
window.addEventListener('hashchange',()=>{if(location.hash==='#auto'){if(!auto)setAuto(true);return;}const i=TABS.findIndex(t=>'#'+t.id===location.hash);if(i>=0&&i!==cur.t)go(i,0);});

// Start: #zeichnen usw. öffnet den Reiter, #auto startet den Auto-Lauf (für die Tafel)
(function(){let t=0;const i=TABS.findIndex(tb=>'#'+tb.id===location.hash);if(i>=0)t=i;
  go(t,0,{tick:false});if(location.hash==='#auto')setAuto(true);
  setTimeout(()=>hinweis('Tipp: Aufs Bild tippen = nächster Schritt'),1200);})();
</script>
<script>
/* Logo: zurück dorthin, wo man herkam (innerhalb von happymatty.de); bei Direktlink zur Startseite */
document.getElementById('heim').addEventListener('click',function(e){
  try{ if(document.referrer && new URL(document.referrer).origin===location.origin && history.length>1){ e.preventDefault(); history.back(); } }catch(_){}
});
</script>
